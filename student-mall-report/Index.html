<!DOCTYPE html>
<html lang="ms">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Pendapatan dan Perbelanjaan Usahawan Pelajar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f0ee; --surface: #ffffff; --fg: #2a2224; --muted: #6f6467; --line: #e8e0e1;
  --head: #f1e5e8; --accent: #5b1a33; --accent-fg: #ffffff; --accent-soft: #f6e6e8;
  --ok: #1f7a4d; --ok-soft: #e2f3ea; --warn: #9a5b00; --warn-soft: #fbefd5;
  --bad: #b3261e; --bad-soft: #fbe4e2; --info: #2c5d8f; --info-soft: #e3edf8;
  --idle: #6f6467; --idle-soft: #ece8e7; --scrim: rgba(30,15,20,.45);
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171415; --surface: #221e1f; --fg: #f1ecec; --muted: #a79ea0; --line: #3a3436; --head: #33262a;
    --accent: #e0707f; --accent-fg: #1b0f11; --accent-soft: #3a2327;
    --ok: #62c58f; --ok-soft: #1b3326; --warn: #e6b45a; --warn-soft: #3a2d14;
    --bad: #f08a83; --bad-soft: #3d1f1d; --info: #86b4e6; --info-soft: #1e2d40;
    --idle: #a79ea0; --idle-soft: #2e2829; --scrim: rgba(0,0,0,.6); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.wrap > * { min-width: 0; }
#view.wrap { margin: 0; width: 100%; max-width: none; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
button, input, select, textarea { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); transform: scaleX(0); transform-origin: left; opacity: 0; transition: opacity .2s; z-index: 50; }
body.busy #progress { opacity: 1; animation: load 1.4s ease-in-out infinite; }
@keyframes load { 0% { transform: scaleX(.05); } 60% { transform: scaleX(.8); } 100% { transform: scaleX(.98); } }
@media (prefers-reduced-motion: reduce) { body.busy #progress { animation: none; transform: scaleX(.6); } }

.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.logo { height: 52px; width: auto; max-width: 100%; border-radius: 4px; background: #fff; padding: 2px; }
.bt { min-width: 0; padding-left: 16px; border-left: 1px solid var(--line); }
.bt small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.bt strong { font-size: 17px; font-weight: 700; }
.who { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.who b { color: var(--fg); font-weight: 600; }
.linkbtn { color: var(--accent); background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 0; }
.role { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.role.t { background: var(--idle-soft); color: var(--idle); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { font-weight: 600; padding: 10px 16px; border: 0; background: none; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.stat small { display: block; font-size: 11.5px; color: var(--muted); }
.stat strong { font-size: 18px; font-family: var(--font-mono); font-weight: 500; }
.stat.bad strong { color: var(--bad); }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar .grow { flex: 1 1 200px; min-width: 0; }
.bar input, .bar select { width: 100%; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.bar select { width: auto; }
.btn { font-weight: 600; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); padding: 10px 18px; border-radius: 8px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.good { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.sm { padding: 4px 12px; font-weight: 500; font-size: 13px; border-color: var(--accent); color: var(--accent); background: var(--surface); }
.btn.sm.del { border-color: color-mix(in srgb, var(--bad) 55%, var(--surface)); color: var(--bad); }
.btn.sm.fill { background: var(--accent); color: var(--accent-fg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
body.busy .btn { pointer-events: none; }

.tbl-wrap { background: var(--surface); border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 820px; }
thead th { background: var(--head); text-align: left; font-size: 13px; font-weight: 700; padding: 11px 12px; white-space: nowrap; }
tbody td { padding: 11px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
.nw { white-space: nowrap; }
td.num, th.num { text-align: right; }
td.act { text-align: right; white-space: nowrap; }
td.act .btn + .btn { margin-left: 4px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-ok { color: var(--ok); background: var(--ok-soft); } .s-info { color: var(--info); background: var(--info-soft); }
.s-bad { color: var(--bad); background: var(--bad-soft); } .s-warn { color: var(--warn); background: var(--warn-soft); }
.s-idle { color: var(--idle); background: var(--idle-soft); }
.late { font-size: 11.5px; color: var(--bad); margin-left: 6px; }
.cmt { display: block; font-size: 12px; color: var(--bad); max-width: 260px; margin-top: 3px; }
.sub { display: block; font-size: 12px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 28px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.card .ch { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; }
.card .ch h2 { margin: 0; font-size: 16px; } .card .ch p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.card .cb { padding: 20px; display: flex; flex-direction: column; gap: 22px; }
.sech { margin: 0 0 10px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; }
.req { color: var(--bad); }
.fi { width: 100%; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.fi[readonly], .fi:disabled { color: var(--muted); }
textarea.fi { min-height: 72px; resize: vertical; }
.help { font-size: 12px; color: var(--muted); }
.money { display: flex; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); overflow: hidden; }
.money span { padding: 8px 10px; color: var(--muted); border-right: 1px solid var(--line); font-size: 13px; }
.money input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font-family: var(--font-mono); padding: 8px 10px; text-align: right; }
.money:focus-within { border-color: var(--accent); } .money input:focus-visible { outline: none; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; align-self: flex-start; }
.toggle button { padding: 7px 18px; border: 0; background: var(--bg); color: var(--fg); cursor: pointer; }
.toggle button + button { border-left: 1px solid var(--line); }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.toggle button:disabled { cursor: default; }
.file { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
.file .meta { flex: 1 1 240px; min-width: 0; } .file b { display: block; font-size: 13px; }
.fname { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.file.off { opacity: .55; }
.file .fa { display: flex; gap: 8px; }
.declare { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: var(--bg); border-radius: 8px; font-size: 13px; }
.declare input { margin-top: 3px; accent-color: var(--accent); }
.banner { border: 1px solid currentColor; border-radius: 8px; padding: 10px 14px; }
.banner b { display: block; } .banner p { margin: 2px 0 0; color: var(--fg); white-space: pre-wrap; } .banner span { font-size: 12px; }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.calc div { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.calc small { display: block; font-size: 11.5px; color: var(--muted); }
.calc strong { font-family: var(--font-mono); font-size: 16px; font-weight: 500; }
.neg { color: var(--bad); } .pos { color: var(--ok); }

.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; z-index: 10; }
.dlg { background: var(--surface); border-radius: 12px; width: min(660px, 100%); margin: auto; display: flex; flex-direction: column; }
.dlg.sm { width: min(440px, 100%); }
.dhead { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.dhead h2 { margin: 0; font-size: 17px; } .dhead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.dhead .x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
.dbody { padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
.dfoot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); }
.toast.err { background: var(--bad); color: #fff; }
.errbox { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 500; }

.login { max-width: 420px; margin: 8vh auto 0; display: flex; flex-direction: column; gap: 16px; }
.login .logo { height: 64px; align-self: flex-start; }
.login h1 { margin: 0; font-size: 20px; }
.login .card { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.otp { font-family: var(--font-mono); font-size: 24px; letter-spacing: 8px; text-align: center; }
</style>
</head>

  var MS = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
  var ST = { ok: ['s-ok', 'Disahkan'], sent: ['s-info', 'Dihantar'], fix: ['s-bad', 'Perlu dibetulkan'], none: ['s-warn', 'Belum dihantar'] };
  var KINDS = [['laporan', 'Laporan kewangan bulanan'], ['sewa', 'Resit bayaran sewa'], ['incubator', 'Resit bayaran incubator']];
  var MAX = 10 * 1024 * 1024;

  var S = { token: null, user: null, tab: null, login: { step: 'email', email: '', msg: '', err: '' },
            fin: null, finQ: '', finStatus: '', biz: null,
            adm: null, admQ: '', admStatus: '', admLokasi: '', admY: null, admM: null, lots: null, users: null };
  var D = null;   // dialog laporan penyewa
  var pending = 0;

  /* ---------- bantuan ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmt(n) { return n === null || n === undefined || n === '' ? '-' : Number(n).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function pill(k) { return '<span class="pill ' + ST[k][0] + '">' + ST[k][1] + '</span>'; }
  function store(k, v) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { /* abaikan */ } }
  function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  function toast(msg, isErr) {
    var el = $('toast-slot');
    el.innerHTML = '<div class="toast' + (isErr ? ' err' : '') + '" role="status">' + esc(msg) + '</div>';
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { el.innerHTML = ''; }, isErr ? 5000 : 2400);
  }

  function api(method, params) {
    pending++; document.body.classList.add('busy');
    return new Promise(function (resolve, reject) {
      function done() { pending--; if (pending <= 0) { pending = 0; document.body.classList.remove('busy'); } }
      google.script.run
        .withSuccessHandler(function (r) {
          done();
          if (r && r.ok) return resolve(r.data);
          if (r && r.code === 'SESSION' && S.token) { endSession(r.error); }
          reject(new Error(r && r.error ? r.error : 'Ralat tidak diketahui.'));
        })
        .withFailureHandler(function (e) { done(); reject(new Error((e && e.message) || 'Sambungan gagal. Cuba lagi.')); })
        .rpc(method, S.token, params || {});
    });
  }

  function endSession(msg) {
    S.token = null; S.user = null; store('tok', null); D = null; $('dlg-slot').innerHTML = '';
    S.login = { step: 'email', email: S.login.email || '', msg: '', err: msg || '' };
    S.fin = S.adm = S.biz = S.lots = S.users = null;
    render();
  }

  function run(p, errTarget) { return p.catch(function (e) { toast(e.message, true); if (errTarget) errTarget(e); }); }

  function download(name, mime, b64OrText, isB64) {
    var blob;
    if (isB64) {
      var bin = atob(b64OrText), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      blob = new Blob([arr], { type: mime });
    } else { blob = new Blob([b64OrText], { type: mime }); }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  function openFile(tahun, bulan, kind, kodLot) {
    run(api('getFile', { tahun: tahun, bulan: bulan, kind: kind, kodLot: kodLot }).then(function (f) { download(f.name, f.mime, f.base64, true); }));
  }

  /* ---------- kerangka ---------- */
  function header() {
    var admin = S.user.peranan === 'Admin';
    return '<header class="top"><div class="brand"><img class="logo" src="' + LOGO + '" alt="UTM dan UTMXCITE" height="52" style="height:52px;width:auto;max-width:100%"><div class="bt"><small>Student Mall &amp; SUB</small><strong>' +
      'Laporan Pendapatan dan Perbelanjaan Usahawan Pelajar' + '</strong></div></div>' +
      '<div class="who"><span><b>' + esc(S.user.email) + '</b></span><span class="role' + (admin ? '' : ' t') + '">' + esc(S.user.peranan) + '</span><button class="linkbtn" data-act="logout" type="button">Log keluar</button></div></header>';
  }

  function tabsHtml(list) {
    return '<div class="tabs" role="tablist">' + list.map(function (t) {
      return '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '" type="button">' + t[1] + '</button>';
    }).join('') + '</div>';
  }

  function render() {
    var app = $('app');
    if (!S.token) { app.innerHTML = loginHtml(); return; }
    var admin = S.user.peranan === 'Admin';
    var tabs = admin ? [['adm', 'Semua Laporan'], ['lots', 'Lot'], ['users', 'Pengguna']] : [['info', 'Maklumat Peniaga'], ['fin', 'Laporan Kewangan']];
    if (!S.tab) S.tab = tabs[0][0];
    app.innerHTML = '<div class="wrap">' + header() + tabsHtml(tabs) + '<div id="view" class="wrap"></div></div>';
    loadTab();
  }

  function loadTab() {
    var v = $('view');
    v.innerHTML = '<p class="note">Memuatkan…</p>';
    if (S.tab === 'info') run(api('getBusiness').then(function (d) { S.biz = d; v.innerHTML = bizHtml(); }));
    else if (S.tab === 'fin') run(api('myReports', { tahun: S.fin && S.fin.tahun }).then(function (d) { S.fin = d; v.innerHTML = finHtml(); }));
    else if (S.tab === 'adm') loadAdm();
    else if (S.tab === 'lots') run(api('adminLots').then(function (d) { S.lots = d.lots; v.innerHTML = lotsHtml(); }));
    else if (S.tab === 'users') run(Promise.all([api('adminUsers'), api('adminLots')]).then(function (r) { S.users = r[0].users; S.lots = r[1].lots; v.innerHTML = usersHtml(); }));

  function openReport(year, month, isNew) {

      D = { isNew: !!isNew, year: year, month: month, rep: rep, pending: {}, err: '',

  function moneyIn(id, label, val, edit) {
    return '<div class="field"><label for="' + id + '">' + label + (edit ? ' <span class="req">*</span>' : '') + '</label><div class="money"><span>RM</span><input id="' + id + '" inputmode="decimal" placeholder="0.00" value="' + (val === null || val === '' ? '' : esc(val)) + '"' + (edit ? '' : ' disabled') + '></div></div>';
  }

  function fileRow(kind, title, edit, off) {
    if (off) return '<div class="file off"><div class="meta"><b>' + title + '</b><span class="fname">Tidak diperlukan jika tiada sewa peralatan UTMXCITE.</span></div></div>';
    var pf = D.pending[kind], ex = D.rep.files[kind];
    var name = pf ? pf.name + ' · belum dimuat naik' : ex ? ex.name + ' · ' + (ex.size / 1048576).toFixed(1) + ' MB' : 'Belum ada fail. PDF sahaja, maksimum 10 MB.';

      (ex && !pf ? '<button class="btn sm" data-act="viewfile" data-kind="' + kind + '" type="button">Lihat</button>' : '') +
      (edit ? '<button class="btn sm" data-act="pick" data-kind="' + kind + '" type="button">' + (ex || pf ? 'Ganti fail' : 'Pilih fail PDF') + '</button>' : '') + '</div></div>';
  }

  function drawDlg() {
    var slot = $('dlg-slot');
    if (!D) { slot.innerHTML = ''; return; }
    var old = slot.querySelector('.scrim'), top = old ? old.scrollTop : 0;
    var rep = D.rep, v = D.v, edit = rep.boleh;
    var banner = '';
    if (rep.status === 'fix') banner = '<div class="banner s-bad"><b>Admin meminta pembetulan</b><p>' + esc(rep.komen) + '</p><span>' + esc(rep.disemakOleh) + ' · ' + esc(fmtDT(rep.tarikhSemak)) + '</span></div>';
    if (rep.status === 'sent') banner = '<div class="banner s-info"><b>Menunggu semakan admin</b><p>Anda masih boleh mengedit sehingga admin menyemak.</p></div>';
    if (rep.status === 'ok') banner = '<div class="banner s-ok"><b>Disahkan</b><p>Laporan ini dikunci dan tidak boleh diubah.</p></div>';
    var month = '';
    if (D.isNew) {
      month = '<div class="field"><label for="d-month">Bulan laporan <span class="req">*</span></label><select class="fi" id="d-month" style="max-width:240px">' +
        S.fin.rows.filter(function (r) { return r.status === 'none'; }).map(function (r) { return '<option value="' + r.bulan + '"' + (r.bulan === D.month ? ' selected' : '') + '>' + esc(r.bulanNama) + ' ' + r.tahun + '</option>'; }).join('') +
        '</select><span class="help">Hanya bulan yang belum dihantar dipaparkan.</span></div>';
    }
    var inc = Number(String(v.pendapatan === null ? '' : v.pendapatan).replace(/,/g, '')), exp = Number(String(v.perbelanjaan === null ? '' : v.perbelanjaan).replace(/,/g, ''));
    var calc = '';
    if (v.pendapatan !== null && v.pendapatan !== '' && v.perbelanjaan !== null && v.perbelanjaan !== '' && isFinite(inc) && isFinite(exp)) {
      var net = Math.round((inc - exp) * 100) / 100;
      calc = '<div class="calc"><div><small>' + (net < 0 ? 'Rugi bulan ini' : 'Untung bulan ini') + '</small><strong class="' + (net < 0 ? 'neg' : 'pos') + '">' + (net < 0 ? '-' : '') + 'RM ' + fmt(Math.abs(net)) + '</strong></div></div>';
    }
    slot.innerHTML = '<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt">' +
      '<div class="dhead"><div><h2 id="dt">' + (D.isNew ? 'Laporan baharu' : (!edit ? 'Lihat' : rep.status === 'none' ? 'Kemas kini' : 'Edit') + ' laporan ' + esc(rep.bulanNama) + ' ' + rep.tahun) + '</h2>' +
      '<p>' + esc(S.fin.lot.nama) + ' · tarikh akhir ' + esc(rep.tarikhAkhirLabel) + '</p></div><button class="x" data-act="closedlg" aria-label="Tutup" type="button">×</button></div>' +
      '<div class="dbody">' + (D.err ? '<div class="errbox" role="alert">' + esc(D.err) + '</div>' : '') + month + banner +
      '<div class="grid">' + moneyIn('d-inc', 'Jumlah pendapatan bulanan', v.pendapatan, edit) + moneyIn('d-exp', 'Jumlah perbelanjaan bulanan', v.perbelanjaan, edit) + moneyIn('d-rent', 'Bayaran sewa bulan ini', v.sewa, edit) + '</div>' + calc +
      fileRow('laporan', 'Laporan kewangan bulanan', edit) + fileRow('sewa', 'Resit bayaran sewa', edit) +
      '<div class="field"><span class="lbl">Adakah anda menyewa peralatan UTMXCITE? ' + (edit ? '<span class="req">*</span>' : '') + '</span><div class="toggle">' +
      '<button type="button" data-act="eq" data-v="1" aria-pressed="' + (v.eq === true) + '"' + (edit ? '' : ' disabled') + '>Ya</button>' +
      '<button type="button" data-act="eq" data-v="0" aria-pressed="' + (v.eq === false) + '"' + (edit ? '' : ' disabled') + '>Tidak</button></div></div>' +
      (v.eq === false ? fileRow('incubator', 'Resit incubator', false, true) : v.eq === true ? fileRow('incubator', 'Resit bayaran incubator', edit) : '') +
      (edit ? '<label class="declare"><input id="d-ack" type="checkbox"' + (v.ack ? ' checked' : '') + '><span>Saya mengesahkan bahawa semua maklumat yang diberikan adalah lengkap dan tepat mengikut pengetahuan saya.</span></label>' : '') +
      '</div><div class="dfoot"><span class="help">PDF sahaja, maksimum 10 MB setiap fail.</span><span>' +
      '<button class="btn" data-act="closedlg" type="button">' + (edit ? 'Batal' : 'Tutup') + '</button> ' +
      (edit ? '<button class="btn" data-act="savedraft" type="button">Simpan draf</button> <button class="btn primary" data-act="submitreport" type="button"' + (v.ack ? '' : ' disabled') + '>Hantar laporan</button>' : '') +
      '</span></div></div></div>';
    var sc = slot.querySelector('.scrim'); if (sc) sc.scrollTop = top;
  }

  function readDlgInputs() {
    var g = function (id) { var e = $(id); return e ? e.value : null; };
    if (g('d-inc') !== null) D.v.pendapatan = g('d-inc');
    if (g('d-exp') !== null) D.v.perbelanjaan = g('d-exp');
    if (g('d-rent') !== null) D.v.sewa = g('d-rent');
  }

  function pickFile(kind) {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/pdf,.pdf';
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      if (!/\.pdf$/i.test(f.name) || (f.type && f.type !== 'application/pdf')) { D.err = 'Hanya fail PDF dibenarkan.'; readDlgInputs(); drawDlg(); return; }
      if (f.size > MAX) { D.err = 'Saiz fail melebihi 10 MB.'; readDlgInputs(); drawDlg(); return; }
      var rd = new FileReader();
      rd.onload = function () { D.pending[kind] = { name: f.name, base64: String(rd.result).split(',')[1] }; D.err = ''; readDlgInputs(); drawDlg(); };
      rd.onerror = function () { D.err = 'Fail tidak dapat dibaca.'; drawDlg(); };
      rd.readAsDataURL(f);
    };
    inp.click();
  }

  /** Simpan nilai, muat naik fail yang dipilih, kemudian (pilihan) hantar. */
  function persist(submit) {
    readDlgInputs();
    var y = D.year, m = D.month, v = D.v;
    D.err = '';
    var data = { pendapatan: v.pendapatan, perbelanjaan: v.perbelanjaan, sewa: v.sewa, sewaPeralatan: v.eq, akuan: !!v.ack };
    var p = api('saveReport', { tahun: y, bulan: m, data: data });
    var kinds = Object.keys(D.pending);
    if (v.eq === false) kinds = kinds.filter(function (k) { return k !== 'incubator'; });
    kinds.forEach(function (k) {
      p = p.then(function () { return api('uploadFile', { tahun: y, bulan: m, kind: k, base64: D.pending[k].base64 }); });
    });
    if (submit) p = p.then(function () { return api('submitReport', { tahun: y, bulan: m }); });
    else p = p.then(function () { return api('getMyReport', { tahun: y, bulan: m }); });
    p.then(function (rep) {
      toast(submit ? 'Laporan dihantar untuk semakan' : 'Draf disimpan');
      if (submit) { D = null; drawDlg(); S.fin.tahun = y; loadTab(); }
      else { D.rep = rep; D.pending = {}; drawDlg(); loadTab(); }
    }).catch(function (e) { D.err = e.message; drawDlg(); });
  }

  function askConfirm(title, text, ok) {
    return new Promise(function (resolve) {
      var el = document.createElement('div');
      el.innerHTML = '<div class="scrim" style="z-index:30"><div class="dlg sm" role="alertdialog" aria-modal="true"><div class="dhead"><div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p></div></div><div class="dfoot" style="justify-content:flex-end"><button class="btn" data-r="0" type="button">Batal</button><button class="btn danger" data-r="1" type="button">' + esc(ok) + '</button></div></div></div>';
      document.body.appendChild(el);
      el.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; el.remove(); resolve(b.dataset.r === '1'); });
    });
  }

      '</select><button class="btn" data-act="export" type="button">Eksport CSV</button></div>' +
      (a.tanpaTarikh ? '<p class="note">' + a.tanpaTarikh + ' lot aktif belum ada tarikh mula sewa, jadi belum disenaraikan. Tetapkan di tab <b>Lot</b>.</p>' : '') +
      '<div class="tbl-wrap"><table><thead><tr><th>Bulan</th><th>Lot</th><th>Perniagaan · Pelajar</th><th class="num">Pendapatan (RM)</th><th class="num">Perbelanjaan (RM)</th><th class="num">Untung/Rugi (RM)</th><th>Status</th><th></th></tr></thead><tbody id="a-rows">' + admRows() + '</tbody></table></div>';
    return h;
  }

  function admRows() {
    var q = S.admQ.toLowerCase(), out = '', n = 0;
    S.adm.rows.forEach(function (r) {
      if (q && (r.lotNama + ' ' + r.perniagaan + ' ' + r.pelajar + ' ' + r.bulanNama).toLowerCase().indexOf(q) < 0) return;
      if (S.admStatus && r.status !== S.admStatus) return;
      if (S.admLokasi && r.lokasi !== S.admLokasi) return;
      n++;
      var net = r.untungRugi;
      var at = ' data-lot="' + esc(r.kodLot) + '" data-y="' + r.tahun + '" data-m="' + r.bulan + '"';
      var act = r.status === 'sent' ? '<button class="btn sm fill" data-act="review"' + at + ' type="button">Semak</button>'
        : r.status === 'none' ? '<button class="btn sm" data-act="remind"' + at + ' type="button">Ingatkan</button>'
        : '<button class="btn sm" data-act="review"' + at + ' type="button">Lihat</button>';
      out += '<tr><td class="nw">' + esc(r.bulanNama) + ' ' + r.tahun + '</td><td class="nw"><b>' + esc(r.lotNama) + '</b></td><td>' + esc(r.perniagaan || '-') + '<span class="sub">' + esc(r.pelajar) + '</span></td>' +
        '<td class="num mono">' + fmt(r.pendapatan) + '</td><td class="num mono">' + fmt(r.perbelanjaan) + '</td>' +
        '<td class="num mono ' + (net != null && net < 0 ? 'neg' : '') + '">' + (net == null ? '-' : (net < 0 ? '-' : '') + fmt(Math.abs(net))) + '</td>' +
        '<td>' + pill(r.status) + (r.lewat ? '<span class="late">Lewat</span>' : '') + '</td><td class="act">' + act + '</td></tr>';
    });
    return n ? out : '<tr><td class="empty" colspan="8">Tiada laporan sepadan.</td></tr>';
  }

  function openReview(kodLot, tahun, bulan) {
    run(api('adminReport', { kodLot: kodLot, tahun: tahun, bulan: bulan }).then(function (r) { drawReview(r, ''); }));
  }

  function drawReview(r, err) {
    var canReview = r.status === 'sent';
    var b = r.biz, net = r.pendapatan !== null && r.perbelanjaan !== null ? Math.round((r.pendapatan - r.perbelanjaan) * 100) / 100 : null;
    var files = KINDS.map(function (k) {
      var f = r.files[k[0]];
      if (k[0] === 'incubator' && r.sewaPeralatan !== true) return '';
      return '<div class="file"><div class="meta"><b>' + k[1] + '</b><span class="fname">' + (f ? esc(f.name) : 'Tiada fail') + '</span></div>' +
        (f ? '<button class="btn sm" data-act="admfile" data-kind="' + k[0] + '" type="button">Muat turun</button>' : '') + '</div>';
    }).join('');
    $('dlg-slot').innerHTML = '<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt" data-lot="' + esc(r.kodLot) + '" data-y="' + r.tahun + '" data-m="' + r.bulan + '">' +
      '<div class="dhead"><div><h2 id="dt">' + esc(r.lot.nama) + ' · ' + esc(r.bulanNama) + ' ' + r.tahun + '</h2><p>' + esc(b.nama || 'Maklumat peniaga belum diisi') + ' · ' + esc(b.pelajar) + (b.kp ? ' · ' + esc(b.kp) : '') + '</p></div><button class="x" data-act="closedlg" aria-label="Tutup" type="button">×</button></div>' +
      '<div class="dbody">' + (err ? '<div class="errbox" role="alert">' + esc(err) + '</div>' : '') +
      '<div>' + pill(r.status) + (r.lewat ? '<span class="late">Dihantar lewat</span>' : '') + (r.tarikhHantar ? ' <span class="help">Tarikh hantar ' + esc(fmtDT(r.tarikhHantar)) + '</span>' : '') + '</div>' +
      (r.status === 'fix' || r.status === 'ok' ? '<div class="banner ' + (r.status === 'ok' ? 's-ok' : 's-bad') + '"><b>' + (r.status === 'ok' ? 'Disahkan' : 'Pembetulan diminta') + '</b>' + (r.komen ? '<p>' + esc(r.komen) + '</p>' : '') + '<span>' + esc(r.disemakOleh) + ' · ' + esc(fmtDT(r.tarikhSemak)) + '</span></div>' : '') +
      '<div class="calc"><div><small>Pendapatan</small><strong>RM ' + fmt(r.pendapatan) + '</strong></div><div><small>Perbelanjaan</small><strong>RM ' + fmt(r.perbelanjaan) + '</strong></div>' +
      '<div><small>' + (net !== null && net < 0 ? 'Rugi' : 'Untung') + '</small><strong class="' + (net !== null && net < 0 ? 'neg' : 'pos') + '">' + (net === null ? '-' : 'RM ' + fmt(Math.abs(net))) + '</strong></div>' +
      '<div><small>Bayaran sewa</small><strong>RM ' + fmt(r.sewa) + '</strong></div><div><small>Sewa peralatan</small><strong>' + (r.sewaPeralatan === null ? '-' : r.sewaPeralatan ? 'Ya' : 'Tidak') + '</strong></div></div>' +
      files +
      (canReview ? '<div class="field"><label for="rv-komen">Komen untuk penyewa</label><textarea class="fi" id="rv-komen" placeholder="Wajib diisi jika meminta pembetulan"></textarea></div>' : '') +
      '</div><div class="dfoot"><span></span><span><button class="btn" data-act="closedlg" type="button">Tutup</button> ' +
      (canReview ? '<button class="btn danger" data-act="rv-fix" type="button">Minta pembetulan</button> <button class="btn good" data-act="rv-ok" type="button">Sahkan</button>' : '') + '</span></div></div></div>';
  }

  function doReview(decision) {
    var dlg = document.querySelector('.dlg[data-lot]'); if (!dlg) return;
    var p = { kodLot: dlg.dataset.lot, tahun: Number(dlg.dataset.y), bulan: Number(dlg.dataset.m), decision: decision, komen: ($('rv-komen') || {}).value || '' };
    api('adminReview', p).then(function (r) { toast(decision === 'ok' ? 'Laporan disahkan' : 'Pembetulan diminta, e-mel dihantar'); $('dlg-slot').innerHTML = ''; loadAdm(); })
      .catch(function (e) { api('adminReport', p).then(function (r) { drawReview(r, e.message); }).catch(function () { toast(e.message, true); }); });
  }

  /* ---------- admin: lot ---------- */
  function lotsHtml() {
    return '<div class="bar"><div class="grow"></div><button class="btn primary" data-act="newlot" type="button">+ Tambah lot</button></div>' +
      '<div class="tbl-wrap"><table style="min-width:700px"><thead><tr><th>Lot</th><th>Kod</th><th>Tarikh mula</th><th>Tarikh akhir</th><th class="num">Sewa (RM)</th><th>Status</th><th></th></tr></thead><tbody>' +
      S.lots.map(function (l, i) {
        return '<tr><td class="nw"><b>' + esc(l.nama) + '</b></td><td class="mono">' + esc(l.kodLot) + '</td><td>' + esc(dateLabel(l.mula)) + '</td><td>' + esc(dateLabel(l.akhir)) + '</td><td class="num mono">' + fmt(l.sewa) + '</td>' +
          '<td><span class="pill ' + (l.status === 'Aktif' ? 's-ok' : 's-idle') + '">' + esc(l.status) + '</span></td><td class="act"><button class="btn sm" data-act="editlot" data-i="' + i + '" type="button">Edit</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function lotDlg(i, err) {
    var l = i === null ? { lokasi: '', noLot: '', mula: '', akhir: '', sewa: '', status: 'Aktif' } : S.lots[i];
    var isNew = i === null;
    $('dlg-slot').innerHTML = '<div class="scrim"><div class="dlg sm" role="dialog" aria-modal="true" data-new="' + (isNew ? 1 : 0) + '"><div class="dhead"><h2>' + (isNew ? 'Tambah lot' : 'Edit ' + esc(l.nama)) + '</h2><button class="x" data-act="closedlg" aria-label="Tutup" type="button">×</button></div><div class="dbody">' +
      (err ? '<div class="errbox" role="alert">' + esc(err) + '</div>' : '') +
      '<div class="field"><label for="l-lokasi">Lokasi <span class="req">*</span></label><input class="fi" id="l-lokasi" value="' + esc(l.lokasi) + '" placeholder="Contoh: Student Mall"' + (isNew ? '' : ' readonly') + '></div>' +
      '<div class="field"><label for="l-no">No. lot <span class="req">*</span></label><input class="fi" id="l-no" inputmode="numeric" value="' + esc(l.noLot) + '"' + (isNew ? '' : ' readonly') + '></div>' +
      '<div class="field"><label for="l-mula">Tarikh mula sewa</label><input class="fi" type="date" id="l-mula" value="' + esc(l.mula) + '"></div>' +
      '<div class="field"><label for="l-akhir">Tarikh akhir sewa</label><input class="fi" type="date" id="l-akhir" value="' + esc(l.akhir) + '"></div>' +
      '<div class="field"><label for="l-sewa">Sewa bulanan (RM)</label><input class="fi" id="l-sewa" inputmode="decimal" value="' + esc(l.sewa === null ? '' : l.sewa) + '"></div>' +
      '<div class="field"><label for="l-status">Status</label><select class="fi" id="l-status"><option' + (l.status === 'Aktif' ? ' selected' : '') + '>Aktif</option><option' + (l.status !== 'Aktif' ? ' selected' : '') + '>Tidak aktif</option></select></div>' +
      '</div><div class="dfoot" style="justify-content:flex-end"><button class="btn" data-act="closedlg" type="button">Batal</button><button class="btn primary" data-act="savelot" type="button">Simpan</button></div></div></div>';
  }

  function doSaveLot() {
    var dlg = document.querySelector('.dlg[data-new]'); var isNew = dlg.dataset.new === '1';
    var lot = { lokasi: $('l-lokasi').value, noLot: $('l-no').value, mula: $('l-mula').value, akhir: $('l-akhir').value, sewa: $('l-sewa').value, status: $('l-status').value };
    api('adminSaveLot', { lot: lot, isNew: isNew }).then(function (d) { S.lots = d.lots; $('dlg-slot').innerHTML = ''; refreshView(lotsHtml()); toast('Lot disimpan'); })
      .catch(function (e) { var i = null; if (!isNew) { for (var k = 0; k < S.lots.length; k++) if (S.lots[k].noLot === Number(lot.noLot) && S.lots[k].lokasi === lot.lokasi) i = k; } lotDlg(i, e.message); restoreLot(lot); });
  }
  function restoreLot(l) { ['lokasi:l-lokasi', 'noLot:l-no', 'mula:l-mula', 'akhir:l-akhir', 'sewa:l-sewa', 'status:l-status'].forEach(function (p) { var s = p.split(':'); var e = $(s[1]); if (e && l[s[0]] !== undefined) e.value = l[s[0]]; }); }

  /* ---------- admin: pengguna ---------- */
  function usersHtml() {
    return '<div class="bar"><div class="grow"><input id="u-q" type="search" placeholder="Cari e-mel atau nama"></div><button class="btn primary" data-act="newuser" type="button">+ Tambah pengguna</button></div>' +
      '<div class="tbl-wrap"><table style="min-width:640px"><thead><tr><th>E-mel</th><th>Nama</th><th>Peranan</th><th>Kod lot</th><th>Status</th><th></th></tr></thead><tbody id="u-rows">' + userRows('') + '</tbody></table></div>';
  }
  function userRows(q) {
    q = q.toLowerCase();
    var rows = S.users.map(function (u, i) { return [u, i]; }).filter(function (x) { return !q || (x[0].email + ' ' + x[0].nama).toLowerCase().indexOf(q) >= 0; });
    if (!rows.length) return '<tr><td class="empty" colspan="6">Tiada pengguna.</td></tr>';
    return rows.map(function (x) {
      var u = x[0];
      return '<tr><td>' + esc(u.email) + '</td><td>' + esc(u.nama) + '</td><td><span class="role' + (u.peranan === 'Penyewa' ? ' t' : '') + '">' + esc(u.peranan) + '</span></td><td class="mono">' + esc(u.kodLot || '-') + '</td>' +
        '<td><span class="pill ' + (u.status === 'Aktif' ? 's-ok' : 's-idle') + '">' + esc(u.status) + '</span></td><td class="act"><button class="btn sm" data-act="edituser" data-i="' + x[1] + '" type="button">Edit</button></td></tr>';
    }).join('');
  }

  function userDlg(i, err, keep) {
    var u = keep || (i === null ? { email: '', nama: '', peranan: 'Penyewa', kodLot: '', status: 'Aktif' } : S.users[i]);
    var isNew = i === null && !(keep && keep._edit);
    $('dlg-slot').innerHTML = '<div class="scrim"><div class="dlg sm" role="dialog" aria-modal="true" data-newu="' + (isNew ? 1 : 0) + '"><div class="dhead"><h2>' + (isNew ? 'Tambah pengguna' : 'Edit pengguna') + '</h2><button class="x" data-act="closedlg" aria-label="Tutup" type="button">×</button></div><div class="dbody">' +
      (err ? '<div class="errbox" role="alert">' + esc(err) + '</div>' : '') +
      '<div class="field"><label for="u-email">E-mel <span class="req">*</span></label><input class="fi" id="u-email" type="email" value="' + esc(u.email) + '"' + (isNew ? '' : ' readonly') + '></div>' +
      '<div class="field"><label for="u-nama">Nama <span class="req">*</span></label><input class="fi" id="u-nama" value="' + esc(u.nama) + '"></div>' +
      '<div class="field"><label for="u-role">Peranan</label><select class="fi" id="u-role"><option' + (u.peranan === 'Penyewa' ? ' selected' : '') + '>Penyewa</option><option' + (u.peranan === 'Admin' ? ' selected' : '') + '>Admin</option></select></div>' +
      '<div class="field" id="u-lotf"><label for="u-lot">Lot (penyewa sahaja)</label><select class="fi" id="u-lot"><option value="">Pilih lot</option>' + S.lots.map(function (l) { return '<option value="' + esc(l.kodLot) + '"' + (u.kodLot === l.kodLot ? ' selected' : '') + '>' + esc(l.nama) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="u-status">Status</label><select class="fi" id="u-status"><option' + (u.status === 'Aktif' ? ' selected' : '') + '>Aktif</option><option' + (u.status !== 'Aktif' ? ' selected' : '') + '>Tidak aktif</option></select></div>' +
      '</div><div class="dfoot" style="justify-content:flex-end"><button class="btn" data-act="closedlg" type="button">Batal</button><button class="btn primary" data-act="saveuser" type="button">Simpan</button></div></div></div>';
    toggleLotField();
  }
  function toggleLotField() { var r = $('u-role'), f = $('u-lotf'); if (r && f) f.hidden = r.value !== 'Penyewa'; }

  function doSaveUser() {
    var dlg = document.querySelector('.dlg[data-newu]'); var isNew = dlg.dataset.newu === '1';
    var user = { email: $('u-email').value, nama: $('u-nama').value, peranan: $('u-role').value, kodLot: $('u-lot').value, status: $('u-status').value };
    api('adminSaveUser', { user: user }).then(function (d) { S.users = d.users; $('dlg-slot').innerHTML = ''; refreshView(usersHtml()); toast('Pengguna disimpan'); })
      .catch(function (e) { user._edit = !isNew; userDlg(isNew ? null : 0, e.message, user); });
  }

  /* ---------- peristiwa ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
    var a = t.dataset.act;
    switch (a) {
      case 'sendotp': case 'resend': if (a === 'resend') S.login.step = 'email'; doSendOtp(); break;
      case 'verifyotp': doVerify(); break;
      case 'changeemail': S.login = { step: 'email', email: S.login.email, msg: '', err: '' }; render(); break;
      case 'logout': run(api('logout')); endSession(''); break;
      case 'savebiz': doSaveBiz(); break;
      case 'open': openReport(S.fin.tahun, Number(t.dataset.m), false); break;
      case 'newreport':
        var first = S.fin.rows.filter(function (r) { return r.status === 'none'; }).sort(function (x, y) { return y.bulan - x.bulan; })[0];
        if (!first) { toast('Semua bulan sudah dihantar'); break; }
        openReport(S.fin.tahun, first.bulan, true); break;
      case 'del':
        var mm = Number(t.dataset.m);
        askConfirm('Padam laporan?', 'Laporan dan fail lampiran bulan ' + MS[mm - 1] + ' akan dipadam. Tindakan ini tidak boleh dibatalkan.', 'Padam').then(function (ok) {
          if (ok) run(api('deleteReport', { tahun: S.fin.tahun, bulan: mm }).then(function () { toast('Laporan dipadam'); loadTab(); }));
        }); break;
      case 'closedlg': D = null; $('dlg-slot').innerHTML = ''; break;
      case 'eq': readDlgInputs(); D.v.eq = t.dataset.v === '1'; drawDlg(); break;
      case 'pick': readDlgInputs(); pickFile(t.dataset.kind); break;
      case 'viewfile': openFile(D.year, D.month, t.dataset.kind); break;
      case 'savedraft': persist(false); break;
      case 'submitreport': persist(true); break;
      case 'review': openReview(t.dataset.lot, Number(t.dataset.y), Number(t.dataset.m)); break;
      case 'admfile': var d2 = document.querySelector('.dlg[data-lot]'); openFile(Number(d2.dataset.y), Number(d2.dataset.m), t.dataset.kind, d2.dataset.lot); break;
      case 'rv-ok': doReview('ok'); break;
      case 'rv-fix': doReview('fix'); break;
      case 'remind':
        run(api('adminRemind', { kodLot: t.dataset.lot, tahun: Number(t.dataset.y), bulan: Number(t.dataset.m) }).then(function (d) { toast('Peringatan dihantar kepada ' + d.dihantar + ' pengguna'); })); break;
      case 'export':
        run(api('adminExport', { tahun: S.adm.tahun, bulan: S.adm.bulan }).then(function (d) { download(d.name, 'text/csv;charset=utf-8', d.csv, false); })); break;
      case 'newlot': lotDlg(null); break;
      case 'editlot': lotDlg(Number(t.dataset.i)); break;
      case 'savelot': doSaveLot(); break;
      case 'newuser': userDlg(null); break;
      case 'edituser': userDlg(Number(t.dataset.i)); break;
      case 'saveuser': doSaveUser(); break;
    }
  });

  document.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'd-ack') { readDlgInputs(); D.v.ack = e.target.checked; drawDlg(); var c = $('d-ack'); if (c) c.focus(); }
    else if (id === 'd-month') { readDlgInputs(); openReport(D.year, Number(e.target.value), true); }
    else if (id === 'f-year') { S.fin.tahun = Number(e.target.value); loadTab(); }
    else if (id === 'f-status') { S.finStatus = e.target.value; $('f-rows').innerHTML = finRows(); }
    else if (id === 'a-month' || id === 'a-year') { S.admM = Number($('a-month').value); S.admY = Number($('a-year').value); loadAdm(); }
    else if (id === 'a-lokasi') { S.admLokasi = e.target.value; $('a-rows').innerHTML = admRows(); }
    else if (id === 'a-status') { S.admStatus = e.target.value; $('a-rows').innerHTML = admRows(); }
    else if (id === 'u-role') toggleLotField();
  });

  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'f-q') { S.finQ = e.target.value; $('f-rows').innerHTML = finRows(); }
    else if (id === 'a-q') { S.admQ = e.target.value; $('a-rows').innerHTML = admRows(); }
    else if (id === 'u-q') { $('u-rows').innerHTML = userRows(e.target.value); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('dlg-slot').innerHTML) { D = null; $('dlg-slot').innerHTML = ''; }
    if (e.key === 'Enter' && !S.token) {
      if (e.target.id === 'lg-email') doSendOtp();
      else if (e.target.id === 'lg-otp') doVerify();
    }
  });

  /* ---------- mula ---------- */
  var saved = load('tok');
  if (saved) {
    S.token = saved;
    api('me').then(function (d) { S.user = d.user; render(); }).catch(function () { S.token = null; store('tok', null); render(); });
  } else render();
})();
</script>
</body>
</html>
