<script>
(function () {
  'use strict';

  var APP_NAME = 'UTMXCITE 4 ASCEND 2030 Report';
  var DASH_TITLE = 'Dashboard KPI UTMXCITE JTNCHEPA';
  var S = {
    token: null, session: null,
    view: { name: 'infografik' },
    year: null, dash: null,
    list: null, listFilters: {}, editing: null,
    users: null, targets: null, audit: null,
    navOpen: false, login: null, busy: false,
    people: {}, files: {}, peopleKp: {}, dashView: 'level', open: {}, mini: false
  };

  // ------------------------------------------------------------------ utiliti
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function store(op, key, val) {
    try {
      if (op === 'get') return window.sessionStorage.getItem(key);
      if (op === 'set') window.sessionStorage.setItem(key, val);
      if (op === 'del') window.sessionStorage.removeItem(key);
    } catch (e) { /* storan tidak tersedia: guna memori sahaja */ }
    return null;
  }
  function toast(msg, bad) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ''; }, 3800);
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var run = google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.ok) return resolve(r.data);
          var e = new Error((r && r.error) || 'Ralat tidak diketahui.');
          e.fields = r && r.fields; e.auth = r && r.auth;
          reject(e);
        })
        .withFailureHandler(function (err) { reject(new Error((err && err.message) || 'Ralat rangkaian. Cuba lagi.')); });
      run[fn].apply(run, args);
    });
  }
  function authFail(e) {
    if (e && e.auth) {
      S.token = null; S.session = null; store('del', 'utmx_token');
      S.view = { name: 'infografik' };
      toast(e.message, true);
      render();
      return true;
    }
    return false;
  }
  function fmtNum(n) { return (Math.round(n * 10) / 10).toString(); }
  function initials(name, email) {
    var s = (name || email || '?').trim().split(/\s+/);
    return ((s[0] || '?').charAt(0) + (s.length > 1 ? s[s.length - 1].charAt(0) : '')).toUpperCase();
  }
  function kpiById(id) {
    var k = (S.session && S.session.kpis || []).filter(function (x) { return x.id === id; });
    return k[0] || null;
  }
  function fnById(list, id) { return (list || []).filter(function (x) { return x.id === id; })[0] || null; }
  function fnLabel(f) { return (f.no ? f.no + ' · ' : '') + f.label; }
  function isAdmin() { return S.session && S.session.user.peranan === 'Admin'; }

  // Dialog pengesahan dalam halaman (window.confirm mungkin disekat dalam iframe kotak pasir).
  function askConfirm(message, okLabel) {
    return new Promise(function (resolve) {
      var box = $('#confirm');
      box.innerHTML = '<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="ctitle"><div class="dlg">' +
        '<h2 id="ctitle">Pengesahan</h2><p>' + esc(message) + '</p>' +
        '<div class="acts"><button class="btn d" id="cyes">' + esc(okLabel || 'Ya, teruskan') + '</button><button class="btn o" id="cno">Batal</button></div></div></div>';
      function done(v) { box.innerHTML = ''; document.removeEventListener('keydown', onKey, true); resolve(v); }
      function onKey(e) { if (e.key === 'Escape') { e.stopPropagation(); done(false); } }
      document.addEventListener('keydown', onKey, true);
      $('#cyes').addEventListener('click', function () { done(true); });
      $('#cno').addEventListener('click', function () { done(false); });
      $('#cno').focus();
    });
  }

  // ------------------------------------------------------------------ rangka
  function render() {
    if (S.login) { renderLogin(); return; }
    var app = $('#app');
    var u = S.session && S.session.user;
    app.innerHTML =
      '<div class="shell">' +
      '<aside class="side' + (S.navOpen ? ' open' : '') + (S.mini ? ' mini' : '') + '" id="side" aria-label="Menu utama">' + renderSide(u) + '</aside>' +
      '<div class="scrim' + (S.navOpen ? ' open' : '') + '" data-action="closenav"></div>' +
      '<div class="main">' +
      '<header class="top"><div class="tt">' +
      '<button class="burger" data-action="togglenav" aria-label="Buka menu">☰</button><h1>' + esc(pageTitle()) + '</h1></div>' +
      '<div class="user">' + (u
        ? '<span class="badge">' + esc(u.peranan) + (u.peranan === 'PIC' ? ' · ' + esc(u.fakulti) : '') + '</span>' +
          '<button class="btn o" data-action="logout">Log Keluar</button>'
        : '<span class="em">Paparan awam</span><button class="btn" data-action="login">Log Masuk</button>') +
      '</div></header>' +
      '<div id="tabs"></div><main class="cont" id="content"></main></div></div>' +
      '<div id="modal"></div><div id="confirm"></div>';
    renderView();
  }

  // ---- Ikon garis (inline SVG, gaya sama dengan portal UTM)
  var ICONS = {
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
    box: '<rect x="3.5" y="4" width="17" height="4.5" rx="1"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12.5h4"/>',
    chev: '<path d="M6 9l6 6 6-6"/>',
    user: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/>',
    target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8"/>',
    list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
  };
  function ico(n) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[n] + '</svg>'; }

  // Sidebar: satu bahagian "PERINGKAT" dengan tiga kumpulan boleh dilipat (Universiti = KAI, Jabatan = DKAI, Pusat = CKAI).
  // Di dalam kumpulan, subtajuk kecil: KAI mengikut Growth / Transform, CKAI mengikut enam fungsi.
  function groupKey(k) { return k.level === 'CKAI' ? k.fungsi : k.level === 'KPT' ? k.teras : k.group; }
  function terasById(list, id) { var r = null; (list || []).forEach(function (t) { if (t.id === id) r = t; }); return r; }
  function levelOf(target) {   // pulangkan id kumpulan yang perlu dibuka bagi sasaran navigasi
    if (target.indexOf('kpi:') === 0) { var k = kpiById(target.slice(4)); return k ? k.level : null; }
    return { users: 'ADMIN', targets: 'ADMIN', audit: 'ADMIN', setup: 'ADMIN' }[target] || null;
  }
  function groupActive(g) {
    var v = S.view;
    if (g === 'ADMIN') return v.name === 'users' || v.name === 'targets' || v.name === 'audit' || v.name === 'setup';
    if (v.name === 'kpi') { var k = kpiById(v.id); return !!k && k.level === g; }
    return false;
  }
  function isOpen(g) { return S.open[g] === undefined ? groupActive(g) : !!S.open[g]; }
  function groupHtml(g, label, bodyHtml, title) {
    var open = isOpen(g);
    return '<button type="button" class="gh' + (groupActive(g) ? ' has-act' : '') + '" data-action="tg" data-g="' + esc(g) + '" aria-expanded="' + open + '" title="' + esc(title || label) + '">' +
      '<span class="ic">' + ico('box') + '</span><span class="lb">' + esc(label) + '</span><span class="cv">' + ico('chev') + '</span></button>' +
      '<div class="gb" data-g="' + esc(g) + '"' + (open ? '' : ' hidden') + '>' + bodyHtml + '</div>';
  }

  function renderSide(u) {
    var h = '<div class="sh"><button type="button" class="hb" data-action="collapse" aria-label="Kecilkan atau besarkan menu" title="Menu">' + ico('menu') + '</button>' +
      (window.UTM_LOGO ? '<img class="shlogo" src="' + window.UTM_LOGO + '" alt="Universiti Teknologi Malaysia ASCEND 2030">' : '') +
      '<div class="shname"><b>' + esc(APP_NAME) + '</b><small>DS04 · Pekerjaan Premium Tier 1</small></div></div><div class="sbody">';
    h += u
      ? '<div class="prof"><div class="av">' + esc(initials(u.nama, u.emel)) + '</div><div><b>' + esc(u.nama || u.emel) + '</b><small>' + esc(u.emel) + '</small></div></div>'
      : '<div class="prof"><div class="av">?</div><div><b>Pengunjung</b><small>Belum log masuk</small></div></div>';
    h += navBtn('infografik', ico('chart'), 'Infografik', S.view.name === 'infografik');
    h += navBtn('dashboard', ico('grid'), 'Dashboard', S.view.name === 'dashboard');
    if (u) {
      h += '<div class="mod">Peringkat</div>';
      S.session.levels.forEach(function (lv) {
        var ks = S.session.kpis.filter(function (k) { return k.level === lv.id; });
        if (!ks.length) return;
        var body = '', last = null;
        ks.forEach(function (k) {
          var key = groupKey(k);
          if (lv.id !== 'DKAI' && key !== last) {
            last = key;
            var sub = key, subTitle = key;
            if (lv.id === 'CKAI') { var fn = fnById(S.session.functions, key); if (fn) { sub = fnLabel(fn); subTitle = fn.ms; } }
            if (lv.id === 'KPT') { var ts = terasById(S.session.teras, key); if (ts) { sub = 'Teras ' + ts.no + ' · ' + ts.label; subTitle = sub; } }
            body += '<div class="stagelbl" title="' + esc(subTitle) + '">' + esc(sub) + '</div>';
          }
          body += navBtn('kpi:' + k.id, '<span class="dot"></span>', k.title.replace(/ · .*/, '') + ' · ' + k.short, S.view.name === 'kpi' && S.view.id === k.id);
        });
        h += groupHtml(lv.id, lv.short || lv.label, body, lv.label);
      });
      if (isAdmin()) {
        h += '<div class="mod">Admin</div>' + groupHtml('ADMIN', 'Pentadbiran',
          navBtn('users', ico('user'), 'Urus Pengguna', S.view.name === 'users') +
          navBtn('targets', ico('target'), 'Sasaran', S.view.name === 'targets') +
          navBtn('audit', ico('list'), 'Log Audit', S.view.name === 'audit') +
          navBtn('setup', ico('target'), 'Persediaan', S.view.name === 'setup'));
      }
    }
    return h + '</div>';
  }
  function redrawSide() {
    var side = $('#side'); if (!side) return;
    side.className = 'side' + (S.navOpen ? ' open' : '') + (S.mini ? ' mini' : '');
    side.innerHTML = renderSide(S.session && S.session.user);
  }
  function navBtn(target, icon, label, act) {
    return '<button class="nav' + (act ? ' act' : '') + '" data-nav="' + esc(target) + '"' + (act ? ' aria-current="page"' : '') + ' title="' + esc(label) + '">' +
      '<span class="ic" aria-hidden="true">' + icon + '</span><span class="lb">' + esc(label) + '</span></button>';
  }
  function pageTitle() {
    var v = S.view;
    if (v.name === 'dashboard') return DASH_TITLE;
    if (v.name === 'infografik') return 'Laporan Prestasi UTMXCITE';
    if (v.name === 'kpi') { var k = kpiById(v.id); return k ? k.title : 'KPI'; }
    return { users: 'Urus Pengguna', targets: 'Sasaran', audit: 'Log Audit', setup: 'Persediaan & Pautan' }[v.name] || APP_NAME;
  }
  function renderView() {
    $('#tabs').innerHTML = '';
    var v = S.view;
    if (v.name === 'dashboard') return renderDashboard();
    if (v.name === 'infografik') return renderInfo();
    if (!S.session) { S.view = { name: 'infografik' }; return renderInfo(); }
    if (v.name === 'kpi') return renderKpi();
    if (v.name === 'users') return renderUsers();
    if (v.name === 'targets') return renderTargets();
    if (v.name === 'audit') return renderAudit();
    if (v.name === 'setup') return renderSetup();
  }

  // ------------------------------------------------------------------ dashboard
  function loadDashboard(year) {
    $('#content').innerHTML = '<p class="boot">Memuatkan dashboard…</p>';
    call('api_dashboard', year || S.year || '').then(function (d) {
      S.dash = d; S.year = d.year;
      if (S.view.name === 'dashboard') renderDashboard();
    }).catch(function (e) { $('#content').innerHTML = '<p class="boot">' + esc(e.message) + '</p>'; });
  }

  function statusChip(s) {
    var cls = s === 'Melebihi sasaran' || s === 'Selesai' ? 'over' : s === 'Capai sasaran' ? 'meet' : s === 'Di bawah sasaran' || s === 'Melebihi peruntukan' ? 'below' : 'none';
    return '<span class="chip ' + cls + '">' + esc(s) + '</span>';
  }
  function money(n) { return 'RM ' + Number(n).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtVal(c, v) { return c.format === 'rm' ? money(v) : c.format === 'pct' ? fmtNum(v) + '%' : (c.jenis === 'kemajuan' || c.jenis === 'penggunaan') ? fmtNum(v) + '%' : fmtNum(v); }
  function fmtItem(c, v, title) { if (/\(%\)|^%/.test(title || '')) return fmtNum(v) + '%'; if (/\(RM\)/.test(title || '')) return money(v); return c.format === 'rm' ? money(v) : fmtNum(v); }

  function progressBar(pct) {
    if (pct === null || pct === undefined) return '<div class="track" aria-hidden="true"></div>';
    var scale = Math.max(pct, 100);
    var fill = Math.min(pct, 100) / scale * 100;
    var over = pct > 100 ? (pct - 100) / scale * 100 : 0;
    return '<div class="track" role="progressbar" aria-valuenow="' + esc(pct) + '" aria-valuemin="0" aria-valuemax="100">' +
      '<div class="f" style="width:' + fill.toFixed(1) + '%"></div>' +
      (over ? '<div class="x" style="left:' + fill.toFixed(1) + '%;width:' + over.toFixed(1) + '%"></div><div class="tick" style="left:' + fill.toFixed(1) + '%"></div>' : '') +
      '</div>';
  }

  function renderCard(c) {
    var h = '<article class="kcard"><span class="tag ' + esc(c.group) + '">' + esc(c.group) + '</span>' +
      '<div class="t">' + esc(c.title) + '</div>' +
      '<div class="v">' + esc(fmtVal(c, c.value)) + (c.target !== '' ? ' <small>/ ' + esc(fmtVal(c, c.target)) + (c.jenis === 'kemajuan' || c.jenis === 'penggunaan' ? '' : ' minimum') + '</small>' : ' <small>' + esc(c.unit) + '</small>') + '</div>' +
      progressBar(c.pct) +
      '<div class="chips">' + statusChip(c.status) + (c.pct !== null ? '<span class="sec2"><b>' + esc(fmtNum(c.pct)) + '%</b> daripada sasaran ' + esc(S.year) + '</span>' : '') + '</div>';
    if (c.quarter) {
      h += '<div class="sec2">Sasaran suku tahun Q' + c.quarter + ': <b>' + (c.quarterTarget === '' ? 'N/A' : esc(fmtVal(c, c.quarterTarget))) + '</b> ' +
        (c.quarterTarget === '' ? '' : statusChip(c.quarterStatus)) + '</div>';
    }
    (c.secondary || []).forEach(function (s) { h += '<div class="sec2">' + esc(s.label) + ': <b>' + esc(s.value) + '</b></div>'; });
    (c.warnings || []).forEach(function (w) { h += '<div class="warn">' + esc(w) + '</div>'; });
    if (c.secondaryTargets) h += '<div class="sec2">' + esc(c.secondaryTargets) + '</div>';
    if (c.breakdown && c.breakdown.some(function (b) { return b.items.length; })) {
      h += '<details class="bd"><summary>Butiran</summary>';
      c.breakdown.forEach(function (b) {
        if (!b.items.length) return;
        h += '<h4>' + esc(b.title) + '</h4>';
        var max = Math.max.apply(null, b.items.map(function (i) { return Math.max(i.value, i.target || 0); }).concat([1]));
        if (/\(%\)|^%/.test(b.title)) max = Math.max(100, max);
        b.items.forEach(function (i) {
          h += '<div class="bi' + (String(i.label).length > 16 ? ' long' : '') + '"><span class="l" title="' + esc(i.label) + '">' + esc(i.label) + '</span>' +
            '<span class="mini"><i style="width:' + Math.min(100, i.value / max * 100).toFixed(0) + '%"></i></span>' +
            '<span class="n">' + esc(fmtItem(c, i.value, b.title)) + (i.target ? ' / ' + esc(i.target) : '') + '</span></div>';
        });
      });
      h += '</details>';
    }
    return h + '</article>';
  }

  function renderDashboard() {
    var el = $('#content');
    var d = S.dash;
    if (!d) { loadDashboard(); return; }
    var h = (!S.session ? '<div class="pub">Paparan awam · hanya data ringkasan ditunjukkan. Log masuk diperlukan untuk mengemas kini data.</div>' : '');
    h += '<div class="bar-top"><label for="yr" style="margin:0">Tahun</label><select id="yr" data-change="year">' +
      d.years.map(function (y) { return '<option' + (y === d.year ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>' +
      '<div class="seg" role="group" aria-label="Paparan dashboard"><button type="button" data-action="dview" data-view="level" class="' + (S.dashView === 'level' ? 'on' : '') + '" aria-pressed="' + (S.dashView === 'level') + '">Mengikut peringkat</button>' +
      '<button type="button" data-action="dview" data-view="fungsi" class="' + (S.dashView === 'fungsi' ? 'on' : '') + '" aria-pressed="' + (S.dashView === 'fungsi') + '">Mengikut fungsi</button></div>' +
      '<span class="grow sec2">Dikemas kini: ' + esc(String(d.generatedAt).replace('T', ' ')) + '</span></div>';
    h += '<div class="sumrow"><div class="ds"><span>' + esc(d.ds.label) + '</span><b>' + esc(d.ds.goal) + '</b>' +
      '<span>' + d.summary.meet + ' daripada ' + d.summary.total + ' KPI mencapai sasaran ' + d.year + '</span></div>' +
      (d.premium ? '<div class="ds prem"><span>Ukuran Pekerjaan Premium Tier 1 · ' + d.year + '</span><b>' + d.premium.pct + '%</b>' +
        '<span>' + d.premium.premium + ' daripada ' + d.premium.total + ' usahawan melaporkan purata pendapatan sebulan melebihi RM' + String(d.premium.thresholdRm).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '</span>' +
        '<div class="pbar" title="' + d.premium.pctOfTarget + '% daripada sasaran"><i style="width:' + Math.min(100, d.premium.pctOfTarget) + '%"></i></div>' +
        '<span>Sasaran ' + d.premium.targetYear + ': ' + d.premium.targetPct + '%</span></div>' : '') + '</div>';
    function fnHead(f) { return '<div class="sub"><b>' + esc(fnLabel(f)) + '</b><span class="subms">' + esc(f.ms) + '</span></div>'; }
    if (S.dashView === 'fungsi') {
      // Paparan mengikut enam fungsi UTMXCITE: setiap fungsi menunjukkan semua indikator berkaitan (KAI, DKAI dan CKAI).
      d.functions.forEach(function (f) {
        var fc = d.kpis.filter(function (c) { return c.fungsi === f.id; });
        if (!fc.length) return;
        h += '<div class="grp">' + esc(fnLabel(f)) + '<span class="grpms">' + esc(f.ms) + '</span></div><div class="grid">' + fc.map(renderCard).join('') + '</div>';
      });
    } else {
      d.levels.forEach(function (lv) {
        var cs = d.kpis.filter(function (c) { return c.level === lv.id; });
        if (!cs.length) return;
        h += '<div class="grp">' + esc(lv.label) + '</div>';
        if (lv.id === 'KPT') {
          d.teras.forEach(function (t) {
            var sc = cs.filter(function (c) { return c.teras === t.id; });
            if (sc.length) h += '<div class="sub"><b>Teras ' + t.no + '</b><span class="subms">' + esc(t.label) + '</span></div><div class="grid">' + sc.map(renderCard).join('') + '</div>';
          });
        } else if (lv.id === 'CKAI') {
          d.functions.forEach(function (f) {
            var sc = cs.filter(function (c) { return c.fungsi === f.id; });
            if (sc.length) h += fnHead(f) + '<div class="grid">' + sc.map(renderCard).join('') + '</div>';
          });
        } else {
          h += '<div class="grid">' + cs.map(renderCard).join('') + '</div>';
        }
      });
    }
    el.innerHTML = h;
  }

  // ------------------------------------------------------------------ KPI: senarai & borang
  function renderKpi() {
    var k = kpiById(S.view.id);
    if (!k) { $('#content').innerHTML = '<p class="boot">Anda tiada akses kepada KPI ini.</p>'; return; }
    var tab = S.view.tab || 'list';
    $('#tabs').innerHTML = '<div class="tabs" role="tablist">' +
      '<button class="tab' + (tab === 'list' ? ' act' : '') + '" role="tab" data-action="tab" data-tab="list">▤ Senarai</button>' +
      '<button class="tab' + (tab === 'form' ? ' act' : '') + '" role="tab" data-action="tab" data-tab="form">＋ ' + (S.editing ? 'Edit Rekod' : 'Masuk Data') + '</button></div>';
    if (tab === 'list') return renderList(k);
    return renderForm(k);
  }

  function loadList(k) {
    call('api_list', S.token, k.id, S.listFilters).then(function (r) {
      S.list = r; if (S.view.name === 'kpi' && S.view.id === k.id && (S.view.tab || 'list') === 'list') renderList(k);
    }).catch(function (e) { if (!authFail(e)) toast(e.message, true); });
  }

  function fieldDef(k, key) { for (var i = 0; i < k.fields.length; i++) if (k.fields[i].key === key) return k.fields[i]; return null; }
  function colLabel(k, key) { if (key === 'id') return 'ID'; var f = fieldDef(k, key); return f ? (f.short || f.label.replace(/\s*\([^)]*\)/g, '')) : key; }

  function renderList(k) {
    var el = $('#content');
    var f = S.listFilters;
    var statusField = k.statusField && fieldDef(k, k.statusField);
    var h = '<div class="bar-top">' +
      '<input type="text" id="q" placeholder="🔍 Cari…" value="' + esc(f.q || '') + '" aria-label="Cari" data-input="q">' +
      (statusField ? '<select data-change="fstatus" aria-label="Tapis ' + esc(statusField.label) + '"><option value="">' + esc(statusField.label) + ': Semua</option>' +

        (S.list.canDelete ? ' <button class="btn d sm" data-action="del" data-id="' + esc(r.id) + '">Padam</button>' : '') + '</td></tr>';

  // Sel senarai: pelajar = nama sahaja (no. KP tidak dipaparkan dalam jadual); fail = butang muat turun.
  function listCell(k, r, c) {
    var fd = fieldDef(k, c), v = r[c] === undefined ? '' : r[c];
    if (fd && fd.type === 'people') {
      var ps = parseJson(v, []);
      return esc(ps.map(function (p) { return p.nama; }).join(', '));
    }
    if (fd && fd.type === 'file') {
      var f = parseJson(v, null);
      return f && f.id ? '<button class="btn o sm" data-action="fdl" data-id="' + esc(r.id) + '" data-key="' + esc(c) + '" title="' + esc(f.name || 'PDF') + '">📎 PDF</button>' : '';
    }
    return esc(String(v).replace(/^'/, ''));
  }
  function parseJson(v, fb) { if (!v) return fb; if (typeof v !== 'string') return v; try { return JSON.parse(v); } catch (e) { return fb; } }

  // ---- Pelajar berbilang (nama, no. matrik, no. KP)
  function peopleHtml(key) {
    var arr = S.people[key] || [];
    var kp = S.peopleKp[key] !== false;
    return arr.map(function (p, i) {
      return '<div class="prow' + (kp ? '' : ' nokp-off') + '"><span class="pn">' + (i + 1) + '</span>' +
        '<input type="text" data-pk="' + key + '" data-pi="' + i + '" data-pf="nama" placeholder="Nama penuh" maxlength="120" aria-label="Nama pelajar ' + (i + 1) + '" value="' + esc(p.nama) + '">' +
        '<input type="text" data-pk="' + key + '" data-pi="' + i + '" data-pf="matrik" placeholder="No. matrik" maxlength="30" aria-label="No. matrik pelajar ' + (i + 1) + '" value="' + esc(p.matrik) + '">' +
        (kp ? '<input type="text" data-pk="' + key + '" data-pi="' + i + '" data-pf="nokp" placeholder="No. KP / pasport" maxlength="20" inputmode="numeric" autocomplete="off" aria-label="No. KP pelajar ' + (i + 1) + '" value="' + esc(p.nokp) + '">' : '') +
        (arr.length > 1 ? '<button type="button" class="btn d sm" data-action="pdel" data-key="' + key + '" data-i="' + i + '" aria-label="Buang pelajar ' + (i + 1) + '">✕</button>' : '<span></span>') + '</div>';
    }).join('');
  }
  function syncPeople(key) {
    var arr = S.people[key] || [];
    $$('[data-pk="' + key + '"]').forEach(function (inp) {
      var i = parseInt(inp.getAttribute('data-pi'), 10), f = inp.getAttribute('data-pf');
      if (arr[i]) arr[i][f] = inp.value;
    });
    S.people[key] = arr;
  }
  function redrawPeople(key) { var box = $('[data-people="' + key + '"]'); if (box) box.innerHTML = peopleHtml(key); }

  // ---- Fail PDF
  function fileHtml(k, key) {
    var f = S.files[key];
    var saved = S.editing && S.editing[key] ? parseJson(S.editing[key], {}) : {};
    return (f && f.id
      ? '<div class="fileinfo">📎 <b>' + esc(f.name) + '</b>' + (saved.id && saved.id === f.id ? ' <button type="button" class="btn o sm" data-action="fdl" data-id="' + esc(S.editing.id) + '" data-key="' + key + '">Muat turun</button>' : ' <span class="hint">(belum disimpan)</span>') + '</div>'
      : '<div class="hint">Belum ada fail.</div>') +
      '<input type="file" id="f_' + key + '_file" accept="application/pdf,.pdf" data-change="fupload" data-key="' + key + '" aria-label="Pilih fail PDF">' +
      '<div class="hint" id="fs_' + key + '">' + (f && f.id ? 'Pilih fail lain untuk menggantikan.' : 'Hanya PDF, maksimum 5 MB.') + '</div>';
  }
  function uploadPdf(k, key, file) {
    var st = $('#fs_' + key);
    var w = $('[data-field="' + key + '"]'); if (w) { w.classList.remove('invalid'); $('.err', w).textContent = ''; }
    if (!file) return;
    if (!/\.pdf$/i.test(file.name) || (file.type && file.type !== 'application/pdf')) { showFieldErrors(oneErr(key, 'Fail mesti dalam format PDF.')); return; }
    if (file.size > 5 * 1024 * 1024) { showFieldErrors(oneErr(key, 'Fail terlalu besar. Maksimum 5 MB.')); return; }
    if (st) st.textContent = 'Memuat naik…';
    var rd = new FileReader();
    rd.onerror = function () { showFieldErrors(oneErr(key, 'Fail tidak dapat dibaca.')); };
    rd.onload = function () {
      var data = String(rd.result).split(',')[1] || '';
      call('api_uploadFile', S.token, k.id, key, { name: file.name, data: data }).then(function (r) {
        S.files[key] = { id: r.id, name: r.name };
        var box = $('[data-filebox="' + key + '"]'); if (box) box.innerHTML = fileHtml(k, key);
        toast('Fail ' + r.name + ' dimuat naik. Tekan Simpan untuk melengkapkan rekod.');
      }).catch(function (e) { if (authFail(e)) return; if (st) st.textContent = ''; showFieldErrors(oneErr(key, e.message)); });
    };
    rd.readAsDataURL(file);
  }
  function oneErr(key, msg) { var o = {}; o[key] = msg; return o; }
  function downloadPdf(k, recId, key) {
    call('api_downloadFile', S.token, k.id, recId, key).then(function (r) {
      var bin = atob(r.base64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      var a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 15000);
    }).catch(function (e) { if (!authFail(e)) toast(e.message, true); });
  }

  function inputFor(k, fd, val) {
    var id = 'f_' + fd.key, v = val === undefined || val === null ? '' : String(val).replace(/^'/, '');
    var req = fd.required ? ' required' : '';

    switch (fd.type) {
      case 'select':
        return '<select id="' + id + '" name="' + fd.key + '"><option value="">— pilih —</option>' +
          fd.options.map(function (o) { return '<option' + (v === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
      case 'yesno':
        return '<select id="' + id + '" name="' + fd.key + '"><option value="">— pilih —</option>' +

      case 'textarea':
        return '<textarea id="' + id + '" name="' + fd.key + '" maxlength="2000">' + esc(v) + '</textarea>';
      case 'number':

      case 'people':

          '<div class="hint">Satu baris bagi setiap ' + esc(fd.noun || 'pelajar') + (fd.max ? ' (maksimum ' + fd.max + ')' : '') + '.' + (fd.kp === false ? '' : ' No. KP 12 digit (sengkang tidak diperlukan) atau no. pasport.') + '</div>';
      case 'file':
        return '<div class="filebox" data-filebox="' + fd.key + '" id="f_' + fd.key + '">' + fileHtml(k, fd.key) + '</div>';
      case 'month':
        return '<input type="month" id="' + id + '" name="' + fd.key + '" value="' + esc(v) + '" placeholder="YYYY-MM">';
      case 'time':

      case 'email':

  function renderForm(k) {

        inputFor(k, fd, (!S.editing && rec[fd.key] === undefined && fd.def !== undefined) ? fd.def : rec[fd.key]) + (fd.hint ? '<div class="hint">' + esc(fd.hint) + '</div>' : '') + '<div class="err" role="alert"></div></div>';

  // Isi automatik medan (contoh: no. chargeline) apabila medan sumber (contoh: nama tabung) dipilih; medan dikunci jika ada padanan.
  function applyAutofill(k, srcKey) {
    k.fields.forEach(function (fd) {
      if (fd.autoFrom !== srcKey || !fd.autoMap) return;
      var src = document.getElementById('f_' + srcKey), el = document.getElementById('f_' + fd.key);
      if (!src || !el) return;
      var mapped = fd.autoMap[src.value];
      if (mapped) { el.value = mapped; el.readOnly = true; el.classList.add('ro'); }
      else { if (el.readOnly) el.value = ''; el.readOnly = false; el.classList.remove('ro'); }
    });
  }
  function initAutofill(k) { k.fields.forEach(function (fd) { if (fd.autoFrom) applyAutofill(k, fd.autoFrom); }); }

  function collectForm(k) {
    var rec = {};
    if (S.editing) rec.id = S.editing.id;
    k.fields.forEach(function (fd) {
      if (fd.type === 'people') { syncPeople(fd.key); rec[fd.key] = (S.people[fd.key] || []).filter(function (p) { return p.nama || p.matrik || p.nokp; }); return; }
      if (fd.type === 'file') { rec[fd.key] = S.files[fd.key] || ''; return; }
      var el = document.getElementById('f_' + fd.key);
      if (!el) return;
      if (el.disabled && fd.key === 'fakulti') { rec[fd.key] = S.session.user.fakulti; return; }
      rec[fd.key] = el.value;
    });
    return rec;
  }
  function showFieldErrors(fields) {
    $$('[data-field]').forEach(function (w) { w.classList.remove('invalid'); $('.err', w).textContent = ''; });

  }

  // Cincin kemajuan; o.tick = penanda sasaran (0-100)
  function ringSvg(pct, o) {

      '<form id="lform" novalidate>' +
      '<label for="l_emel">E-mel berdaftar</label><input type="email" id="l_emel" autocomplete="email" placeholder="nama@utm.my" value="' + esc(L.email || '') + '">' +
      '<label for="l_code">Kod OTP</label><input type="text" id="l_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Masukkan kod 6 digit" value="' + esc(L.code || '') + '">' +
      (L.message ? '<div class="ok" role="status">' + esc(L.message) + '</div>' : '') +
      '<div class="err" role="alert">' + esc(L.error || '') + '</div>' +
      '<div class="lgacts"><button class="btn" type="button" data-action="sendotp"' + (L.busy ? ' disabled' : '') + '>' + (L.busy === 'send' ? 'Menghantar…' : 'Hantar / Hantar Semula Kod') + '</button>' +
      '<button class="btn" type="submit"' + (L.busy ? ' disabled' : '') + '>' + (L.busy === 'verify' ? 'Mengesahkan…' : 'Sahkan dan Log Masuk') + '</button></div>' +
      '<p class="lgback"><a href="#" data-action="lclose">← Kembali ke dashboard awam</a></p></form></div></main>' +
      '<footer class="lgfoot">© 2026 UTMXCITE, Universiti Teknologi Malaysia</footer></div>';
    var f = (L.message && $('#l_code')) || $('#l_emel'); if (f && !L.noFocus) f.focus();
  }
  function loginKeep() {   // simpan nilai medan sebelum lukis semula
    var L = S.login; if (!L) return;
    if ($('#l_emel')) L.email = $('#l_emel').value.trim();
    if ($('#l_code')) L.code = $('#l_code').value.trim();
  }

  function sendOtp() {
    var L = S.login; if (!L || L.busy) return;
    loginKeep(); L.error = ''; L.message = '';
    if (!L.email) { L.error = 'Sila masukkan e-mel.'; renderLogin(); return; }
    L.busy = 'send'; renderLogin();
    call('api_requestOtp', L.email).then(function (r) {
      L.busy = false; L.message = r.message || 'Kod OTP telah dihantar.'; renderLogin();
    }).catch(function (e) { L.busy = false; L.error = e.message; renderLogin(); });
  }

  function submitLogin() {
    var L = S.login; if (!L || L.busy) return;
    loginKeep(); L.error = '';
    if (!L.email) { L.error = 'Sila masukkan e-mel.'; renderLogin(); return; }
    if (!/^\d{6}$/.test(L.code || '')) { L.error = L.message ? 'Masukkan kod 6 digit.' : 'Tekan "Hantar Kod" dahulu, kemudian masukkan kod 6 digit.'; renderLogin(); return; }
    L.busy = 'verify'; renderLogin();
    call('api_verifyOtp', L.email, L.code).then(function (r) {
      S.token = r.token; store('set', 'utmx_token', r.token);
      S.login = null;
      return call('api_session', S.token);
    }).then(function (sess) {
      S.session = sess; S.view = { name: 'infografik' }; S.dash = null;
      toast('Selamat datang, ' + (sess.user.nama || sess.user.emel) + '.');
      render();
    }).catch(function (e) { L.busy = false; L.error = e.message; L.code = ''; renderLogin(); });
  }

  function doLogout() {
    var t = S.token;
    S.token = null; S.session = null; store('del', 'utmx_token');
    S.view = { name: 'infografik' }; S.list = S.users = S.targets = S.audit = null; S.editing = null; S.dash = null;
    if (t) call('api_logout', t).catch(function () {});
    toast('Anda telah log keluar.');
    render();
  }

  // ------------------------------------------------------------------ navigasi
  function go(target) {
    S.navOpen = false; S.editing = null; S.list = null; S.listFilters = {};
    var lvl = levelOf(target); if (lvl) S.open[lvl] = true;
    if (target === 'infografik') { S.view = { name: 'infografik' }; S.trend = null; S.dash = null; }
    else if (target === 'dashboard') { S.view = { name: 'dashboard' }; S.dash = null; } // muat semula supaya angka terkini dipaparkan
    else if (target.indexOf('kpi:') === 0) S.view = { name: 'kpi', id: target.slice(4), tab: 'list' };
    else { S.view = { name: target }; if (target === 'users') S.users = null; if (target === 'targets') S.targets = null; if (target === 'audit') S.audit = null; if (target === 'setup') S.setup = null; }
    render(); window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------------ peristiwa
  document.addEventListener('click', function (ev) {
    var nav = ev.target.closest('[data-nav]');
    if (nav) { go(nav.getAttribute('data-nav')); return; }
    var a = ev.target.closest('[data-action]');
    if (!a) return;
    var act = a.getAttribute('data-action');
    var k = S.view.name === 'kpi' ? kpiById(S.view.id) : null;
    switch (act) {
      case 'togglenav': S.navOpen = !S.navOpen; $('#side').classList.toggle('open', S.navOpen); $('.scrim').classList.toggle('open', S.navOpen); break;
      case 'tg':
        var gid = a.getAttribute('data-g');
        if (S.mini) { S.mini = false; S.open[gid] = true; } else S.open[gid] = !isOpen(gid);
        redrawSide(); break;
      case 'collapse':
        if (window.innerWidth <= 860) { S.navOpen = false; $('#side').classList.remove('open'); $('.scrim').classList.remove('open'); }
        else { S.mini = !S.mini; redrawSide(); }
        break;
      case 'closenav': S.navOpen = false; $('#side').classList.remove('open'); $('.scrim').classList.remove('open'); break;
      case 'login': S.login = { email: '' }; renderLogin(); break;
      case 'sendotp': sendOtp(); break;
      case 'lclose': ev.preventDefault(); S.login = null; render(); break;
      case 'logout': doLogout(); break;
      case 'dview': S.dashView = a.getAttribute('data-view'); renderDashboard(); break;
      case 'padd':
        var pk = a.getAttribute('data-key'), pfd = k && fieldDef(k, pk);
        syncPeople(pk);
        if (!S.people[pk]) S.people[pk] = [];
        if (pfd && pfd.max && S.people[pk].length >= pfd.max) { toast('Maksimum ' + pfd.max + ' ' + (pfd.noun || 'pelajar') + '.', true); break; }
        S.people[pk].push({ nama: '', matrik: '', nokp: '' }); redrawPeople(pk); break;
      case 'pdel': syncPeople(a.getAttribute('data-key')); S.people[a.getAttribute('data-key')].splice(parseInt(a.getAttribute('data-i'), 10), 1); redrawPeople(a.getAttribute('data-key')); break;
      case 'fdl': if (k) downloadPdf(k, a.getAttribute('data-id'), a.getAttribute('data-key')); break;
      case 'tab': S.view.tab = a.getAttribute('data-tab'); if (S.view.tab === 'list') S.editing = null; renderKpi(); break;
      case 'new': S.editing = null; S.view.tab = 'form'; renderKpi(); break;
      case 'cancelform': S.editing = null; S.view.tab = 'list'; renderKpi(); break;
      case 'edit':
        S.editing = (S.list.rows.filter(function (r) { return r.id === a.getAttribute('data-id'); })[0]) || null;
        S.view.tab = 'form'; renderKpi(); window.scrollTo(0, 0); break;
      case 'del':
        if (k) {
          var rid = a.getAttribute('data-id');
          askConfirm('Padam rekod ' + rid + '? Tindakan ini tidak boleh dibatalkan.', 'Ya, padam').then(function (yes) {
            if (!yes) return;
            call('api_delete', S.token, k.id, rid).then(function () { toast('Rekod dipadam.'); S.list = null; renderList(k); })
              .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
          });
        }
        break;
      case 'uedit':
        var u = S.users.filter(function (x) { return x.emel === a.getAttribute('data-email'); })[0];
        if (u) {
          $('#u_emel').value = u.emel; $('#u_nama').value = u.nama; $('#u_peranan').value = u.peranan;
          $('#u_fakulti').value = u.fakulti; $('#u_akses').value = u.kpi_akses; $('#u_aktif').value = u.aktif;
          window.scrollTo(0, 0);
        }
        break;
      case 'uclear': $('#uform').reset(); break;
      case 'copy': copyText(a.getAttribute('data-v')); break;
      case 'print':   // tajuk dokumen (dan nama fail PDF) = Laporan Prestasi UTMXCITE
        var oldTitle = document.title; document.title = 'Laporan Prestasi UTMXCITE' + (S.dash ? ' ' + S.dash.year : '');
        window.print(); document.title = oldTitle; break;
      case 'runsetup':
        askConfirm('Jalankan persediaan semula? Tab/lajur yang tiada akan ditambah; data sedia ada tidak dipadam.', 'Ya, jalankan').then(function (yes) {
          if (!yes) return;
          call('api_runSetup', S.token).then(function () { toast('Persediaan selesai.'); S.setup = null; renderSetup(); })
            .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        });
        break;
      case 'testmail':
        call('api_testMail', S.token).then(function (r) { toast('E-mel ujian dihantar ke ' + r.to + '.'); })
          .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        break;
      case 'udel':
        var em = a.getAttribute('data-email');
        askConfirm('Padam pengguna ' + em + '?', 'Ya, padam').then(function (yes) {
          if (!yes) return;
          call('api_deleteUser', S.token, em).then(function () { toast('Pengguna dipadam.'); S.users = null; renderUsers(); })
            .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        });
        break;
      case 'tsave':
        var i = parseInt(a.getAttribute('data-i'), 10), t = S.targets[i], row = { kpi: t.kpi, tahun: t.tahun };
        $$('[data-t="' + i + '"]').forEach(function (inp) { row[inp.getAttribute('data-k')] = inp.value; });
        call('api_saveTarget', S.token, row).then(function () { toast('Sasaran ' + t.kpi + ' ' + t.tahun + ' disimpan.'); S.dash = null; S.targets = null; renderTargets(); })
          .catch(function (e) { if (!authFail(e)) toast(e.message, true); });
        break;
    }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var id = ev.target.id;
    if (id === 'kform') submitForm();
    else if (id === 'lform') submitLogin();
    else if (id === 'uform') {
      var rec = { emel: $('#u_emel').value, nama: $('#u_nama').value, peranan: $('#u_peranan').value, fakulti: $('#u_fakulti').value, kpi_akses: $('#u_akses').value, aktif: $('#u_aktif').value };
      call('api_saveUser', S.token, rec).then(function () { toast('Pengguna disimpan.'); S.users = null; renderUsers(); })
        .catch(function (e) { if (authFail(e)) return; showFieldErrors(e.fields); toast(e.message, true); });
    }
  });

  document.addEventListener('change', function (ev) {
    if (ev.target.id && ev.target.id.indexOf('f_') === 0 && S.view.name === 'kpi') { var ak = kpiById(S.view.id); if (ak) applyAutofill(ak, ev.target.id.slice(2)); }
    var c = ev.target.getAttribute && ev.target.getAttribute('data-change');
    if (!c) return;
    if (c === 'fupload') { var kk = kpiById(S.view.id); if (kk) uploadPdf(kk, ev.target.getAttribute('data-key'), ev.target.files && ev.target.files[0]); return; }
    if (c === 'year') { S.dash = null; loadDashboard(parseInt(ev.target.value, 10)); }
    if (c === 'iyear') { S.dash = null; loadInfo(parseInt(ev.target.value, 10)); }
    if (c === 'fstatus') { S.listFilters.status = ev.target.value; S.list = null; renderKpi(); }
    if (c === 'fstatus2') { S.listFilters.status2 = ev.target.value; S.list = null; renderKpi(); }
    if (c === 'ffak') { S.listFilters.fakulti = ev.target.value; S.list = null; renderKpi(); }
  });

  var qTimer = null;
  document.addEventListener('input', function (ev) {
    if (ev.target.getAttribute && ev.target.getAttribute('data-input') === 'q') {
      var val = ev.target.value;
      clearTimeout(qTimer);
      qTimer = setTimeout(function () {
        S.listFilters.q = val; S.list = null; var k = kpiById(S.view.id);
        if (k) { call('api_list', S.token, k.id, S.listFilters).then(function (r) { S.list = r; var el = $('#q'); var pos = el ? el.selectionStart : 0; renderList(k); el = $('#q'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }); }
      }, 300);
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (S.login) { S.login = null; render(); }
      else if (S.navOpen) { S.navOpen = false; render(); }
    }
  });

  // ------------------------------------------------------------------ mula
  function boot() {
    var t = store('get', 'utmx_token');
    if (!t) { render(); return; }
    S.token = t;
    call('api_session', t).then(function (sess) { S.session = sess; render(); })
      .catch(function () { S.token = null; store('del', 'utmx_token'); render(); });
  }
  boot();
})();
</script>
