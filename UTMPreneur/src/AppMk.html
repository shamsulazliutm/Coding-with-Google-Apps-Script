<script>
/* AppMk: antara muka Makerspace (pengguna, perakuan penyelia tanpa log masuk, admin). Guna UP.Form, UP.api, UP.show, UP.homeHooks, UP.initHooks. */
(function () {
  'use strict';
  var UP = window.UP;
  var $ = function (id) { return document.getElementById(id); };
  var node = UP.node, msg = UP.msg, msgErr = UP.msgErr, clearMsg = UP.clearMsg, busy = UP.busy;
  var ADMIN = ['Admin Penuh', 'Pegawai Modul', 'Pemerhati', 'Penilai'];
  var MK = { info: null, jenis: '', bagi: null, form: null, seqA: 0, seqE: 0, timer: null, availTimer: null, confirm: '', detId: '', adId: '' };
  var AD = { tab: 'tempahan', ring: null, q: '', jenis: 'SEMUA', status: 'AKTIF', dari: '', hingga: '', bayStatus: 'SEMUA', timer: null, pilih: null };

  var ST = { 'Menunggu Perakuan': 'warn', 'Menunggu Kelulusan': 'info', Diluluskan: 'ok', Selesai: 'ok', Ditolak: 'bad', Dibatalkan: 'bad',
    'Belum Bayar': 'warn', 'Menunggu Pengesahan': 'info', Dibayar: 'ok', Dikecualikan: '', Lewat: 'bad', 'Belum Dihantar': 'warn', Dihantar: 'ok' };
  var JENIS = [{ kod: 'Ruang', bm: 'Ruang', en: 'Space' }, { kod: 'Laser Cut', bm: 'Laser Cut', en: '' }, { kod: '3D Printer', bm: '3D Printer', en: '' }, { kod: 'Pinjaman', bm: 'Pinjaman peralatan', en: 'Equipment loan' }];
  var KAEDAH_BAYAR = [{ kod: 'Tunai', bm: 'Tunai', en: 'Cash' }, { kod: 'Pindahan Bank', bm: 'Pindahan bank', en: 'Bank transfer' }, { kod: 'Invois Dalaman', bm: 'Invois Dalaman (UTM)', en: 'Internal invoice' }, { kod: 'Lain-lain', bm: 'Lain-lain', en: 'Other' }];

  function rm(n) { return n === null || n === undefined || n === '' ? '' : 'RM' + Number(n).toFixed(2); }
  function pill(text, kind) { return UP.pill(text, kind || ''); }
  function wait(el) { el.textContent = ''; el.appendChild(node('div', null, 'spinner')); }
  function errBox(el, r) { el.textContent = ''; var m = node('div', null, 'msg err'); el.appendChild(m); msgErr(m, r); }
  function row2(a, b) { var d = node('div', null, 'row'); d.appendChild(a); d.appendChild(node('span', null, 'sp')); if (b) d.appendChild(b); return d; }
  function card() { return node('div', null, 'card'); }
  function h2(bm, en) { var d = node('div', bm, 'h2'); if (en) { d.appendChild(document.createTextNode(' ')); d.appendChild(node('span', en, 'e')); } return d; }
  function btn(bm, en, cls, fn) {
    var b = node('button', bm + ' ', 'btn ' + (cls || '')); b.type = 'button';
    if (en) b.appendChild(node('span', en, 'e'));
    if (fn) b.addEventListener('click', fn);
    return b;
  }
  function smallBtn(bm, en, cls, fn) { return btn(bm, en, 'sm ' + (cls || ''), fn); }
  function tarikhTeks(o) {
    var t = o.tarikhMula + (o.tarikhTamat && o.tarikhTamat !== o.tarikhMula ? ' hingga ' + o.tarikhTamat : '');
    return t + (o.masaMula ? ' · ' + o.masaMula + (o.masaTamat ? '-' + o.masaTamat : '') : '');
  }
  function sel(id, options, value) {
    var s = document.createElement('select'); s.id = id;
    options.forEach(function (o) { var op = node('option', o[1]); op.value = o[0]; s.appendChild(op); });
    if (value !== undefined) s.value = value;
    return s;
  }
  function lab(bm, en, forId) {
    var l = node('label', null, 'lab'); if (forId) l.htmlFor = forId;
    l.appendChild(node('span', bm, 'l')); l.appendChild(document.createTextNode(' ')); l.appendChild(node('span', en, 'e')); return l;
  }
  function slots(mula, tamat, step) {
    var out = [];
    for (var m = mula; m <= tamat; m += step) { var t = ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); out.push({ kod: t, bm: t, en: '' }); }
    return out;
  }
  function toMin(s) { var p = String(s || '').split(':'); return p.length === 2 ? parseInt(p[0], 10) * 60 + parseInt(p[1], 10) : 0; }
  function isAdmin() { return !!(UP.S.session && ADMIN.indexOf(UP.S.session.role) >= 0); }

  // ---------- Jenis borang tambahan: senarai item (alat + kuantiti) ----------
  UP.formTypes.mkitems = function (f, wrap, api, h) {
    var box = h.node('div');
    var add = h.node('button', '+ Tambah / Add', 'btn link'); add.type = 'button';
    function addRow(v) {
      var row = h.node('div', null, 'rep-row');
      var s = document.createElement('select'); var p0 = h.node('option', '— pilih / select —'); p0.value = ''; s.appendChild(p0);
      h.optList(f).forEach(function (o) { var op = h.node('option', o.bm); op.value = o.kod; s.appendChild(op); });
      var q = document.createElement('input'); q.type = 'number'; q.min = '1'; q.placeholder = 'Kuantiti'; q.style.maxWidth = '90px'; q.setAttribute('aria-label', 'Kuantiti');
      if (v) { s.value = v.kod; q.value = v.kuantiti; } else q.value = '1';
      var rmv = h.node('button', '×', 'btn alt sm'); rmv.type = 'button'; rmv.setAttribute('aria-label', 'Buang / Remove');
      rmv.addEventListener('click', function () { box.removeChild(row); box.dispatchEvent(new Event('change', { bubbles: true })); });
      row.appendChild(s); row.appendChild(q); row.appendChild(rmv); box.appendChild(row);
    }
    add.addEventListener('click', function () { addRow(null); box.dispatchEvent(new Event('change', { bubbles: true })); });
    wrap.appendChild(box); wrap.appendChild(add);
    api.get = function () {
      return Array.prototype.map.call(box.children, function (row) { var c = row.querySelectorAll('input,select'); return { kod: c[0].value, kuantiti: c[1].value }; })
        .filter(function (x) { return x.kod || x.kuantiti; });
    };
    api.set = function (arr) { box.textContent = ''; (arr || []).forEach(addRow); };
  };

  // ---------- Menu utama ----------
  function setItem(b, p, on, text, kind) {
    b.disabled = !on; b.classList.toggle('off', !on);
    p.textContent = text; p.className = 'pill ' + (kind || '');
  }
  UP.homeHooks.push(function (s) {
    var admin = ADMIN.indexOf(s.role) >= 0;
    setItem($('go-mk'), $('pill-mk'), true, admin ? 'Menu pentadbir / Admin menu' : '…');
    if (!admin) {
      UP.api('mk.saya').then(function (r) {
        if (!r.ok) { $('pill-mk').textContent = ''; return; }
        var d = r.data, aktif = d.senarai.filter(function (x) { return ['Menunggu Perakuan', 'Menunggu Kelulusan', 'Diluluskan'].indexOf(x.status) >= 0; }).length;
        var sekat = d.sekatan.bil.length || d.sekatan.laporan.length || d.sekatan.pinjaman.length;
        $('pill-mk').textContent = sekat ? 'Perlu tindakan / Action needed' : (aktif ? aktif + ' aktif / active' : 'Tempah / Book');
        $('pill-mk').className = 'pill ' + (sekat ? 'warn' : (aktif ? 'info' : ''));
      });
    }
    var adm = ['Admin Penuh', 'Pegawai Modul', 'Pemerhati'].indexOf(s.role) >= 0;
    $('go-mk-admin').hidden = !adm;
    if (adm) UP.api('mk.admin.ringkasan').then(function (r) {
      if (!r.ok) return;
      var n = r.data.menungguKelulusan + r.data.bayaranMenunggu;
      $('pill-mk-admin').textContent = n + ' menunggu / pending'; $('pill-mk-admin').className = 'pill ' + (n ? 'warn' : '');
    });
  });

  // ---------- Pengguna: hub ----------
  function openHub(notice) {
    UP.show('v-mk'); clearMsg($('msg-mk'));
    var admin = isAdmin();
    $('mk-admin-note').hidden = !admin; $('mk-new').hidden = admin; $('mk-sekatan').textContent = '';
    var list = $('mk-list');
    if (admin) { list.textContent = ''; list.appendChild(node('p', 'Tiada tempahan sendiri bagi pentadbir. / No personal bookings for admins.', 'muted')); $('mk-pemohon').textContent = ''; return; }
    wait(list);
    Promise.all([UP.api('mk.maklumat'), UP.api('mk.saya')]).then(function (res) {
      list.textContent = '';
      if (!res[0].ok) { errBox(list, res[0]); return; }
      if (!res[1].ok) { errBox(list, res[1]); return; }
      var info = MK.info = res[0].data, d = res[1].data;
      $('mk-pemohon').textContent = info.pemohon.nama + ' · ' + info.pemohon.jenisPengguna;
      var sk = $('mk-sekatan');
      var warn = function (bm, en) { var m = node('div', null, 'msg err'); m.setAttribute('data-sekatan', '1'); m.appendChild(document.createTextNode(bm)); m.appendChild(node('i', en)); sk.appendChild(m); };
      if (info.sekatan.bil) warn('Anda mempunyai bil Makerspace yang lewat. Tempahan baharu disekat sehingga bil dijelaskan.', 'You have an overdue Makerspace bill. New bookings are blocked until it is settled.');
      if (info.sekatan.laporan) warn('Laporan aktiviti tempahan ruang terdahulu belum dihantar. Tempahan ruang baharu disekat.', 'An activity report is overdue. New space bookings are blocked.');
      if (info.sekatan.pinjaman) warn('Anda mempunyai pinjaman peralatan yang lewat dipulangkan. Pinjaman baharu disekat.', 'You have overdue borrowed equipment. New loans are blocked.');
      var blokAll = info.sekatan.bil;
      var set = function (id, on, tip) { var b = $(id); b.disabled = !on; b.title = on ? '' : tip; };
      set('mk-new-ruang', !blokAll && !info.sekatan.laporan && info.ruang.length > 0, info.ruang.length ? 'Disekat / Blocked' : 'Belum tersedia / Not available yet');
      set('mk-new-laser', !blokAll && info.laser.length > 0, info.laser.length ? 'Disekat / Blocked' : 'Belum tersedia / Not available yet');
      set('mk-new-tdp', !blokAll && info.tdp.length > 0, info.tdp.length ? 'Disekat / Blocked' : 'Belum tersedia / Not available yet');
      set('mk-new-pinjam', !blokAll && !info.sekatan.pinjaman && info.alat.length > 0, info.alat.length ? 'Disekat / Blocked' : 'Belum tersedia / Not available yet');
      if (notice) { var nt = node('div', null, 'msg ok'); nt.textContent = notice; list.appendChild(nt); }
      if (!d.senarai.length) { list.appendChild(node('p', 'Belum ada tempahan. / No bookings yet.', 'muted')); return; }
      d.senarai.forEach(function (o) {
        var it = node('div', null, 'mk-item'); it.setAttribute('data-id', o.id);
        var hd = row2(node('b', o.sumberNama + ' · ' + o.jenis), pill(o.status, ST[o.status]));
        it.appendChild(hd);
        it.appendChild(node('div', o.id + ' · ' + tarikhTeks(o), 'e'));
        var ex = node('div', null, 'mk-stat');
        if (o.bayaran) ex.appendChild(pill('Bil ' + o.bayaran.id + ': ' + o.bayaran.status + (o.bayaran.jumlah !== null ? ' ' + rm(o.bayaran.jumlah) : ''), ST[o.bayaran.status]));
        if (o.lewat) ex.appendChild(pill('Lewat pulang / Overdue', 'bad'));
        if (ex.children.length) it.appendChild(ex);
        it.addEventListener('click', function () { openDet(o.id); });
        list.appendChild(it);
      });
    });
  }

  // ---------- Pengguna: borang ----------
  function pilihanSumber(arr, jenis) {
    return arr.map(function (x) {
      var bm = x.nama + (jenis === 'Ruang' ? ' (kapasiti ' + x.kapasiti + ')' : '');
      var k = jenis === 'Ruang' ? x.kadar : (jenis === 'Laser Cut' ? x.kadar : null);
      if (k) bm += k.ada ? ' · ' + rm(k.rm) + ' ' + k.unit : ' · kadar belum ditetapkan';
      return { kod: x.kod, bm: bm, en: '' };
    });
  }
  function tail(info, bagi) {
    var out = [];
    if (bagi && !bagi.adaProfil) {
      out.push({ t: 'sect', k: '_p', bm: 'Maklumat pemohon (belum ada profil)', en: 'Applicant details (no profile yet)' });
      out.push({ k: 'namaPemohon', t: 'text', bm: 'Nama pemohon', en: 'Applicant name', req: 1, max: 120 });
      out.push({ k: 'telefonPemohon', t: 'tel', bm: 'No. telefon pemohon', en: 'Applicant phone', req: 1 });
      out.push({ k: 'jabatanPemohon', t: 'text', bm: 'Jabatan / organisasi', en: 'Department / organisation', max: 160 });
    }
    if (info.jenisPengguna === 'Pelajar') {
      out.push({ t: 'sect', k: '_s', bm: 'Penyelia / pensyarah', en: 'Supervisor / lecturer' });
      out.push({ k: 'emelPenyelia', t: 'text', bm: 'Emel penyelia (@utm.my)', en: 'Supervisor email', req: 1, max: 120, ph: 'pensyarah@utm.my',
        hint: 'Pautan perakuan dan kod OTP akan dihantar ke emel ini. Mesti emel staf dan bukan emel anda. / An endorsement link and OTP are sent here. Must be a staff email.' });
    }
    out.push({ t: 'sect', k: '_z', bm: 'Perakuan', en: 'Declaration' });
    out.push({ k: 'perakuan', t: 'check', bm: bagi ? 'Pemohon telah bersetuju dan bertanggungjawab ke atas keselamatan, kerosakan, kebersihan dan caj yang dikenakan.' : 'Saya bertanggungjawab ke atas keselamatan peralatan, penggantian kerosakan akibat kecuaian, kebersihan dan bersetuju dengan kadar caj yang dikenakan.',
      en: 'The applicant takes responsibility for safety, damage, cleanliness and agrees to the charges.' });
    return out;
  }
  function specFor(jenis, info, bagi) {
    var o = info.operasi;
    var ruangBuka = slots(toMin(o.buka), toMin(o.tutup) - 30, 30), ruangTutup = slots(toMin(o.buka) + 30, toMin(o.tutup), 30);
    var mesinSlot = slots(toMin(o.buka), toMin(o.tutup) - o.slot, o.slot);
    var tarikhHint = 'Isnin hingga Jumaat, ' + o.buka + ' - ' + o.tutup + ' (kecuali cuti). / Mon-Fri, ' + o.buka + ' - ' + o.tutup + ' (except holidays).';
    var spec;
    if (jenis === 'Ruang') {
      spec = [
        { t: 'sect', k: '_a', bm: 'Ruang dan masa', en: 'Space and time' },
        { k: 'kodSumber', t: 'select', o: pilihanSumber(info.ruang, 'Ruang'), bm: 'Ruang', en: 'Space', req: 1 },
        { k: 'namaProgram', t: 'text', bm: 'Tujuan / program', en: 'Purpose / programme', req: 1, max: 200, hint: 'Penggunaan ruang wajib berkaitan inovasi dan keusahawanan. / Use must relate to innovation and entrepreneurship.' },
        { k: 'tarikh', t: 'date', bm: 'Tarikh mula', en: 'Start date', req: 1, hint: 'Tempahan sekurang-kurangnya ' + o.notisHari + ' hari bekerja lebih awal. ' + tarikhHint },
        { k: 'bilHari', t: 'number', bm: 'Bilangan hari', en: 'Number of days', req: 1, hint: 'Hari operasi berturut-turut (hujung minggu dan cuti dilangkau). Maksimum ' + info.had.maksHariRuang + '.' },
        { k: 'masaMula', t: 'select', o: ruangBuka, bm: 'Masa mula', en: 'Start time', req: 1 },
        { k: 'masaTamat', t: 'select', o: ruangTutup, bm: 'Masa tamat', en: 'End time', req: 1 },
        { k: 'bilPeserta', t: 'number', bm: 'Jumlah peserta', en: 'Number of participants', req: 1 },
        { t: 'sect', k: '_b', bm: 'Pembayaran', en: 'Payment' },
        { k: 'kaedahBayaran', t: 'radio', o: KAEDAH_BAYAR.filter(function (x) { return x.kod !== 'Pindahan Bank' && info.kaedahBayaran.indexOf(x.kod) >= 0; }), bm: 'Kaedah pembayaran', en: 'Payment method', req: 1 },
        { k: 'kaedahLain', t: 'text', bm: 'Nyatakan kaedah', en: 'Specify', max: 120, show: function (v) { return v.kaedahBayaran === 'Lain-lain'; } },
        { k: 'noVot', t: 'text', bm: 'No. VOT / cajline PTJ', en: 'VOT / cajline no.', max: 40, show: function (v) { return v.kaedahBayaran === 'Invois Dalaman'; } },
        { k: 'namaStafKewangan', t: 'text', bm: 'Nama staf kewangan bertanggungjawab', en: 'Finance officer in charge', max: 120, show: function (v) { return v.kaedahBayaran === 'Invois Dalaman'; } },
        { k: 'telStafKewangan', t: 'tel', bm: 'No. telefon staf kewangan', en: 'Finance officer phone', show: function (v) { return v.kaedahBayaran === 'Invois Dalaman'; } },
        { t: 'sect', k: '_c', bm: 'Peralatan tambahan (sehari)', en: 'Additional equipment (per day)' },
        { k: 'peralatan', t: 'mkitems', o: info.peralatanRuang.map(function (x) {
          return { kod: x.kod, bm: x.nama + (x.kadar.ada ? (x.kadar.rm > 0 ? ' (' + rm(x.kadar.rm) + ' ' + x.unit + ')' : ' (disediakan)') : ' (kadar belum ditetapkan)'), en: '' };
        }), bm: 'Peralatan dan kuantiti', en: 'Equipment and quantity' },
        { t: 'sect', k: '_d', bm: 'Dokumen', en: 'Documents' },
        { k: 'failKertasKerja', t: 'file', accept: '.pdf', bm: 'Kertas kerja program (PDF)', en: 'Programme paper', req: 1 },
        { k: 'failSurat', t: 'file', accept: '.pdf', bm: 'Surat permohonan (PDF)' + (info.jenisPengguna === 'Pelajar' ? ' - pilihan' : ''), en: 'Application letter' + (info.jenisPengguna === 'Pelajar' ? ' - optional (supervisor endorsement replaces it)' : '') }
      ];
    } else if (jenis === 'Pinjaman') {
      spec = [
        { t: 'sect', k: '_a', bm: 'Peralatan dan tempoh', en: 'Equipment and period' },
        { k: 'item', t: 'mkitems', o: info.alat.map(function (a) { return { kod: a.kod, bm: a.nama + ' (baki ' + a.baki + ')', en: '' }; }), bm: 'Alat dan kuantiti', en: 'Items and quantity', req: 1 },
        { k: 'tarikh', t: 'date', bm: 'Tarikh pinjam', en: 'Loan date', req: 1, hint: tarikhHint },
        { k: 'tarikhPulang', t: 'date', bm: 'Tarikh dijangka pulang', en: 'Expected return date', req: 1, hint: 'Maksimum ' + info.had.pinjamanBulan + ' bulan; boleh diperbaharui sekali. / Maximum ' + info.had.pinjamanBulan + ' month; one renewal.' },
        { k: 'tujuan', t: 'textarea', bm: 'Tujuan', en: 'Purpose', req: 1, max: 300 }
      ];
    } else {
      var laser = jenis === 'Laser Cut';
      spec = [
        { t: 'sect', k: '_a', bm: laser ? 'Mesin Laser Cut' : 'Mesin 3D Printer', en: laser ? 'Laser cutting machine' : '3D printer' },
        { k: 'kodSumber', t: 'select', o: info[laser ? 'laser' : 'tdp'].map(function (x) {
          var bm = x.nama;
          if (laser) bm += x.kadar.ada ? ' · ' + rm(x.kadar.rm) + ' ' + x.kadar.unit : ' · kadar belum ditetapkan';
          return { kod: x.kod, bm: bm, en: '' };
        }), bm: 'Mesin', en: 'Machine', req: 1 },
        { k: 'namaProjek', t: 'text', bm: 'Nama projek', en: 'Project name', req: 1, max: 120 },
        { k: 'tujuan', t: 'textarea', bm: 'Tujuan penggunaan', en: 'Purpose of use', req: 1, max: 300 },
        { k: 'tarikh', t: 'date', bm: 'Tarikh', en: 'Date', req: 1, hint: tarikhHint },
        { k: 'masaMula', t: 'select', o: mesinSlot, bm: 'Masa mula (slot ' + o.slot + ' minit)', en: 'Start time', req: 1 },
        { k: 'masaDijangkaMin', t: 'number', bm: 'Masa dijangka (minit)', en: 'Expected time (minutes)', req: 1, hint: 'Maksimum ' + o.maksMinit + ' minit sesi. / Maximum ' + o.maksMinit + ' minutes.' }
      ];
      if (laser) spec.push({ k: 'jenisBahan', t: 'text', bm: 'Jenis bahan', en: 'Material', req: 1, max: 80 });
      else {
        spec.push({ k: 'beratG', t: 'number', bm: 'Berat dijangka (gram)', en: 'Expected weight (g)', req: 1 });
        spec.push({ k: 'warna', t: 'text', bm: 'Warna', en: 'Colour', req: 1, max: 40 });
        spec.push({ k: 'gambar', t: 'file', accept: '.jpg,.jpeg,.png', bm: 'Gambar projek (JPG/PNG)', en: 'Project picture', req: 1 });
      }
    }
    return spec.concat(tail(info, bagi));
  }

  var TITLE = { Ruang: ['Tempah ruang', 'Book a space'], 'Laser Cut': ['Tempahan Laser Cut', 'Laser Cut booking'], '3D Printer': ['Tempahan 3D Printer', '3D Printer booking'], Pinjaman: ['Pinjaman peralatan', 'Equipment loan'] };

  function openForm(jenis, bagi) {
    MK.jenis = jenis; MK.bagi = bagi || null; MK.form = null;
    UP.show('v-mk-form'); clearMsg($('msg-mk-form'));
    $('mk-form-tajuk').textContent = TITLE[jenis][0]; $('mk-form-tajuk-en').textContent = TITLE[jenis][1];
    var bi = $('mk-bagi-info');
    bi.hidden = !bagi; bi.textContent = bagi ? 'Bertindak bagi pihak: ' + bagi.nama + ' (' + (bagi.noMatrik || bagi.emel) + ') · ' + bagi.jenis + ' / Acting on behalf of the applicant' : '';
    $('mk-avail').hidden = true; $('mk-est').hidden = true;
    var box = $('mk-form-box'); wait(box);
    UP.api('mk.maklumat', bagi ? { jenisPengguna: bagi.jenis } : {}).then(function (r) {
      box.textContent = '';
      if (!r.ok) { msgErr($('msg-mk-form'), r); return; }
      MK.info = r.data;
      var o = r.data.operasi;
      $('mk-form-ops').textContent = 'Waktu operasi: Isnin hingga Jumaat, ' + o.buka + ' - ' + o.tutup + ' · Operating hours Mon-Fri';
      MK.form = UP.Form(specFor(jenis, r.data, bagi));
      box.appendChild(MK.form.el);
      var init = { masaMula: slotDefault(jenis, r.data), perakuan: false };
      if (jenis === 'Ruang') { init.bilHari = 1; init.masaTamat = '16:00'; init.kaedahBayaran = 'Tunai'; init.bilPeserta = ''; }
      if (jenis === 'Pinjaman') init.item = [{ kod: '', kuantiti: 1 }];
      MK.form.set(init);
      MK.form.el.addEventListener('change', onFormChange);
      MK.form.el.addEventListener('input', onFormChange);
      $('btn-mk-hantar').disabled = false;
    });
  }
  function slotDefault(jenis, info) { return info.operasi.buka; }

  function onFormChange() {
    clearTimeout(MK.timer); clearTimeout(MK.availTimer);
    MK.availTimer = setTimeout(refreshAvail, 250);
    MK.timer = setTimeout(refreshEstimate, 450);
  }
  function refreshAvail() {
    var box = $('mk-avail');
    if (!MK.form || MK.jenis === 'Pinjaman') { box.hidden = true; return; }
    var v = MK.form.values();
    if (!v.kodSumber || !v.tarikh) { box.hidden = true; return; }
    var my = ++MK.seqA;
    UP.api('mk.ketersediaan', { kodSumber: v.kodSumber, tarikh: v.tarikh }).then(function (r) {

  function simpanForm(p, opts) {
    // opts: {tajuk, en, spec, listMethod, saveMethod, cols, rowCells, fill, readonlyOk, lead}
    var c = card(); c.appendChild(h2(opts.tajuk, opts.en));
    if (opts.lead) opts.lead(c);
    var res = node('div'); c.appendChild(res); p.appendChild(c);
    var fc = card(); fc.appendChild(h2(opts.formTajuk, opts.formEn)); p.appendChild(fc);
    var fm = null, m = node('div', null, 'msg'); m.hidden = true; m.id = opts.msgId;
    var save = btn('Simpan', 'Save', '', null); save.id = opts.saveId;
    var nw = smallBtn('Baharu', 'New', 'alt', function () { build(null); });
    nw.style.marginBottom = '6px';
    function build(data) {
      var keep = fc.querySelector('.fbox'); if (keep) fc.removeChild(keep);
      var box = node('div', null, 'fbox'); fc.insertBefore(box, m);
      fm = UP.Form(opts.spec(data)); box.appendChild(fm.el); fm.set(data || opts.defaults || {});
      if (data && opts.lockKey) opts.lockKey.forEach(function (k) { var i = fm.fields[k].wrap.querySelector('input,select'); if (i) { if (i.tagName === 'SELECT') i.disabled = true; else i.readOnly = true; } });
      clearMsg(m);
    }
    fc.appendChild(nw); fc.appendChild(m); fc.appendChild(save);
    if (!canEdit()) { save.disabled = true; nw.disabled = true; fc.appendChild(node('p', 'Anda hanya boleh melihat (tiada kebenaran mengubah). / View only.', 'muted')); }
    save.addEventListener('click', function () {
      if (!fm) return;
      clearMsg(m); fm.clear(); busy(save, true);
      UP.api(opts.saveMethod, opts.payload(fm.values())).then(function (r) {
        busy(save, false);
        if (!r.ok) { msgErr(m, r); if (r.error && r.error.extra && r.error.extra.medan) fm.errors(r.error.extra.medan); return; }
        paint(r.data); build(null);
        msg(m, 'ok', 'Disimpan.', 'Saved.');
        UP.api('mk.admin.ringkasan').then(function (x) { if (x.ok) { AD.ring = x.data; } });
      });
    });
    function paint(data) {
      res.textContent = '';
      var t = table(opts.cols);
      data.senarai.forEach(function (x) { var row = tr(opts.rowCells(x), function () { build(opts.fill(x)); window.scrollTo(0, document.body.scrollHeight); }); row.setAttribute('data-kod', x.kod); t.body.appendChild(row); });
      res.appendChild(t.el);
      if (!data.senarai.length) res.appendChild(node('p', 'Tiada rekod. / No records.', 'muted'));
    }
    UP.api(opts.listMethod).then(function (r) { if (!r.ok) { errBox(res, r); return; } paint(r.data); });
    build(null);
  }

    var c1 = card();
    c1.appendChild(row2(node('div', d.sumberNama, 'h1'), pill(d.status, ST[d.status])));
    c1.appendChild(node('div', d.id + ' · ' + d.jenis + (d.bagiPihak ? ' · didaftar admin' : ''), 'e'));
    (d.amaran || []).forEach(function (t) { var w = node('div', null, 'msg info'); w.setAttribute('data-amaran', '1'); w.textContent = t; c1.appendChild(w); });
    body.appendChild(c1);
    var c2 = card(); c2.appendChild(h2('Pemohon', 'Applicant'));
    c2.appendChild(kvBox([['Nama', d.namaPemohon], ['Jenis', d.jenisPengguna], ['Emel', d.pemohon.emel], ['No. Matrik', d.pemohon.noMatrik], ['Telefon', d.pemohon.telefon], ['Jabatan', d.pemohon.jabatan], ['Didaftar oleh', d.pemohon.didaftarOleh]]));
    body.appendChild(c2);
    var c3 = card(); c3.appendChild(h2('Tempahan', 'Booking'));
    var rows = [['Tarikh dan masa', tarikhTeks(d)], ['Tujuan', d.tujuan]].concat(butiranRows(d));
    rows.push(['Penyelia', d.penyelia]); rows.push(['Status perakuan', d.statusPerakuan]); rows.push(['Catatan penyelia', d.catatanPenyelia]);
    rows.push(['Anggaran', d.anggaran === null ? '' : rm(d.anggaran)]); rows.push(['Diluluskan oleh', d.diluluskanOleh]); rows.push(['Catatan', d.catatan]);
    c3.appendChild(kvBox(rows));
    var fl = node('div');
    if (d.fail && d.fail.kertas) fl.appendChild(UP.fileBtn('Kertas kerja', 'Paper', 'mk.fail', { id: d.id, jenis: 'kertas' }, out));
    if (d.fail && d.fail.surat) fl.appendChild(UP.fileBtn('Surat', 'Letter', 'mk.fail', { id: d.id, jenis: 'surat' }, out));
    if (d.fail && d.fail.gambar) fl.appendChild(UP.fileBtn('Gambar projek', 'Picture', 'mk.fail', { id: d.id, jenis: 'gambar' }, out));
    if (d.laporan && d.laporan.ada) fl.appendChild(UP.fileBtn('Laporan aktiviti', 'Report', 'mk.fail', { id: d.id, jenis: 'laporan' }, out));
    c3.appendChild(fl); c3.appendChild(out);
    body.appendChild(c3);

    var kira = d.kira && (d.kira.sebenar && d.kira.sebenar.baris.length ? d.kira : null);
    if (d.kira && d.kira.anggaran.baris.length) {
      var ck = card(); ck.appendChild(h2('Pengiraan kos', 'Cost calculation'));
      var t = table(['Perkara', 'Kuantiti', 'Kadar', 'Anggaran', 'Sebenar']);
      d.kira.anggaran.baris.forEach(function (b, i) {
        var s = d.kira.sebenar.baris[i] || {};
        t.body.appendChild(tr([b.nama + ' (' + b.unit + ')', b.kuantiti, b.kadar === null ? 'belum ditetapkan' : rm(b.kadar), b.jumlah === null ? '-' : rm(b.jumlah), s.jumlah === null || s.jumlah === undefined ? '-' : rm(s.jumlah)]));
      });
      ck.appendChild(t.el);
      body.appendChild(ck);
    }
    if (d.bayaran) {
      var b = d.bayaran, cb = card(); cb.appendChild(row2(h2('Bil', 'Bill'), pill(b.status, ST[b.status])));
      cb.appendChild(kvBox([['No. bil', b.id], ['Jumlah', rm(b.jumlah) + (b.kosSebenar !== null ? ' (kos sebenar)' : ' (anggaran)')], ['Tarikh akhir', b.tarikhAkhir], ['Kaedah', b.kaedah], ['No. rujukan', b.noRujukan], ['Catatan', b.catatan]]));
      var lnk = btn('Urus dalam tab Bayaran', 'Manage in Payments', 'alt sm', function () { AD.tab = 'bayaran'; AD.bayStatus = 'SEMUA'; AD.pilih = b.id; openAdmin('bayaran'); });
      lnk.className = 'btn alt sm'; cb.appendChild(lnk);
      body.appendChild(cb);
    }

    var c4 = card(); c4.appendChild(h2('Tindakan', 'Actions'));
    var ma = node('div', null, 'msg'); ma.hidden = true; ma.id = 'msg-mk-adet';
    if (!d.boleh.putus) c4.appendChild(node('p', 'Anda hanya boleh melihat (tiada kebenaran memutuskan). / View only.', 'muted'));
    else {
      var cat = document.createElement('textarea'); cat.id = 'mk-ad-cat'; cat.placeholder = 'Catatan (wajib untuk tolak dan batal) / Note'; cat.style.minHeight = '56px'; cat.style.fontFamily = 'inherit'; cat.style.fontSize = '14px';
      if (d.boleh.lulus || d.boleh.tolak || d.boleh.batal) c4.appendChild(cat);
      var row = node('div', null, 'mk-act');
      var act = function (t, bm, en, cls, confirm) {
        var bt = smallBtn(bm, en, cls, function () {
          if (confirm && MK.confirm !== t) { MK.confirm = t; bt.firstChild.textContent = 'Tekan sekali lagi untuk sahkan '; return; }
          MK.confirm = ''; bt.disabled = true; clearMsg(ma);
          UP.api('mk.admin.putus', { id: d.id, tindakan: t, catatan: cat.value }).then(function (res) {
            if (!res.ok) { bt.disabled = false; msgErr(ma, res); return; }
            renderAdet(res);
          });
        });
        bt.setAttribute('data-act', t); row.appendChild(bt);
      };
      if (d.boleh.lulus) act('lulus', d.jenisPengguna === 'Pelajar' ? 'Luluskan' : 'Perakui dan luluskan', 'Approve', '', true);
      if (d.boleh.tolak) act('tolak', 'Tolak', 'Reject', 'alt', true);
      if (d.boleh.batal) act('batal', 'Batalkan', 'Cancel', 'alt', true);
      c4.appendChild(row);
      if (d.boleh.penggunaan) {
        c4.appendChild(node('div', 'Rekod penggunaan sebenar / Record actual usage', 'sech'));
        var fields = [];
        var inpt = function (id, ph) { var i = document.createElement('input'); i.id = id; i.type = 'number'; i.placeholder = ph; i.style.marginTop = '6px'; fields.push(i); c4.appendChild(i); return i; };
        if (d.jenis === 'Ruang') inpt('mk-pg-hari', 'Hari sebenar / Actual days (1-' + d.butiran.bilHari + ')');
        else { inpt('mk-pg-minit', 'Masa sebenar (minit) / Actual minutes'); if (d.jenis === '3D Printer') inpt('mk-pg-berat', 'Berat sebenar (gram) / Actual grams'); }
        var pb = btn('Simpan penggunaan sebenar', 'Save actual usage', 'alt sm', function () {
          clearMsg(ma); pb.disabled = true;
          var pl = { id: d.id };
          if ($('mk-pg-hari')) pl.hariSebenar = $('mk-pg-hari').value;
          if ($('mk-pg-minit')) pl.minitSebenar = $('mk-pg-minit').value;
          if ($('mk-pg-berat')) pl.beratSebenarG = $('mk-pg-berat').value;
          UP.api('mk.admin.penggunaan', pl).then(function (res) {
            pb.disabled = false;
            if (!res.ok) { msgErr(ma, res); if (res.error && res.error.extra && res.error.extra.medan) msgErr(ma, { error: { bm: Object.keys(res.error.extra.medan).map(function (k) { return res.error.extra.medan[k]; }).join('; '), en: '' } }); return; }
            renderAdet(res, 'Penggunaan sebenar direkod.');
          });
        });
        pb.id = 'btn-mk-penggunaan'; pb.style.marginTop = '8px'; c4.appendChild(pb);
      }
      if (d.boleh.pulang || d.boleh.perbaharui) {
        var r2 = node('div', null, 'mk-act');
        if (d.boleh.pulang) {
          r2.appendChild(smallBtn('Tandakan semua dipulangkan', 'Mark all returned', '', function (ev) {
            ev.target.disabled = true; clearMsg(ma);
            UP.api('mk.admin.pulang', { id: d.id }).then(function (res) { if (!res.ok) { ev.target.disabled = false; msgErr(ma, res); return; } renderAdet(res, 'Pemulangan direkod.'); });
          }));
          (d.item || []).filter(function (x) { return x.status !== 'Dipulangkan'; }).forEach(function (x) {
            if ((d.item || []).filter(function (y) { return y.status !== 'Dipulangkan'; }).length < 2) return;
            r2.appendChild(smallBtn('Pulang: ' + x.nama, 'Return', 'alt', function (ev) {
              ev.target.disabled = true; clearMsg(ma);
              UP.api('mk.admin.pulang', { id: d.id, kod: x.kod }).then(function (res) { if (!res.ok) { ev.target.disabled = false; msgErr(ma, res); return; } renderAdet(res, 'Pemulangan direkod.'); });
            }));
          });
        }
        if (d.boleh.perbaharui) {
          r2.appendChild(smallBtn('Perbaharui pinjaman', 'Renew', 'alt', function (ev) {
            ev.target.disabled = true; clearMsg(ma);
            UP.api('mk.admin.perbaharui', { id: d.id }).then(function (res) { if (!res.ok) { ev.target.disabled = false; msgErr(ma, res); return; } renderAdet(res, 'Pinjaman diperbaharui.'); });
          }));
        }
        c4.appendChild(r2);
      }
    }
    c4.appendChild(ma);
    body.appendChild(c4);

    if (d.sejarah && d.sejarah.length) {
      var ch = card(); ch.appendChild(h2('Sejarah', 'History'));
      var th = table(['Masa', 'Oleh', 'Tindakan', 'Perubahan', 'Catatan']);
      d.sejarah.forEach(function (a) { th.body.appendChild(tr([a.masa.slice(0, 16).replace('T', ' '), a.emel, a.tindakan, (a.lama ? a.lama + ' → ' : '') + a.baharu, a.catatan])); });
      ch.appendChild(th.el); body.appendChild(ch);
    }
  }

  function init() {
    $('go-mk').addEventListener('click', function () { if (!$('go-mk').disabled) openHub(); });
    $('go-mk-admin').addEventListener('click', function () { AD.tab = 'tempahan'; openAdmin(); });
    $('mk-new-ruang').addEventListener('click', function () { openForm('Ruang'); });
    $('mk-new-laser').addEventListener('click', function () { openForm('Laser Cut'); });
    $('mk-new-tdp').addEventListener('click', function () { openForm('3D Printer'); });
    $('mk-new-pinjam').addEventListener('click', function () { openForm('Pinjaman'); });
    $('btn-mk-form-balik').addEventListener('click', function () { if (MK.bagi) { openAdmin('bagi'); } else openHub(); });
    $('btn-mk-hantar').addEventListener('click', submitForm);
    $('btn-mk-det-balik').addEventListener('click', function () { openHub(); });
    $('btn-mk-adet-balik').addEventListener('click', function () { openAdmin(); });
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
