  var SA = { status: 'SEMUA', q: '', timer: null, id: '', confirm: '' };
  var BAGI = null; // {m, nama} apabila admin bertindak bagi pihak pelajar

  function call(m, p) {

  function bil(bm, en) { var d = node('span', bm + ' '); d.appendChild(node('span', en, 'e')); return d; }

  // ---------- Pembina borang ----------
  /**
   * spec: [{k, t, bm, en, g|o, req, max, show(v)}]. t: sect text tel date number textarea select radio multi check file rep list.
   * Pulang {el, get(), set(obj), errors(map), values()}.
   */
  function Form(spec) {
    var root = node('div');
    var fields = {};
    function label(f) {
      var l = node('label', null, 'lab');
      var a = node('span', f.bm, 'l'); l.appendChild(a);
      if (f.req) l.appendChild(node('span', ' *', 'e'));
      if (f.en) { l.appendChild(document.createTextNode(' ')); l.appendChild(node('span', f.en, 'e')); }
      return l;
    }
    function optList(f) { return f.o || opts(f.g); }
    function mkOption(o) { var op = node('option', o.bm); op.value = o.kod; return op; }
    function choice(type, name, o) {
      var lb = node('label'); var inp = document.createElement('input'); inp.type = type; inp.name = name; inp.value = o.kod;
      lb.appendChild(inp); var s = node('span', o.bm); if (o.en && o.en !== o.bm) { s.appendChild(document.createTextNode(' ')); s.appendChild(node('span', o.en, 'e')); } lb.appendChild(s);
      return lb;
    }
    spec.forEach(function (f) {
      var wrap = node('div', null, f.t === 'sect' ? '' : 'fld');
      var ctl = null, api = {};
      if (f.t === 'sect') {
        wrap = node('div', f.bm + (f.en ? ' / ' + f.en : ''), 'sech');
        api.get = function () { return undefined; }; api.set = function () {};
      } else {
        wrap.appendChild(label(f));
        if (UP.formTypes[f.t]) {
          UP.formTypes[f.t](f, wrap, api, { node: node, optList: optList });
        } else if (f.t === 'text' || f.t === 'tel' || f.t === 'date' || f.t === 'number') {
          ctl = document.createElement('input'); ctl.type = f.t; if (f.ph) ctl.placeholder = f.ph; if (f.max) ctl.maxLength = f.max;
          if (f.t === 'text') ctl.autocomplete = 'off';
          wrap.appendChild(ctl);
          api.get = function () { return ctl.value; }; api.set = function (v) { ctl.value = v == null ? '' : v; };
        } else if (f.t === 'textarea') {
          ctl = document.createElement('textarea'); ctl.style.minHeight = '70px'; ctl.style.fontFamily = 'inherit'; ctl.style.fontSize = '14px';
          wrap.appendChild(ctl);
          api.get = function () { return ctl.value; }; api.set = function (v) { ctl.value = v == null ? '' : v; };
        } else if (f.t === 'select') {
          ctl = document.createElement('select'); var ph = node('option', '— pilih / select —'); ph.value = ''; ctl.appendChild(ph);
          optList(f).forEach(function (o) { ctl.appendChild(mkOption(o)); });
          wrap.appendChild(ctl);
          api.get = function () { return ctl.value; };
          api.set = function (v) {
            var val = v == null ? '' : String(v);
            var hit = optList(f).filter(function (o) { return o.kod === val || o.bm.toLowerCase() === val.toLowerCase(); })[0];
            ctl.value = hit ? hit.kod : '';
          };
        } else if (f.t === 'radio' || f.t === 'multi') {
          ctl = node('div', null, 'opts' + (f.t === 'radio' ? ' inline' : ''));
          var nm = 'f_' + f.k + '_' + Math.random().toString(36).substr(2, 5);
          optList(f).forEach(function (o) { ctl.appendChild(choice(f.t === 'radio' ? 'radio' : 'checkbox', nm, o)); });
          wrap.appendChild(ctl);
          api.get = function () {
            var on = Array.prototype.slice.call(ctl.querySelectorAll('input:checked')).map(function (i) { return i.value; });
            return f.t === 'radio' ? (on[0] || '') : on;
          };
          api.set = function (v) {
            var arr = f.t === 'radio' ? [v] : (v || []);
            Array.prototype.forEach.call(ctl.querySelectorAll('input'), function (i) { i.checked = arr.indexOf(i.value) >= 0; });
          };
        } else if (f.t === 'check') {
          wrap.removeChild(wrap.firstChild);
          var lb = node('label', null, 'opts'); lb.style.flexDirection = 'row'; lb.style.display = 'flex'; lb.style.gap = '8px';
          ctl = document.createElement('input'); ctl.type = 'checkbox'; ctl.style.width = 'auto';
          lb.appendChild(ctl); var tx = node('span', f.bm); if (f.en) { tx.appendChild(node('i', f.en, 'e')); tx.lastChild.style.display = 'block'; } lb.appendChild(tx);
          wrap.appendChild(lb);
          api.get = function () { return ctl.checked; }; api.set = function (v) { ctl.checked = v === true; };
        } else if (f.t === 'file') {
          ctl = document.createElement('input'); ctl.type = 'file'; ctl.accept = f.accept || '.pdf,.jpg,.jpeg,.png';
          var note = node('div', null, 'e'); var st = { file: null };
          ctl.addEventListener('change', function () {
            var fl = ctl.files && ctl.files[0]; st.file = null;
            if (!fl) { note.textContent = ''; return; }
            if (fl.size > 10 * 1024 * 1024) { note.textContent = 'Fail melebihi 10 MB / File exceeds 10 MB'; ctl.value = ''; return; }
            var rd = new FileReader();
            rd.onload = function () { st.file = { nama: fl.name, data: String(rd.result).replace(/^data:[^,]*,/, '') }; note.textContent = fl.name; };
            rd.readAsDataURL(fl);
          });
          wrap.appendChild(ctl); wrap.appendChild(note);
          api.get = function () { return st.file; };
          api.set = function (v) { st.file = null; ctl.value = ''; note.textContent = v ? 'Fail sedia ada akan digunakan jika tiada fail baharu dipilih. / The existing file is kept unless you choose a new one.' : ''; };
        } else if (f.t === 'rep' || f.t === 'list') {
          var box = node('div'); var add = node('button', '+ Tambah / Add', 'btn link'); add.type = 'button';
          function addRow(v) {
            if (f.max && box.children.length >= f.max) return;
            var row = node('div', null, 'rep-row');
            if (f.t === 'list') {
              var i1 = document.createElement('input'); i1.placeholder = f.ph || ''; i1.value = v || ''; i1.autocapitalize = 'characters'; row.appendChild(i1);
            } else {
              var sel = document.createElement('select'); var p0 = node('option', 'Hubungan'); p0.value = ''; sel.appendChild(p0); opts('HUBUNGAN').forEach(function (o) { sel.appendChild(mkOption(o)); });
              var i2 = document.createElement('input'); i2.placeholder = 'Jenis perniagaan'; var i3 = document.createElement('input'); i3.placeholder = 'Tempoh';
              if (v) { sel.value = v.hubungan; i2.value = v.jenis; i3.value = v.tempoh; }
              row.appendChild(sel); row.appendChild(i2); row.appendChild(i3);
            }
            var rm = node('button', '×', 'btn alt sm'); rm.type = 'button'; rm.setAttribute('aria-label', 'Buang / Remove');
            rm.addEventListener('click', function () { box.removeChild(row); toggleAdd(); });
            row.appendChild(rm); box.appendChild(row); toggleAdd();
          }
          function toggleAdd() { add.disabled = !!(f.max && box.children.length >= f.max); }
          add.addEventListener('click', function () { addRow(null); });
          wrap.appendChild(box); wrap.appendChild(add);
          api.get = function () {
            return Array.prototype.map.call(box.children, function (row) {
              var c = row.querySelectorAll('input,select');
              return f.t === 'list' ? c[0].value.trim() : { hubungan: c[0].value, jenis: c[1].value, tempoh: c[2].value };
            }).filter(function (x) { return f.t === 'list' ? x : (x.hubungan || x.jenis || x.tempoh); });
          };
          api.set = function (arr) { box.textContent = ''; (arr || []).forEach(addRow); toggleAdd(); };
          api.addRow = addRow; api.reset = function (max) { f.max = max; toggleAdd(); };
        }
        if (f.hint) wrap.appendChild(node('div', f.hint, 'e'));
        var fe = node('div', null, 'fe'); fe.hidden = true; wrap.appendChild(fe); api.fe = fe;
      }
      if (f.k) wrap.setAttribute('data-k', f.k);
      api.wrap = wrap; api.spec = f;
      fields[f.k || ('_s' + Math.random())] = api;
      root.appendChild(wrap);
    });
    function values() {
      var v = {};
      Object.keys(fields).forEach(function (k) { var x = fields[k].get(); if (x !== undefined) v[k] = x; });
      return v;
    }
    function refresh() {
      var v = values();
      var inSect = null;
      Object.keys(fields).forEach(function (k) {
        var f = fields[k];
        if (f.spec.show) f.wrap.hidden = !f.spec.show(v);
      });
    }
    root.addEventListener('change', refresh);
    root.addEventListener('input', function (e) { if (e.target && e.target.type === 'checkbox') refresh(); });
    return {
      el: root, values: values, refresh: refresh, fields: fields,
      set: function (o) { Object.keys(fields).forEach(function (k) { if (fields[k].set && fields[k].spec.t !== 'sect') fields[k].set(o ? o[k] : undefined); }); refresh(); },
      clear: function () {
        Object.keys(fields).forEach(function (k) { var f = fields[k]; if (f.fe) { f.fe.hidden = true; f.fe.textContent = ''; f.wrap.classList.remove('has-err'); } });
      },
      errors: function (map) {
        this.clear();
        var first = null;
        Object.keys(map || {}).forEach(function (k) {
          var f = fields[k]; if (!f || !f.fe) return;
          f.fe.textContent = map[k]; f.fe.hidden = false; f.wrap.classList.add('has-err'); if (!first) first = f.wrap;
        });
        if (first && first.scrollIntoView) first.scrollIntoView({ block: 'center' });
      }
    };
  }

  // ---------- Muat turun ----------
  function download(nama, mime, b64) {
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: mime || 'application/octet-stream' }));
    var a = document.createElement('a'); a.href = url; a.download = nama; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
  }
  function getFile(id, jenis, btn, out) {
    if (btn) btn.disabled = true;
    UP.api('ssu.fail', { id: id, jenis: jenis }).then(function (r) {
      if (btn) btn.disabled = false;
      if (!r.ok) { if (out) msgErr(out, r); return; }
      download(r.data.nama, r.data.mime, r.data.data);
    });
  }
  function dlBtn(text, en, id, jenis, out) {
    var b = node('button', text, 'btn alt sm'); b.type = 'button'; b.style.marginRight = '6px'; b.style.marginTop = '6px';
    b.appendChild(document.createTextNode(' ')); b.appendChild(node('span', en, 'e'));
    b.addEventListener('click', function () { getFile(id, jenis, b, out); });
    return b;
  }

      card.appendChild(hd);
      card.appendChild(kv([['No. Matrik', p.noMatrik], ['Emel', p.emel], ['Fakulti', p.fakulti], ['Program', p.program], ['Pernah log masuk', p.sudahLogMasuk ? 'Ya / Yes' : 'Belum / Not yet']]));
      var go = function (txt, en, fn) { var b = node('button', txt + ' ', 'btn sm'); b.appendChild(node('span', en, 'e')); b.type = 'button'; b.style.marginTop = '10px'; b.style.marginRight = '6px'; b.addEventListener('click', function () { BAGI = { m: p.noMatrik, nama: p.nama }; fn(); }); return b; };
      var pf = node('div', null, 'sec'); pf.appendChild(node('b', 'Profiling ')); pf.appendChild(pill(d.profil.lengkap ? (d.profil.perluKemasKini ? 'Perlu kemas kini' : 'Lengkap') : 'Belum lengkap', d.profil.lengkap ? (d.profil.perluKemasKini ? 'info' : 'ok') : 'warn'));
      pf.appendChild(document.createElement('br')); pf.appendChild(go('Isi / kemas kini profiling', 'Fill / update profile', openProfiling));
      card.appendChild(pf);
      var st = ssu.perniagaan ? ssu.perniagaan.status : (ssu.permohonan.length ? ssu.permohonan[0].status : 'Belum mohon');
      var sp = node('div', null, 'sec'); sp.appendChild(node('b', 'SSU ')); sp.appendChild(pill(st, PILL[st]));
      sp.appendChild(document.createElement('br')); sp.appendChild(go('Urus SSU', 'Manage SSU', openSsu));
      card.appendChild(sp);
      out.appendChild(card);
    });
  }
  UP.backHooks.push(function () {
    if (!BAGI) return false;
    if (!$('v-profiling').hidden || !$('v-ssu').hidden) { var mat = BAGI.m; BAGI = null; paintBagi(); UP.show('v-bantu'); $('bt-matrik').value = mat; findBantu(); return true; }
    return false;
  });

  // ---------- Dikongsi dengan modul lain ----------
  UP.Form = Form; UP.kv = kv; UP.pill = pill; UP.download = download; UP.loadRuj = loadRuj; UP.opts = opts; UP.PILL = PILL;
  UP.YT = YT; UP.YTM = YTM; UP.TAHUN = TAHUN;
  /** Butang muat turun generik: memanggil kaedah RPC yang memulangkan {nama, mime, data(base64)}. */
  UP.fileBtn = function (bm, en, method, payload, outEl) {
    var b = node('button', bm, 'btn alt sm'); b.type = 'button'; b.style.marginRight = '6px'; b.style.marginTop = '6px';
    b.appendChild(document.createTextNode(' ')); b.appendChild(node('span', en, 'e'));
    b.addEventListener('click', function () {
      b.disabled = true;
      UP.api(method, payload).then(function (r) {
        b.disabled = false;
        if (!r.ok) { if (outEl) { outEl.hidden = false; msgErr(outEl, r); } return; }
        download(r.data.nama, r.data.mime, r.data.data);
      });
    });
    return b;
  };

  // ---------- Menu utama ----------
  function setItem(btn, pillEl, on, text, kind) {
    btn.disabled = !on; btn.classList.toggle('off', !on);
    pillEl.textContent = text; pillEl.className = 'pill ' + (kind || '');
  }
  UP.homeHooks.push(function (s) {
    var pel = s.role === 'Pelajar';
    setItem($('go-profil'), $('pill-profil'), pel, pel ? '…' : 'Pelajar sahaja / Students only');
    setItem($('go-ssu'), $('pill-ssu'), pel, pel ? '…' : 'Pelajar sahaja / Students only');
    if (pel) {
      UP.api('ssu.saya').then(function (r) {
        if (!r.ok) { $('pill-profil').textContent = ''; $('pill-ssu').textContent = ''; return; }
        var d = r.data;
        $('pill-profil').textContent = !d.profil.lengkap ? 'Belum lengkap / Incomplete' : (d.profil.perluKemasKini ? 'Perlu kemas kini / Update due' : 'Lengkap / Complete');
        $('pill-profil').className = 'pill ' + (!d.profil.lengkap ? 'warn' : (d.profil.perluKemasKini ? 'info' : 'ok'));
        var st = d.perniagaan ? d.perniagaan.status : (d.permohonan.length ? d.permohonan[0].status : 'Belum mohon / Not applied');
        $('pill-ssu').textContent = st; $('pill-ssu').className = 'pill ' + (PILL[st] || '');
      });
    }
    BAGI = null; paintBagi();
    $('go-bantu').hidden = ['Admin Penuh', 'Pegawai Modul'].indexOf(s.role) < 0;
    var adm = ['Admin Penuh', 'Pegawai Modul', 'Pemerhati'].indexOf(s.role) >= 0;
    $('go-ssu-admin').hidden = !adm;
    if (adm) UP.api('ssu.admin.senarai', { status: 'Baharu' }).then(function (r) {
      if (r.ok) { $('pill-ssu-admin').textContent = r.data.kiraan.Baharu + ' baharu / new'; $('pill-ssu-admin').className = 'pill ' + (r.data.kiraan.Baharu ? 'warn' : ''); }
    });
  });

  function init() {
    $('go-profil').addEventListener('click', function () { if (!$('go-profil').disabled) openProfiling(); });
    $('go-ssu').addEventListener('click', function () { if (!$('go-ssu').disabled) openSsu(); });
    $('go-ssu-admin').addEventListener('click', function () { openSaList(false); });
    $('go-bantu').addEventListener('click', openBantu);
    $('btn-bt').addEventListener('click', findBantu);
    $('bt-matrik').addEventListener('keydown', function (e) { if (e.key === 'Enter') findBantu(); });
    $('btn-pf').addEventListener('click', saveProfiling);
    $('btn-sf').addEventListener('click', submitSsu);
    $('btn-ssu-balik').addEventListener('click', function () { openSsu(); });
    $('btn-sa-balik').addEventListener('click', function () { openSaList(true); });
    $('btn-sa-sedia').addEventListener('click', openSedia);
    $('btn-sedia-balik').addEventListener('click', function () { openSaList(true); });
    $('btn-sedia').addEventListener('click', submitSedia);
    $('sa-q').addEventListener('input', function () { clearTimeout(SA.timer); SA.timer = setTimeout(function () { SA.q = $('sa-q').value.trim(); loadSaList(); }, 300); });
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
