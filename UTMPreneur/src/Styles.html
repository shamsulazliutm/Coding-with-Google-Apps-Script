<style>
:root{
  --maroon:#8A2D3B; --maroon-d:#6B1F2C; --maroon-l:#F4E7E9; --gold:#D9A02E; --gold-l:#FBF1DA;
  --ink:#2B2023; --muted:#74676B; --line:#E7DFE0; --bg:#F5F2F2; --card:#fff;
  --ok:#2E7D4F; --ok-l:#E3F2E9; --warn:#A8690E; --warn-l:#FCF0D9; --bad:#B3261E; --bad-l:#FBE6E4; --info:#2B5C9A; --info-l:#E4EEF9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;min-height:100vh}
.l{font-weight:600;font-size:13.5px}
.e{font-style:italic;font-weight:400;font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
.bar{background:var(--maroon);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}
.bar img{height:32px;background:#fff;border-radius:4px;padding:2px 5px}
.bar .t{font-weight:700;font-size:16px;line-height:1.15;flex:1}
.bar .t i{display:block;font-weight:400;font-size:10.5px;opacity:.85}
.bar button{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
#banner-uji{background:var(--gold);color:#3A2A05;text-align:center;font-weight:700;font-size:12px;padding:5px 8px;letter-spacing:.04em}
main{padding:16px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
main.wide{max-width:1000px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h1,h2,h3{margin:0}
.h1{font-size:20px;font-weight:700}.h2{font-size:15px;font-weight:700}
.lab{display:block;margin:10px 0 4px}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--maroon);outline-offset:1px;border-color:var(--maroon)}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.btn{display:block;width:100%;text-align:center;border-radius:10px;padding:12px;font:inherit;font-weight:700;font-size:14px;background:var(--maroon);color:#fff;border:0;cursor:pointer;margin-top:12px}
.btn i{display:block;font-weight:400;font-size:10.5px;opacity:.85;font-style:italic}
.btn.alt{background:#fff;color:var(--maroon);border:1.5px solid var(--maroon)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:12px;margin:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#ECE7E8;color:var(--muted)}
.ok{background:var(--ok-l);color:var(--ok)}.warn{background:var(--warn-l);color:var(--warn)}.bad{background:var(--bad-l);color:var(--bad)}.info{background:var(--info-l);color:var(--info)}
.otp{display:flex;gap:8px;justify-content:space-between}
.otp input{text-align:center;font-size:22px;font-weight:700;padding:12px 0}
.msg{border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.msg.err{background:var(--bad-l);color:var(--bad)}.msg.ok{background:var(--ok-l);color:var(--ok)}.msg.info{background:var(--info-l);color:var(--info)}
.msg i{display:block;font-size:11px;opacity:.85}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.menu .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.menu .item:hover{border-color:var(--maroon)}
.menu .item.off{opacity:.55;cursor:not-allowed}
.menu .item:hover.off{border-color:var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
td{padding:8px 10px;border-bottom:1px solid #F0EAEB;vertical-align:top}
.scroll{overflow-x:auto}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.back{background:none;border:0;color:var(--maroon);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:4px}
[hidden]{display:none!important}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--maroon);border-radius:50%;animation:sp 0.9s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
@media (max-width:560px){.en-long{display:none}}
form .sech,.sech{font-weight:700;font-size:13px;color:var(--maroon);border-bottom:2px solid var(--gold);margin:22px 0 4px;padding-bottom:4px}
.fe{color:var(--bad);font-size:12px;margin-top:3px}
.has-err input,.has-err select,.has-err textarea{border-color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.opts input{width:auto;margin-top:3px}
.opts.inline{flex-direction:row;flex-wrap:wrap;gap:14px}
.rep-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.rep-row input,.rep-row select{flex:1;min-width:0}
.btn.link{background:none;color:var(--maroon);padding:6px 0;margin:4px 0 0;text-align:left;font-weight:600;border:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
tr.click{cursor:pointer}tr.click:hover td{background:var(--maroon-l)}
.sec{margin-top:14px}
.big{font-size:17px;font-weight:700}
code{background:#F1ECEC;border-radius:5px;padding:1px 5px;font-size:12px}

/* ---- Rangka baharu: log masuk gaya ASCEND, bar sisi proses, laci telefon ---- */
.hero{background:linear-gradient(90deg,#FBE8ED 0%,#fff 70%);border-top:2px solid #E7D3D9;border-bottom:6px solid #ECE7E8;padding:20px 16px 18px;display:flex;align-items:center;gap:18px;justify-content:center}
.hero img{height:60px}
.hero .kick{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#6c5e62}
.hero h1{margin:2px 0 4px;font-size:30px;font-weight:800;color:#5B0A2A}
.hero .sub{font-size:14px;font-weight:700;color:#1F2A55}
body.auth .bar,body.auth #side{display:none}
body:not(.auth) .hero{display:none}
.login .lcard{max-width:440px;margin:12px auto 0;border-color:#E5CBD3;text-align:left}
.lh{margin:0 0 6px;font-size:20px;color:#5B0A2A;text-align:center}
.lp{margin:0 0 8px;font-size:13px;line-height:1.35;text-align:center}
.otpwrap.off{opacity:.55}
.otp input:disabled{background:#F3EEEF}
.lbtns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.lbtns .btn{margin:0;width:auto;flex:1;padding:10px 12px;font-size:12.5px;background:#5B0A2A}
.lbtns .btn:disabled{background:#BDA8B0;opacity:1}
.lnk{display:block;margin:14px auto 0;background:none;border:0;font:inherit;font-size:12.5px;color:#5B0A2A;text-decoration:underline;cursor:pointer;text-align:center}
@media (max-width:560px){.lbtns{flex-direction:column}.hero{padding:14px;gap:12px;justify-content:flex-start}.hero img{height:44px}.hero h1{font-size:19px}.hero .sub{font-size:11.5px}.hero .kick{font-size:9.5px}}
.bar .burger{font-size:20px;line-height:1;padding:4px 10px;display:none}
#shell{display:flex;align-items:flex-start;min-height:calc(100vh - 56px)}
#shell main{flex:1;min-width:0;width:100%;margin:0 auto}
#side{width:264px;flex:none;background:#fff;border-right:1px solid var(--line);position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;padding:12px 10px 20px;font-size:13.5px}
#side .user{display:flex;gap:10px;align-items:center;padding:6px 6px 4px}
#side .av{width:34px;height:34px;border-radius:50%;background:var(--maroon);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
#side .user b{display:block;font-size:12.5px;line-height:1.2;word-break:break-word}
#side .user span{font-size:11px;color:var(--muted)}
#side .out{background:none;border:0;color:var(--maroon);font:inherit;font-size:11.5px;text-decoration:underline;cursor:pointer;padding:2px 6px 8px}
#side .sec{font-size:10.5px;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:14px 8px 4px}
#side .nav{display:flex;flex-direction:column;gap:2px}
#side .nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
#side .nav button:hover:not(:disabled){background:var(--maroon-l)}
#side .nav button.on{background:var(--maroon-l);color:var(--maroon-d);font-weight:700}
#side .nav button.sub{padding:6px 10px 6px 34px;font-size:12.8px;color:#4a3f42}
#side .nav button.sub.on{background:var(--maroon);color:#fff}
#side .nav button.dim{opacity:.6}
#side .nav button.off{opacity:.55;cursor:not-allowed}
#side .ic{width:16px;text-align:center;color:var(--maroon);flex:none}
#side .tx{flex:1;min-width:0}
#side .ch{margin-left:auto;color:var(--muted);font-size:12px}
#side .bd{background:var(--info-l);color:var(--info);border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 7px}
#side .bd.w{background:var(--warn-l);color:var(--warn)}
#side .soon{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.05em;background:#ECE7E8;color:var(--muted);border-radius:999px;padding:1px 7px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:8}
.kpi-frame{width:100%;height:calc(100vh - 220px);min-height:480px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px}
@media (max-width:900px){
  .bar .burger{display:inline-block}
  .bar .burger[hidden]{display:none}
  #shell{display:block}
  #side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:9;transform:translateX(-102%);transition:transform .18s ease;width:280px;max-width:86vw;box-shadow:2px 0 14px rgba(0,0,0,.18)}
  #side.open{transform:none}
  #side[hidden]{display:none}
  #shell main{padding:12px}
}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
</style>
