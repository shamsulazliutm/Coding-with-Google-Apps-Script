<script>
(function () {
  'use strict';
  var UP = window.UP;
  var $ = function (id) { return document.getElementById(id); };
  var node = UP.node, msg = UP.msg, msgErr = UP.msgErr, clearMsg = UP.clearMsg, busy = UP.busy;
  var BAGI = null; // {m, nama}: admin bertindak bagi pihak pelajar
  var ST = { stu: null, det: null, detId: '' };
  var A = { tab: 'ringkasan', perStatus: 'SEMUA', perQ: '', bilStatus: 'SEMUA', timer: null, back: null };
  var P = { sesi: '', id: '', d: null, tahap: {}, markah: {}, ulasan: {}, timer: null, dirty: false };

  var PK = {
    Baharu: 'info', Disemak: 'info', 'Disenarai Pendek': 'info', Dinilai: 'info', Diluluskan: 'ok', Ditolak: 'bad', Ditawarkan: 'warn', Diterima: 'ok', Perjanjian: 'warn',
    'Sewaan Aktif': 'ok', 'Tawaran Luput': 'bad', 'Ditolak Pemohon': 'bad', Dibatalkan: 'bad', Tamat: '', 'Belum Bayar': 'warn', 'Menunggu Pengesahan': 'info', Dibayar: 'ok',
    Lewat: 'bad', Dikecualikan: '', Dipulangkan: 'ok', Dirampas: 'bad', 'Menunggu salinan bertandatangan': 'warn', 'Dimuat naik': 'info', Disahkan: 'ok', Dikembalikan: 'bad',
    Aktif: 'ok', Pratonton: 'warn', Dihantar: 'info', Rekod: 'ok', Digantikan: '', 'Menunggu Kelulusan': 'warn', Dirancang: 'info', Berjalan: 'warn', Ditutup: 'ok',
    belum: '', draf: 'warn', dihantar: 'ok', Dibuka: 'ok', Kosong: 'ok', Dipohon: 'warn', Disewa: 'info', Penyelenggaraan: 'bad', Ditolak_: 'bad', Dibuang: ''
  };
  var SEBAB = {
    PERLU_SSU: ['Anda perlu mempunyai SSU yang diluluskan untuk memohon lot.', 'You need an approved SSU to apply for a lot.'],
    HANYA_PEMILIK: ['Anda ahli pasukan perniagaan: anda boleh melihat dan memuat turun dokumen sahaja. Hanya pemilik boleh memohon dan bertindak.', 'You are a team member: view and download only.'],
    SSU_TAMAT: ['SSU anda telah tamat tempoh. Sila perbaharui SSU sebelum memohon lot baharu.', 'Your SSU has expired. Please renew it first.'],
    TEMPOH_TUTUP: ['Permohonan lot belum dibuka atau telah ditutup.', 'Lot applications are not open.'],
    SUDAH_ADA_LOT: ['Anda atau ahli pasukan anda sudah mempunyai permohonan atau sewaan lot yang aktif (satu lot bagi satu pelajar).', 'You or a team member already has an active lot application or tenancy.']
  };

  // ---------- Pembantu ----------
  function T(bm, en) { var s = node('span', bm + ' '); if (en) s.appendChild(node('span', en, 'e')); return s; }
  function pill(t, kind) { return UP.pill(t, kind !== undefined ? kind : PK[t]); }
  function spin(el) { el.textContent = ''; el.appendChild(node('div', null, 'spinner')); }
  function card(title, en, cls) {
    var c = node('div', null, 'card' + (cls ? ' ' + cls : ''));
    if (title) { var h = node('div', title + ' ', 'h2'); if (en) h.appendChild(node('span', en, 'e')); c.appendChild(h); }
    return c;
  }
  function btn(bm, en, fn, cls) {
    var b = node('button', bm + ' ', 'btn sm' + (cls ? ' ' + cls : '')); b.type = 'button';
    if (en) b.appendChild(node('span', en, 'e'));
    b.style.marginRight = '6px'; b.style.marginTop = '6px';
    b.addEventListener('click', function () { fn(b); });
    return b;
  }
  /** Butang dua tekan untuk tindakan penting. */
  function btn2(bm, en, fn, cls) {
    var armed = false;
    var b = btn(bm, en, function () {
      if (!armed) { armed = true; b.firstChild.textContent = 'Tekan sekali lagi untuk sahkan '; return; }
      armed = false; b.firstChild.textContent = bm + ' ';
      fn(b);
    }, cls);
    return b;
  }
  function note(kind, bm, en) { var m = node('div', null, 'msg ' + kind); m.appendChild(document.createTextNode(bm)); if (en) m.appendChild(node('i', en)); return m; }
  function msgBox() { var m = node('div', null, 'msg'); m.hidden = true; return m; }
  function rm(v) { var n = parseFloat(v); return isNaN(n) ? '' : 'RM ' + (Math.round(n * 100) % 100 === 0 ? String(Math.round(n)) : n.toFixed(2)); }
  function tbl(heads, rows, click) {
    var sc = node('div', null, 'scroll'); var t = node('table'); var th = node('thead'); var trh = node('tr');
    heads.forEach(function (h) { trh.appendChild(node('th', h)); }); th.appendChild(trh); t.appendChild(th);
    var tb = node('tbody');
    rows.forEach(function (r) {
      var tr = node('tr', null, click ? 'click' : '');
      r.cells.forEach(function (c) { var td = node('td'); if (c && c.nodeType) td.appendChild(c); else td.textContent = c == null ? '' : String(c); tr.appendChild(td); });
      if (click) tr.addEventListener('click', function () { click(r); });
      tb.appendChild(tr);
    });
    t.appendChild(tb); sc.appendChild(t);
    return sc;
  }
  function chips(list, cur, fn) {
    var c = node('div', null, 'chips');
    list.forEach(function (x) {
      var b = node('button', x[1], 'chip' + (cur === x[0] ? ' on' : '')); b.type = 'button'; b.setAttribute('data-v', x[0]);
      b.addEventListener('click', function () { fn(x[0]); }); c.appendChild(b);
    });
    return c;
  }
  var METHOD_BP = {};
  function rn(method, payload) {
    payload = payload || {};
    if (!BAGI || method.indexOf('rn.admin.') === 0) return UP.api(method, payload);
    var q = {}; Object.keys(payload).forEach(function (k) { q[k] = payload[k]; });
    q.noMatrik = BAGI.m;
    return UP.api('rn.bp.' + method.substr(3), q);
  }
  function paintBagi() {
    ['rn-bagi', 'rn-bagi-form', 'rn-bagi-det'].forEach(function (id) {
      var el = $(id); el.hidden = !BAGI;
      el.textContent = BAGI ? 'Bertindak bagi pihak: ' + BAGI.nama + ' (' + BAGI.m + ') / Acting on behalf of the student' : '';
    });
  }
  function bukaTab(f) {
    var bin = atob(f.data), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: f.mime || 'application/pdf' }));
    var w = null;
    try { w = window.open(url, '_blank'); } catch (e) { w = null; }
    if (!w) UP.download(f.nama, f.mime, f.data);
  }
  /** Ambil fail daripada pelayan: loader() memulangkan Promise<{ok,data}>. mode: 'papar' atau 'muat'. */
  function ambil(loader, mode, out, b) {
    if (b) b.disabled = true;
    loader().then(function (r) {
      if (b) b.disabled = false;
      if (!r.ok) { if (out) { out.hidden = false; msgErr(out, r); } return; }
      if (mode === 'papar') bukaTab(r.data); else UP.download(r.data.nama, r.data.mime, r.data.data);
    });
  }
  function fileBtn(bm, en, loader, out) { return btn(bm, en, function (b) { ambil(loader, 'muat', out, b); }, 'alt'); }

  /** Medan fail ringkas. */
  function FileField(accept) {
    var st = { file: null };
    var wrap = node('div'); var inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept || '.pdf,.jpg,.jpeg,.png';
    var nt = node('div', null, 'e');
    inp.addEventListener('change', function () {
      var fl = inp.files && inp.files[0]; st.file = null;
      if (!fl) { nt.textContent = ''; return; }
      if (fl.size > 10 * 1024 * 1024) { nt.textContent = 'Fail melebihi 10 MB / File exceeds 10 MB'; inp.value = ''; return; }
      var rd = new FileReader();
      rd.onload = function () { st.file = { nama: fl.name, data: String(rd.result).replace(/^data:[^,]*,/, '') }; nt.textContent = fl.name; };
      rd.readAsDataURL(fl);
    });
    wrap.appendChild(inp); wrap.appendChild(nt);
    return { el: wrap, get: function () { return st.file; }, input: inp };
  }

  /** Borang ringkas dalam kad: spec -> Form; onSubmit(values) -> Promise<resp>. */
  function formBox(spec, bm, en, onSubmit, initial) {
    var f = UP.Form(spec); var wrap = node('div'); wrap.appendChild(f.el);
    if (initial) f.set(initial);
    var m = msgBox();
    var b = btn(bm, en, function () {
      clearMsg(m); f.clear(); busy(b, true);
      onSubmit(f.values()).then(function (r) {
        busy(b, false);
        if (r && !r.ok) { msgErr(m, r); if (r.error && r.error.extra && r.error.extra.medan) f.errors(r.error.extra.medan); }
      });
    });
    b.className += ' rn-submit';
    wrap.appendChild(m); wrap.appendChild(b);
    return { el: wrap, form: f };
  }

  // jenis medan khas: jadual sewa berperingkat
  UP.formTypes.rnjadual = function (f, wrap, api, h) {
    var box = h.node('div'); var add = h.node('button', '+ Peringkat / Tier', 'btn link'); add.type = 'button';
    function addRow(v) {
      v = v || { dari: '', hingga: '', kadar: '' };
      var row = h.node('div', null, 'rep-row');
      [['dari', 'Dari bulan'], ['hingga', 'Hingga (kosong = seterusnya)'], ['kadar', 'Kadar RM']].forEach(function (x) {
        var i = document.createElement('input'); i.placeholder = x[1]; i.setAttribute('data-j', x[0]); i.value = v[x[0]] == null ? '' : v[x[0]]; row.appendChild(i);
      });
      var rmb = h.node('button', '×', 'btn alt sm'); rmb.type = 'button'; rmb.addEventListener('click', function () { box.removeChild(row); });
      row.appendChild(rmb); box.appendChild(row);
    }
    add.addEventListener('click', function () { addRow(null); });
    wrap.appendChild(box); wrap.appendChild(add);
    api.get = function () {
      return Array.prototype.map.call(box.children, function (row) {
        var o = {}; Array.prototype.forEach.call(row.querySelectorAll('input'), function (i) { o[i.getAttribute('data-j')] = i.value.trim(); }); return o;
      }).filter(function (o) { return o.dari || o.hingga || o.kadar; });
    };
    api.set = function (arr) { box.textContent = ''; (arr && arr.length ? arr : [null]).forEach(addRow); };
  };

  // ======================================================================
  // PELAJAR
  // ======================================================================
  function openRn(notice) {
    if (typeof notice !== 'string') notice = '';
    UP.show('v-rn'); paintBagi();
    var body = $('rn-body'); spin(body);
    Promise.all([UP.loadRuj(), rn('rn.saya')]).then(function (res) {
      var r = res[1]; body.textContent = '';
      if (!r.ok) { var e = node('div', null, 'msg err'); body.appendChild(e); msgErr(e, r); return; }
      var d = ST.stu = r.data;
      if (notice) body.appendChild(note('ok', notice, 'Done'));
      var c1 = card('Tempoh permohonan', 'Application period');
      var tp = d.tempoh;
      var row = node('div', null, 'row');
      row.appendChild(node('span', tp.buka ? tp.buka + '  →  ' + tp.tutup : 'Belum ditetapkan / Not set'));
      row.appendChild(node('span', null, 'sp')); row.appendChild(pill(tp.dibuka ? 'Dibuka' : 'Ditutup', tp.dibuka ? 'ok' : 'bad'));
      c1.appendChild(row);
      if (d.kelayakan.perniagaan) c1.appendChild(node('div', 'Perniagaan: ' + d.kelayakan.perniagaan.nama + ' (' + d.kelayakan.perniagaan.status + ')', 'e'));
      if (d.sebab) { var sb = SEBAB[d.sebab] || [d.sebab, '']; var nn = note('info', sb[0], sb[1]); nn.id = 'rn-sebab'; c1.appendChild(nn); }
      body.appendChild(c1);

      var c2 = card('Lot tersedia', 'Available lots');
      if (!d.lot.length) c2.appendChild(node('p', 'Tiada lot dibuka untuk permohonan buat masa ini.', 'muted'));
      d.lot.forEach(function (l) {
        var el = node('div', null, 'rn-lot'); el.setAttribute('data-lot', l.kod);
        var inf = node('div'); inf.style.flex = '1';
        inf.appendChild(node('b', l.nama));
        inf.appendChild(node('div', [l.lokasi, l.jenisBm, l.saiz ? l.saiz + ' m²' : '', l.kadar ? rm(l.kadar) + ' sebulan' : 'Kadar belum ditetapkan'].filter(Boolean).join(' · '), 'rn-meta'));
        el.appendChild(inf);
        if (d.boleh.mohon) el.appendChild(btn('Mohon', 'Apply', function () { openForm(l.kod); }));
        c2.appendChild(el);
      });
      body.appendChild(c2);

      if (d.permohonan.length) {
        var c3 = card('Permohonan saya', 'My applications');
        d.permohonan.forEach(function (p) { c3.appendChild(perRow(p, true)); });
        body.appendChild(c3);
      }
      if (d.sertaan.length) {
        var c4 = card('Perniagaan yang saya sertai (lihat sahaja)', 'Businesses I belong to (view only)');
        d.sertaan.forEach(function (p) { c4.appendChild(perRow(p, false)); });
        body.appendChild(c4);
      }
    });
  }
  function perRow(p, batal) {
    var el = node('div', null, 'sec'); el.setAttribute('data-id', p.id);
    var h = node('div', null, 'row'); var b = node('b', p.perniagaan + ' · ' + p.namaLot); h.appendChild(b); h.appendChild(node('span', null, 'sp')); h.appendChild(pill(p.status));
    el.appendChild(h);
    el.appendChild(node('div', p.id + ' · dihantar ' + p.tarikhHantar + (p.pemilik ? ' · pemilik: ' + p.pemilik : ''), 'e'));
    if (p.ulasan) el.appendChild(note('info', 'Catatan: ' + p.ulasan, 'Note'));
    var open = btn('Buka', 'Open', function () { openDet(p.id); }); open.setAttribute('data-act', 'buka'); el.appendChild(open);
    if (batal && p.bolehBatal) {
      var bt = btn2('Batalkan permohonan', 'Withdraw', function () {
        rn('rn.mohon.batal', { id: p.id }).then(function (r) { if (!r.ok) { var m = msgBox(); el.appendChild(m); msgErr(m, r); return; } openRn('Permohonan dibatalkan.'); });
      }, 'alt');
      bt.setAttribute('data-act', 'batal'); el.appendChild(bt);
    }
    return el;
  }

  function formSpec(lots) {
    var optLot = lots.map(function (l) { return { kod: l.kod, bm: l.nama + (l.jenisBm ? ' · ' + l.jenisBm : '') + (l.kadar ? ' · ' + rm(l.kadar) : ''), en: '' }; });
    var fnb = function (v) { var l = lots.filter(function (x) { return x.kod === v.kodLot; })[0]; return !!(l && l.fnb); };
    return [
      { t: 'sect', k: '_a', bm: 'Lot dipohon', en: 'Lot applied for' },
      { k: 'kodLot', t: 'select', o: optLot, bm: 'Lot', en: 'Lot', req: 1 },
      { k: 'tempohMula', t: 'date', bm: 'Tempoh sewa dipohon: dari', en: 'Rental period requested: from', req: 1 },
      { k: 'tempohTamat', t: 'date', bm: 'Tempoh sewa dipohon: hingga', en: 'to', req: 1, hint: 'Maksimum 36 bulan. / Maximum 36 months.' },
      { t: 'sect', k: '_b', bm: 'Makanan dan minuman (direkod sahaja, bukan syarat)', en: 'Food and beverage (recorded only, not a condition)', show: fnb },
      { k: 'vaksin', t: 'radio', o: UP.YT, bm: 'Pekerja telah menerima suntikan vaksin kepialu (tifoid)?', en: 'Typhoid vaccination received?', show: fnb },
      { k: 'failVaksin', t: 'file', bm: 'Bukti vaksin (pilihan)', en: 'Proof of vaccination (optional)', show: function (v) { return fnb(v) && v.vaksin === 'Ya'; } },
      { k: 'kursus', t: 'radio', o: UP.YT, bm: 'Telah menghadiri kursus pengendali makanan?', en: 'Food handler course attended?', show: fnb },
      { k: 'failKursus', t: 'file', bm: 'Sijil kursus (pilihan)', en: 'Course certificate (optional)', show: function (v) { return fnb(v) && v.kursus === 'Ya'; } },
      { t: 'sect', k: '_c', bm: 'Kewangan', en: 'Finance' },
      { k: 'sumber', t: 'multi', g: 'SUMBER_PEMBIAYAAN', bm: 'Sumber pembiayaan', en: 'Funding source', req: 1 },
      { k: 'pemberi', t: 'multi', g: 'PEMBERI_DANA', bm: 'Pemberi dana (jika ada)', en: 'Funder (if any)' },
      { k: 'jumlahDana', t: 'text', bm: 'Jumlah dana (RM, nilai tepat)', en: 'Total funds (RM, exact)', req: 1, ph: '5000.00' },
      { k: 'jualan', t: 'text', bm: 'Jangkaan jualan bulanan (RM)', en: 'Expected monthly sales (RM)', req: 1, ph: '8000.00' },
      { k: 'bilPekerja', t: 'number', bm: 'Bilangan pekerja', en: 'Number of staff', req: 1 },
      { t: 'sect', k: '_d', bm: 'Cadangan perniagaan', en: 'Business proposal' },
      { k: 'failCadangan', t: 'file', accept: '.pdf', bm: 'Cadangan perniagaan (PDF, wajib)', en: 'Business proposal (PDF, required)', req: 1 },
      { k: 'sebab', t: 'textarea', bm: 'Sebab berniaga di lot ini', en: 'Why do you want to run a business here?', req: 1, max: 1000 },
      { k: 'lokasi', t: 'text', bm: 'Lokasi dirancang (pilihan)', en: 'Planned location (optional)', max: 300 },
      { t: 'sect', k: '_e', bm: 'Perakuan', en: 'Declaration' },
      BAGI
        ? { k: 'perakuan', t: 'check', bm: 'Saya mengesahkan pelajar telah memberi persetujuan dan maklumat ini benar mengikut dokumen yang diserahkan.', en: 'I confirm the student consented and the information is correct.' }
        : { k: 'perakuan', t: 'check', bm: 'Saya mengesahkan semua maklumat adalah benar dan bersetuju maklumat ini digunakan oleh UTMXCITE untuk penilaian permohonan lot.', en: 'I confirm all information is true and agree UTMXCITE may use it to evaluate my application.' }
    ];
  }

  var FORM = null;
  function openForm(kod) {
    UP.show('v-rn-form'); paintBagi();
    var d = ST.stu; if (!d) { openRn(); return; }
    var box = $('rn-form'); box.textContent = ''; clearMsg($('msg-rn-form'));
    var pc = $('rn-form-pemilik'); pc.textContent = '';
    if (d.kelayakan.perniagaan) pc.appendChild(UP.kv([['Perniagaan', d.kelayakan.perniagaan.nama], ['No. pendaftaran SSU', d.kelayakan.perniagaan.noPendaftaran]]));
    FORM = UP.Form(formSpec(d.lot));
    box.appendChild(FORM.el);
    FORM.set({ kodLot: kod || '', perakuan: false });
  }
  function hantarForm() {
    var m = $('msg-rn-form'); clearMsg(m);
    if (!FORM) return;
    var btnEl = $('btn-rn-hantar'); busy(btnEl, true); FORM.clear();
    rn('rn.mohon.hantar', FORM.values()).then(function (r) {
      busy(btnEl, false);
      if (!r.ok) { msgErr(m, r); if (r.error && r.error.extra && r.error.extra.medan) FORM.errors(r.error.extra.medan); return; }
      openRn('Permohonan dihantar: ' + r.data.id);
    });
  }

  // ---------- Butiran permohonan (pelajar) ----------
  var LANGKAH = ['Diluluskan', 'Ditawarkan', 'Diterima', 'Perjanjian', 'Sewaan Aktif'];
  function openDet(id, notice) {
    ST.detId = id;
    UP.show('v-rn-det'); paintBagi();
    var body = $('rn-det-body'); spin(body);
    rn('rn.butiran', { id: id }).then(function (r) {
      body.textContent = '';
      if (!r.ok) { var e = node('div', null, 'msg err'); body.appendChild(e); msgErr(e, r); return; }
      ST.det = r.data;
      renderDet(r.data, notice);
    });
  }
  function refreshDet(notice) { openDet(ST.detId, typeof notice === 'string' ? notice : ''); }

  function dokRows(list, loaderFor, out) {
    var c = node('div');
    if (!list.length) c.appendChild(node('p', 'Tiada dokumen lagi.', 'muted'));
    list.forEach(function (d, i) {
      var row = node('div', null, 'rn-doc'); row.setAttribute('data-dok', d.id);
      row.appendChild(node('div', 'PDF', 'rn-ic'));
      var nm = node('div', null, 'rn-nm');
      var lnk = node('button', (i + 1) + '. ' + d.tajuk, 'rn-lnk'); lnk.type = 'button'; lnk.setAttribute('data-act', 'papar');
      lnk.addEventListener('click', function () { ambil(loaderFor(d), 'papar', out); });
      nm.appendChild(lnk);
      var sub = [d.versi > 1 || d.jenis === 'Surat Tawaran' || d.jenis === 'Perjanjian' ? 'v' + d.versi : '', d.masa || d.tarikh, d.status && d.status !== 'Aktif' ? d.status : ''].filter(Boolean).join(' · ');
      nm.appendChild(node('div', sub, 'e'));
      if (d.catatan && ['Dikembalikan'].indexOf(d.status) >= 0) nm.appendChild(node('div', 'Catatan: ' + d.catatan, 'e'));
      row.appendChild(nm);
      var act = node('div', null, 'rn-act');
      act.appendChild(btn('Papar', 'View', function (b) { ambil(loaderFor(d), 'papar', out, b); }, 'alt'));
      var dl = btn('Muat turun', 'Download', function (b) { ambil(loaderFor(d), 'muat', out, b); }, 'alt'); dl.setAttribute('data-act', 'muat');
      act.appendChild(dl);
      row.appendChild(act);
      c.appendChild(row);
    });
    return c;
  }

  function renderDet(d, notice) {
    var body = $('rn-det-body'); body.textContent = '';
    var out = msgBox();
    if (notice) body.appendChild(note('ok', notice, 'Done'));
    var head = card();
    var hr = node('div', null, 'row'); hr.appendChild(node('div', (d.lot ? d.lot.nama : d.ringkas.namaLot) + ' · ' + d.ringkas.perniagaan, 'h1')); hr.appendChild(node('span', null, 'sp')); hr.appendChild(pill(d.status));
    head.appendChild(hr);
    head.appendChild(node('div', d.id + ' · tempoh dipohon ' + d.ringkas.tempohMula + ' hingga ' + d.ringkas.tempohTamat, 'e'));
    if (!d.bolehTindak) head.appendChild(note('info', 'Anda ahli pasukan: lihat dan muat turun sahaja. Hanya pemilik boleh bertindak.', 'Team member: view and download only.'));
    body.appendChild(head);

    var idx = LANGKAH.indexOf(d.status);
    if (idx >= 0) {
      var tc = card(); var tl = node('div', null, 'rn-tl');
      [['Diluluskan', 'Approved'], ['Tawaran', 'Offer'], ['Diterima', 'Accepted'], ['Perjanjian', 'Agreement'], ['Sewaan aktif', 'Active']].forEach(function (x, i) {
        var s = node('div', null, i < idx ? 'done' : (i === idx ? 'now' : '')); s.appendChild(node('b', i < idx ? '✓' : String(i + 1))); s.appendChild(document.createTextNode(x[0])); tl.appendChild(s);
      });
      tc.appendChild(tl); body.appendChild(tc);
    } else if (['Baharu', 'Disemak', 'Disenarai Pendek', 'Dinilai'].indexOf(d.status) >= 0) {
      body.appendChild(note('info', 'Permohonan anda sedang disemak dan dinilai oleh jawatankuasa. Anda akan dimaklumkan melalui emel.', 'Your application is being reviewed and evaluated by the committee.'));
    }

      if (hantar) { P.d = r.data; renderSkor($('rn-p-skor-body')); var mm = $('msg-rn-skor'); if (mm) msg(mm, 'ok', 'Skor dihantar dan dikunci.', 'Scores submitted and locked.'); return; }
      var st = $('rn-simpan-status'); if (st) st.textContent = 'Draf disimpan ' + new Date().toLocaleTimeString();
      if (m) msg(m, 'ok', 'Draf disimpan.', 'Draft saved.');
    });
  }

  // ======================================================================
  // Menu utama dan navigasi
  // ======================================================================
  function setItem(btnEl, pillEl, on, text, kind) {
    btnEl.disabled = !on; btnEl.classList.toggle('off', !on);
    pillEl.textContent = text; pillEl.className = 'pill ' + (kind || '');
  }
  UP.homeHooks.push(function (s) {
    var pel = s.role === 'Pelajar';
    BAGI = null;
    setItem($('go-rn'), $('pill-rn'), pel, pel ? '…' : 'Pelajar sahaja / Students only');
    if (pel) {
      UP.api('rn.saya').then(function (r) {
        if (!r.ok) { $('pill-rn').textContent = ''; return; }
        var d = r.data, p = d.permohonan[0];
        var t = p ? p.status : (d.boleh.mohon ? 'Boleh memohon / Open' : (d.sebab === 'TEMPOH_TUTUP' ? 'Ditutup / Closed' : (d.sebab === 'PERLU_SSU' ? 'Perlu SSU / SSU needed' : 'Lihat / View')));
        $('pill-rn').textContent = t; $('pill-rn').className = 'pill ' + (p ? (PK[p.status] || '') : (d.boleh.mohon ? 'ok' : ''));
      });
    }
    var adm = ['Admin Penuh', 'Pegawai Modul', 'Pemerhati'].indexOf(s.role) >= 0, pen = s.role === 'Penilai';
    $('go-rn-admin').hidden = !(adm || pen);
    var lab = $('go-rn-admin').querySelector('.l'); if (lab) lab.textContent = pen ? 'Penilaian ruang niaga' : 'Ruang niaga (admin)';
    if (adm) {
      UP.api('rn.admin.dashboard').then(function (r) {
        if (!r.ok) return;
        var n = r.data.permohonan.baharu + r.data.permohonan.disemak + r.data.cagaran.menungguPengesahan + r.data.bilMenunggu;
        $('pill-rn-admin').textContent = n + ' perlu tindakan / to do'; $('pill-rn-admin').className = 'pill ' + (n ? 'warn' : '');
      });
    } else if (pen) {
      UP.api('rn.nilai.sesi').then(function (r) {
        if (!r.ok) return;
        var n = r.data.sesi.filter(function (x) { return x.status === 'Berjalan'; }).length;
        $('pill-rn-admin').textContent = n + ' sesi berjalan / active'; $('pill-rn-admin').className = 'pill ' + (n ? 'warn' : '');
      });
    }
  });

  UP.backHooks.push(function () {
    if (BAGI && !$('v-rn').hidden) { BAGI = null; paintBagi(); openAdmin(); return true; }
    return false;
  });

  function init() {
    $('go-rn').addEventListener('click', function () { if (!$('go-rn').disabled) openRn(); });
    $('go-rn-admin').addEventListener('click', function () {
      var role = UP.S.session && UP.S.session.role;
      if (role === 'Penilai') openPenilai(); else { A.tab = 'ringkasan'; openAdmin(); }
    });
    $('btn-rn-form-balik').addEventListener('click', function () { openRn(); });
    $('btn-rn-hantar').addEventListener('click', hantarForm);
    $('btn-rn-det-balik').addEventListener('click', function () { openRn(); });
    $('btn-rn-a-det-balik').addEventListener('click', function () { (A.back || function () { openAdmin(); })(); });
    $('btn-rn-p-balik').addEventListener('click', function () { clearTimeout(P.timer); openPenilai(); });
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
