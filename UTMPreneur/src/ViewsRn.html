<!-- ViewsRn: skrin modul Ruang Niaga (pelajar, admin, penilai). Kandungan dinamik dibina oleh AppRn.html -->
<style>
  .rn-bagi{background:var(--gold-l);color:#6B4A05;border:1px solid #EBD59B;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600}
  .rn-card-gold{background:var(--gold-l);border:1px solid #EBD59B;border-radius:12px;padding:12px 14px}
  .rn-lot{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff}
  .rn-lot b{font-size:14px}
  .rn-lot .rn-meta{font-size:12px;color:var(--muted)}
  .rn-tl{display:flex;margin:2px 0 0}
  .rn-tl div{flex:1;text-align:center;font-size:10px;color:var(--muted)}
  .rn-tl b{display:flex;margin:0 auto 3px;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;background:#fff;border:2px solid var(--line);color:var(--muted)}
  .rn-tl .done b{background:var(--ok);border-color:var(--ok);color:#fff}
  .rn-tl .now b{background:var(--maroon);border-color:var(--maroon);color:#fff}
  .rn-doc{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rn-doc:last-child{border-bottom:0}
  .rn-doc .rn-ic{width:34px;height:40px;border-radius:6px;background:var(--bad-l);color:var(--bad);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .rn-doc .rn-nm{flex:1 1 55%;min-width:0}
  .rn-doc .rn-lnk{color:var(--maroon);font-weight:700;font-size:13.5px;text-decoration:underline;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;text-align:left}
  .rn-doc .rn-act{display:flex;gap:6px;flex-wrap:wrap}
  .rn-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .rn-stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
  .rn-stat div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
  .rn-stat b{display:block;font-size:20px}
  .rn-stat span{font-size:11.5px;color:var(--muted)}
  .rn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .rn-row > input,.rn-row > select{flex:1;min-width:120px}
  .rn-sec{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .rn-warn{background:var(--warn-l);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-top:8px}
  /* penilai */
  .rn-k{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fff}
  .rn-k h3{font-size:14px;margin:0 0 2px}
  .rn-k .rn-sub{font-size:12px;color:var(--muted)}
  .rn-skala{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
  .rn-skala button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 2px;font:inherit;font-size:11.5px;cursor:pointer;line-height:1.2}
  .rn-skala button b{display:block;font-size:14px}
  .rn-skala button.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
  .rn-skala button:disabled{opacity:.6;cursor:not-allowed}
  .rn-mk{display:flex;gap:8px;align-items:center;margin-top:8px}
  .rn-mk input{width:90px}
  .rn-chk{display:grid;grid-template-columns:1fr;gap:4px;margin-top:6px;font-size:12.5px}
  .rn-chk label{display:flex;gap:6px;align-items:flex-start}
  .rn-chk input{width:auto;margin-top:3px}
  .rn-total{position:sticky;bottom:0;background:#fff;border-top:3px solid var(--gold);padding:10px 12px;margin:12px -16px -16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:3}
  .rn-total .rn-jml{font-size:22px;font-weight:700;color:var(--maroon)}
  .rn-total .btn{margin:0}
  @media (max-width:560px){.rn-skala button{font-size:10.5px}.rn-doc .rn-act{width:100%}}
</style>

  <!-- Pelajar: Ruang Niaga (utama) -->
  <section id="v-rn" class="view" hidden>
    <div class="msg info rn-bagi" id="rn-bagi" hidden></div>
    <button class="back" data-back type="button">&larr; Kembali <span class="e">Back</span></button>
    <div class="card"><div class="h1">Ruang niaga</div><div class="e">Business premises (Student Mall and SUB)</div></div>
    <div id="rn-body"></div>
  </section>

  <!-- Pelajar: borang permohonan lot -->
  <section id="v-rn-form" class="view" hidden>
    <div class="msg info rn-bagi" id="rn-bagi-form" hidden></div>
    <button class="back" id="btn-rn-form-balik" type="button">&larr; Kembali <span class="e">Back</span></button>
    <div class="card">
      <div class="h1">Permohonan lot</div><div class="e">Lot application</div>
      <div id="rn-form-pemilik" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <div id="rn-form"></div>
      <div id="msg-rn-form" class="msg" hidden></div>
      <button id="btn-rn-hantar" class="btn" type="button">Hantar permohonan <i>Submit application</i></button>
    </div>
  </section>

  <!-- Pelajar: butiran permohonan -->
  <section id="v-rn-det" class="view" hidden>
    <div class="msg info rn-bagi" id="rn-bagi-det" hidden></div>
    <button class="back" id="btn-rn-det-balik" type="button">&larr; Ruang niaga <span class="e">Back</span></button>
    <div id="rn-det-body"></div>
  </section>

  <!-- Admin: hab Ruang Niaga -->
  <section id="v-rn-a" class="view" data-wide hidden>
    <button class="back" data-back type="button">&larr; Kembali <span class="e">Back</span></button>
    <div class="card">
      <div class="h1">Ruang niaga (admin)</div><div class="e">Business premises admin</div>
      <div class="chips" id="rn-a-tabs" style="margin-bottom:0"></div>
    </div>
    <div id="rn-a-body"></div>
  </section>

  <!-- Admin: butiran (permohonan, sesi, sewaan, borang) -->
  <section id="v-rn-a-det" class="view" data-wide hidden>
    <button class="back" id="btn-rn-a-det-balik" type="button">&larr; Senarai <span class="e">List</span></button>
    <div id="rn-a-det-body"></div>
  </section>

  <!-- Penilai: senarai sesi dan calon -->
  <section id="v-rn-p" class="view" hidden>
    <button class="back" data-back type="button">&larr; Kembali <span class="e">Back</span></button>
    <div class="card"><div class="h1">Penilaian permohonan lot</div><div class="e">Lot application evaluation</div></div>
    <div id="rn-p-body"></div>
  </section>

  <!-- Penilai: skrin skor -->
  <section id="v-rn-p-skor" class="view" data-wide hidden>
    <button class="back" id="btn-rn-p-balik" type="button">&larr; Senarai calon <span class="e">Candidates</span></button>
    <div id="rn-p-skor-body"></div>
  </section>
