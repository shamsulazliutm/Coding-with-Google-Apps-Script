  window.__BUILD = 'b5';
  window.addEventListener('error', function (ev) {
    var a = document.getElementById('app'); if (!a || a.textContent.indexOf('Memuatkan') < 0 && a.textContent.indexOf('Ralat memuatkan') < 0) return;
    var t = (ev && ev.target && ev.target.src) ? 'Gagal memuat sumber: ' + ev.target.src : ((ev && ev.message) || 'ralat tidak diketahui') + (ev && ev.lineno ? ' (baris ' + ev.lineno + ')' : '');
    a.innerHTML = '<div class="err"><b>Ralat memuatkan halaman [' + window.__BUILD + ']</b><br>' + String(t).replace(/</g, '&lt;') + '</div>';
  }, true);

  <style>
/* Tema UTMPreneur: maroon + emas, menu sisi untuk admin, skrin penuh untuk panel */
:root{
  --bg:#f6f2f2; --surface:#ffffff; --fg:#221a1c; --muted:#6f6266; --line:#e6dcdd;
  --maroon:#8a2d3b; --maroon-soft:#f3e3e5; --gold:#d9a02b; --gold-soft:#fbf1da;
  --ok:#1f7a4d; --ok-soft:#dff2e8; --warn:#9a6a08; --warn-soft:#fbefd0; --bad:#b3261e; --bad-soft:#fbe2e0; --info:#1f5fa0; --info-soft:#e0ecf8;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171213; --surface:#231b1d; --fg:#f2e9ea; --muted:#a89a9d; --line:#3a2e30;
  --maroon:#d0707f; --maroon-soft:#3a2328; --gold:#e3b04a; --gold-soft:#3a3020;
  --ok:#5fd09a; --ok-soft:#1c3328; --warn:#e8b94f; --warn-soft:#3a3018; --bad:#f08a82; --bad-soft:#402220; --info:#7db4ec; --info-soft:#1e2d40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171213; --surface:#231b1d; --fg:#f2e9ea; --muted:#a89a9d; --line:#3a2e30;
  --maroon:#d0707f; --maroon-soft:#3a2328; --gold:#e3b04a; --gold-soft:#3a3020;
  --ok:#5fd09a; --ok-soft:#1c3328; --warn:#e8b94f; --warn-soft:#3a3018; --bad:#f08a82; --bad-soft:#402220; --info:#7db4ec; --info-soft:#1e2d40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn-solid{background:#8a2d3b;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-solid{background:#a8404f}}
:root[data-theme="dark"] .btn-solid{background:#a8404f}
.btn-line{background:var(--surface);border:1.5px solid var(--maroon);color:var(--maroon);border-radius:8px;padding:9px 14px;font-weight:600}
.btn-ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--muted)}
.btn-solid[disabled]{opacity:.45;cursor:not-allowed}

/* header */
.top{background:var(--surface);border-bottom:3px solid var(--gold);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.logo{display:flex;align-items:center;gap:8px}
.logo .utm{background:#8a2d3b;color:#fff;font-weight:700;font-size:15px;padding:8px 9px 6px;border-radius:3px;letter-spacing:.04em;line-height:1;display:flex;flex-direction:column;align-items:center}
.logo .utm small{font-size:5px;letter-spacing:.02em;margin-top:2px;font-weight:600}
.logo .xc{font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--maroon)}
.logo .xc b{color:var(--gold)}
.brand{min-width:0}
.brand h1{margin:0;font-size:18px;color:var(--maroon);line-height:1.2}
.brand p{margin:0;font-size:12.5px;color:var(--muted);font-style:italic}
.who{margin-left:auto;text-align:right;min-width:0}
.who b{display:block;font-size:14px}
.who span{font-size:12px;color:var(--muted);font-style:italic}
.roleswitch{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--bg)}
.roleswitch button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.roleswitch button[aria-pressed="true"]{background:#8a2d3b;color:#fff}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:70vh}
nav.side{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
nav.side button{text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
nav.side button[aria-current="page"]{background:var(--maroon-soft);color:var(--maroon);font-weight:700}
nav.side .n{font-size:12px;background:var(--gold-soft);color:var(--warn);border-radius:999px;padding:1px 8px;font-weight:700}
main{padding:24px max(16px,env(safe-area-inset-right,0px)) 48px 24px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h2{margin:0;font-size:26px;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--muted);font-style:italic;font-size:13.5px}
.demo{background:var(--gold-soft);color:var(--warn);font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px}

/* cards, tables, pills */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:16px}
.card h3 i{font-weight:400;color:var(--muted);font-size:13px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:32px;font-weight:700;line-height:1.15;margin:2px 0}
.stat .s{font-size:12.5px;color:var(--muted);font-style:italic}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--maroon-soft)}
td small{display:block;color:var(--muted);font-size:12.5px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.prog{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select,.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.f label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.f .wide{grid-column:1/-1}
.note{font-size:13px;color:var(--muted);font-style:italic}
.detail{margin-top:14px;border-color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px}
button.chip:hover{border-color:var(--maroon);color:var(--maroon)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rubrow{display:grid;grid-template-columns:34px minmax(0,1.5fr) 80px minmax(0,2fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.rubrow .no{font-weight:700;color:var(--maroon)}
.rubrow i{display:block;color:var(--muted);font-size:13px}
.rubrow input{width:70px;text-align:right}
.anch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.anch div{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px}
.anch b{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--maroon);margin-bottom:2px}

/* panel / penilai */
.eval{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:20px;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.cal{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cal .tag{background:var(--info-soft);color:var(--info);font-weight:700;border-radius:999px;padding:3px 12px;font-size:13px}
.eval h2{margin:6px 0 2px;font-size:24px;text-transform:uppercase;letter-spacing:.01em}
.kv{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.stud+.stud{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.openplan{display:block;text-align:center;border:1.5px solid var(--maroon);color:var(--maroon);background:var(--surface);border-radius:10px;padding:12px;text-decoration:none;font-weight:700;margin-top:12px}
.openplan small{display:block;font-weight:400;font-style:italic;color:var(--muted)}
.crit{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(0,2.4fr) 96px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.crit h4{margin:0;font-size:16px;display:flex;gap:6px;align-items:center}
.crit h4 button{border:1px solid var(--line);background:var(--bg);border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1;color:var(--muted)}
.crit small{color:var(--muted);font-style:italic;font-size:12.5px}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 0;font-weight:700;font-size:16px}
.lv button[aria-pressed="true"]{background:#8a2d3b;color:#fff;border-color:#8a2d3b}
.mk{display:flex;align-items:center;justify-content:flex-end;gap:4px;background:var(--maroon-soft);color:var(--maroon);border:1px solid var(--maroon);border-radius:8px;padding:4px 8px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.mk input{width:38px;text-align:right;border:0;background:transparent;font-weight:700;font-size:17px;color:var(--maroon);padding:2px}
.anchbox{grid-column:1/-1;background:var(--bg);border-radius:8px;padding:10px;display:none}
.anchbox.on{display:block}
.els{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.els label{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.foot{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px}
.total{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 18px}
.total small{display:block;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.total b{font-size:34px;line-height:1.1;color:var(--maroon)}.total span{color:var(--muted);font-size:18px}
.spacer{flex:1}
.layak{display:flex;gap:16px;align-items:center;margin:12px 0;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:20}
.lock{background:var(--ok-soft);color:var(--ok);padding:8px 12px;border-radius:8px;font-weight:600;margin-bottom:10px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  nav.side button{white-space:nowrap}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .two,.eval{grid-template-columns:1fr}
  .crit{grid-template-columns:1fr 96px}.crit .lv{grid-column:1/-1;order:3}
  .rubrow{grid-template-columns:28px minmax(0,1fr) 70px}.rubrow .sub{grid-column:2/-1}
  .who{margin-left:0;text-align:left}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

.logoimg{height:42px;max-width:100%;background:#fff;border-radius:6px;padding:2px 8px}
.err{max-width:560px;margin:60px auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hidden-in-panel{display:none}
.login{max-width:430px;margin:56px auto;padding:24px}
.login h2{margin:0 0 4px}
.otp{font-size:30px;letter-spacing:.3em;text-align:center;font-weight:700;width:100%}
.login .foot{margin-top:14px}
.login .btn-solid{flex:1}

/* ---- Skrin penilai: padat dan mesra (susun atur rujukan) ---- */
.eval{grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:24px;align-items:start}
.eval aside.left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);display:flex;flex-direction:column;max-height:calc(100vh - 110px);overflow-y:auto;padding-right:2px}
.eval aside.left .navrow{margin-top:auto;position:sticky;bottom:0;background:var(--bg);padding:14px 0 4px;display:flex;justify-content:space-between;gap:10px}
.eval aside.left .navrow button{padding:12px 16px}
.eval .sub-note{font-style:italic;color:var(--muted);font-size:13.5px;margin:0 0 12px}
.eval .info{padding:14px 16px}
.crit{grid-template-columns:minmax(200px,1.3fr) minmax(0,3fr) 112px;gap:16px;padding:14px 18px;margin-bottom:12px}
.crit .ct{min-width:0}
.crit h4{font-size:17px}
.crit h4 button{width:26px;height:26px;font-size:13px}
.lv{gap:8px}
.lv button{padding:0;height:52px;font-size:19px;border-radius:10px}
.lv button:hover:not([disabled]):not([aria-pressed="true"]){border-color:var(--maroon);color:var(--maroon)}
.mk{justify-content:center;font-size:20px;padding:8px 10px;border-radius:10px}
.mk{white-space:nowrap}
.mk input{width:42px;font-size:20px;text-align:right}
.elsum{display:inline-block;margin-top:4px;border:0;background:none;padding:0;font-size:12.5px;color:var(--muted);font-style:italic;text-align:left}
.elsum b{letter-spacing:.12em;font-style:normal;color:var(--maroon)}
.crit .more{grid-column:1/-1;display:none;gap:10px;flex-direction:column}
.crit .more.on{display:flex}
.notebtn{display:inline-block;margin-top:6px;border:0;background:none;padding:2px 0;color:var(--maroon);font-weight:600;font-size:13px}
.notebtn.has{color:var(--ok)}
.crit textarea,.cmt textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:vertical}
.cmt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.cmt h4{margin:0 0 8px;font-size:15px}
.cmt h4 small{font-weight:400;color:var(--muted);font-style:italic}
.legend{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 14px}
.bar-b{position:sticky;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:6px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar-b .total b{font-size:36px}
.bar-b .state{font-size:13.5px;color:var(--muted);font-style:italic}
.bar-b .state.ready{color:var(--ok);font-style:normal;font-weight:600}
.bar-b .btn-solid{padding:14px 22px;font-size:16px}
.bar-b .btn-solid small{display:block;font-weight:400;font-size:11.5px;opacity:.9}
.notes-list{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px}
.notes-list b{color:var(--maroon)}
@media (max-width:860px){
  .eval{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}
  .top{position:static;gap:8px 12px;padding-top:8px;padding-bottom:8px}
  .logoimg{height:34px}
  .brand p{display:none}.brand h1{font-size:16px}
  .who{margin-left:auto}.who b{font-size:13px}
  #out{padding:6px 10px;font-size:13px}
  .eval aside.left{position:static;max-height:none;overflow:visible}
  .eval aside.left .navrow{position:static;padding-top:12px}
  .crit{grid-template-columns:1fr 104px}.crit .lv{grid-column:1/-1;order:3}.crit .mk{order:2}
  .lv button{height:48px}
  .bar-b{gap:10px 12px}.bar-b .spacer{display:none}
  .bar-b .btn-solid,.bar-b .btn-line{flex:1 1 45%;padding:13px 10px}
  .mk input{width:34px}
}
.asbar{background:var(--gold-soft);color:var(--fg);border-bottom:2px solid var(--gold);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.lg{max-width:520px;text-align:center;padding:28px 32px}
.lg h2{text-align:center;font-size:26px;color:var(--maroon);margin:0 0 6px}
.lg .lgnote{margin:0 0 18px;color:var(--fg);font-size:15px}
.lg .lgl{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
.lg input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:16px;text-align:left}
.lg input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.lg .lgbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.lg .lgbtns .btn-solid{padding:12px 12px;font-size:14.5px;white-space:nowrap}
.lg .lgmsg{min-height:1.4em;margin:14px 0 0;font-size:14px}
.lg .lgsmall{margin:8px 0 0;font-size:12.5px;color:var(--muted);font-style:italic}
.rp{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:18px;align-items:start}
.rp .ctl label.opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
.rp .ctl label.opt:has(input:checked){border-color:var(--maroon);background:var(--maroon-soft)}
.rp .ctl label.opt b{display:block;font-size:14px}.rp .ctl label.opt small{color:var(--muted);font-size:12.5px;line-height:1.35}
.rp .ctl .f{grid-template-columns:1fr;gap:10px;margin:10px 0}
.paper{background:#fff;color:#222;border:1px solid #ddd;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:18px 22px;overflow-x:auto;font-size:12.5px}
.paper .ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid #d9a02b;padding-bottom:8px;margin-bottom:12px;box-shadow:0 2px 0 -1px #8a2d3b}
.paper .ph img{height:42px}
.paper .ph div{text-align:right}.paper .ph b{color:#8a2d3b;font-size:15px;display:block}.paper .ph span{color:#6f6266;font-size:11.5px}
.paper h4{margin:12px 0 6px;font-size:14px;color:#222}
.paper table{font-size:12px;min-width:640px}.paper th{background:#8a2d3b;color:#fff;font-size:10.5px;padding:6px 8px;text-align:center}
.paper td{padding:6px 8px;border:1px solid #e3d8d9;color:#222}.paper td small{color:#6f6266}
.paper .tot td{background:#f6eeee;font-weight:700}
.paper .sign{display:flex;gap:40px;margin-top:22px}.paper .sign div{flex:1;border-top:1px solid #999;padding-top:4px;color:#555;font-size:11.5px;margin-top:34px}
@media (max-width:860px){.rp{grid-template-columns:1fr}}
.apply{max-width:820px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.apply .head h2{font-size:24px;color:var(--maroon)}
.apsec{margin-bottom:14px;padding:18px 20px}
.apsec h3{display:flex;align-items:center;gap:10px;font-size:17px;margin:0 0 12px}
.apn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#8a2d3b;color:#fff;font-size:13px;font-weight:700}
.aptype{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px}
.aptype label.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);margin:0}
.aptype label.opt:has(input:checked){border-color:var(--maroon);background:var(--maroon-soft)}
.aptype label.opt b{display:block}.aptype label.opt small{color:var(--muted);font-size:12.5px}
.apst{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--bg)}
.apsth{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.aptop{display:flex;justify-content:flex-end;margin-bottom:10px}
.apban{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-align:center;margin-bottom:12px}
.apban img{height:78px;max-width:100%}
.apban .org{font-weight:700;font-size:14.5px;color:#3a3a3a;margin-top:6px;text-wrap:balance}
.apban .ttl{display:block;margin:10px auto 0;max-width:520px;border-top:3px solid #b8860b;border-bottom:3px solid #b8860b;padding:5px 0;font-weight:800;font-size:clamp(18px,4vw,26px);letter-spacing:.03em;color:#b8860b}
.dfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 16px}.dfk{display:grid;gap:2px;font-size:12.5px;color:var(--muted)}.dfk b{color:var(--fg);font-weight:600;font-size:14px;overflow-wrap:anywhere}
.apinst{font-size:14px;line-height:1.55}.apinst p{margin:0 0 10px}.apinst address{font-style:normal}
.apreq{font-size:12.5px;color:#c0392b;margin:0}
.apcond{border-left:3px solid var(--gold);padding-left:14px;margin-top:12px}
.fld{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.apdrop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:10px;padding:14px;position:relative}
.apack{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}.apack input{margin-top:4px;width:18px;height:18px}
.aptpl{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.aptpl small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.aptpl .btn-solid{text-decoration:none;display:inline-block}
.apmsg{min-height:1.3em;margin:12px 0 0;color:var(--bad);font-weight:600;font-size:14px}
.apdone{text-align:center;padding:34px 24px}
.apok{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.apref{display:inline-block;font-size:30px;font-weight:700;letter-spacing:.12em;color:var(--maroon);border:2px solid var(--gold);border-radius:10px;padding:8px 22px;font-variant-numeric:tabular-nums}
.sesisel{display:grid;gap:4px;padding:6px 8px 12px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sesisel select{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:600}
nav.side .n{white-space:nowrap}
.asgn select{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
</style>
</head>

<div id="app"><div class="err">Memuatkan…</div></div>
<script>
/* Klien: semua data datang daripada pelayan (Code.gs). Tapisan akses dibuat di pelayan. */
const $ = s => document.querySelector(s), app = $('#app');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PUBLIC = { apiRequestOtp: 1, apiVerifyOtp: 1, apiLogin: 1, apiSubmitApplication: 1, apiPublicInfo: 1 };
let TOKEN = '';
try { TOKEN = localStorage.getItem('utm_tok') || ''; } catch (e) { try { TOKEN = sessionStorage.getItem('utm_tok') || ''; } catch (e2) { } }
function setTok(t) { TOKEN = t || ''; [() => localStorage, () => sessionStorage].forEach(f => { try { t ? f().setItem('utm_tok', t) : f().removeItem('utm_tok'); } catch (e) { } }); }
const rpc = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => {
  const m = e && e.message ? e.message.replace(/^(Exception|Error): /, '') : String(e);
  if (m.indexOf('SESI_TAMAT') >= 0) { setTok(''); showLogin('Sesi tamat. Sila log masuk semula.'); return; }
  no(new Error(m));
})[fn](...(PUBLIC[fn] ? a : [TOKEN, ...a])));
let B = null, D = null;

function toast(t, bad) {
  const e = document.createElement('div'); e.className = 'toast'; e.textContent = t;
  if (bad) e.style.background = 'var(--bad)', e.style.color = '#fff';
  document.body.append(e); setTimeout(() => e.remove(), bad ? 3600 : 1800);
}
const typePill = t => `<span class="pill ${t === 'SUB' ? 'p-info' : 'p-mute'}">${esc(t)}</span>`;
const short = n => String(n).replace(/^(Dr\.|En\.|Pn\.|PM\. Dr\.|PM\.) /, '').split(' ').slice(0, 2).join(' ');

/* ---------- log masuk OTP ---------- */
function loginHead(msg) {
  $('#whoN').textContent = ''; $('#whoR').textContent = ''; $('#out').hidden = true; $('#sub').textContent = 'Penilaian permohonan Student Mall & SUB';
  return msg ? `<div class="lock" style="background:var(--warn-soft);color:var(--warn)">${esc(msg)}</div>` : '';
}
/* Satu skrin: e-mel + kod OTP, dua butang */
let cdTimer = null;
function showLogin(msg, em) {
  clearInterval(cdTimer);
  app.innerHTML = `<div class="login card lg"><h2>Log Masuk</h2>
   <p class="lgnote">Masukkan e-mel berdaftar anda. Kod pengesahan enam digit akan dihantar melalui e-mel.</p>
   ${loginHead(msg)}
   <label class="lgl" for="l_e">E-mel berdaftar</label>
   <input id="l_e" type="email" autocomplete="email" value="${esc(em || '')}" placeholder="nama@utm.my">
   <label class="lgl" for="l_c">Kod OTP</label>
   <input id="l_c" inputmode="numeric" maxlength="9" autocomplete="one-time-code" placeholder="Masukkan kod 6 digit">
   <div class="lgbtns"><button class="btn-solid" id="l_send">Hantar / Hantar Semula Kod</button><button class="btn-solid" id="l_ok">Sahkan dan Log Masuk</button></div>
   <p class="lgmsg" id="l_msg" role="status" aria-live="polite"></p>
   <p class="lgsmall">Tiada akaun Google atau Gmail diperlukan. Ada kod 8 digit daripada admin? Kosongkan e-mel dan masukkan kod itu pada ruang Kod OTP.</p>
   <p class="lgsmall" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-style:normal">Pelajar yang mahu memohon lot? <button class="elsum" id="l_apply" style="color:var(--maroon);font-weight:700;font-style:normal">Isi borang permohonan</button></p></div>`;
  $('#l_apply').onclick = () => showApply();
  const E = $('#l_e'), C = $('#l_c'), S = $('#l_send'), O = $('#l_ok'), M = $('#l_msg');
  const say = (t, bad) => { M.textContent = t; M.style.color = bad ? 'var(--bad)' : 'var(--ok)'; };
  const cooldown = () => { let left = 60; S.disabled = true; clearInterval(cdTimer); cdTimer = setInterval(() => { if (!S.isConnected) return clearInterval(cdTimer); left--; if (left <= 0) { clearInterval(cdTimer); S.disabled = false; S.textContent = 'Hantar / Hantar Semula Kod'; } else S.textContent = 'Hantar semula (' + left + 's)'; }, 1000); S.textContent = 'Hantar semula (60s)'; };
  C.oninput = () => { C.value = C.value.replace(/[^\d ]/g, ''); };
  S.onclick = async () => {
    const e = E.value.trim().toLowerCase(); if (!e) { say('Masukkan e-mel berdaftar anda.', true); return E.focus(); }
    S.disabled = true; S.textContent = 'Menghantar…'; say('');
    try { await rpc('apiRequestOtp', e); say('Jika e-mel itu berdaftar, kod 6 digit telah dihantar. Semak peti masuk dan folder spam. Kod sah 10 minit.'); cooldown(); C.focus(); }
    catch (x) { say(x.message, true); S.disabled = false; S.textContent = 'Hantar / Hantar Semula Kod'; }
  };
  const verify = async () => {
    const e = E.value.trim().toLowerCase(), c = C.value.replace(/\D/g, '');
    if (!c) { say('Masukkan kod OTP.', true); return C.focus(); }
    if (!e && c.length !== 8) { say('Masukkan e-mel berdaftar anda, atau kod 8 digit daripada admin.', true); return E.focus(); }
    if (e && c.length !== 6) { say('Kod OTP mesti 6 digit.', true); return C.focus(); }
    O.disabled = true; O.textContent = 'Menyemak…'; say('');
    try { const r = e ? await rpc('apiVerifyOtp', e, c) : await rpc('apiLogin', c); setTok(r.token); clearInterval(cdTimer); await start(); }
    catch (x) { say(x.message, true); O.disabled = false; O.textContent = 'Sahkan dan Log Masuk'; C.select(); }
  };
  O.onclick = verify;
  E.onkeydown = ev => { if (ev.key === 'Enter') S.click(); };
  C.onkeydown = ev => { if (ev.key === 'Enter') verify(); };
  (em ? C : E).focus();
}
$('#out').onclick = async () => { try { await rpc('apiLogout'); } catch (e) { } setTok(''); codes = null; showLogin(); };

/* Halaman pertama tanpa log masuk: borang pelajar (pautan utama). Skrin log masuk melalui butang pada borang atau ?page=login. */
function showCrash(e) {
  app.innerHTML = `<div class="err"><h2>Ralat memuatkan halaman</h2><p>${esc((e && e.message) || String(e))}</p><p class="note">Muat semula halaman. Jika berulang, hantar mesej ralat ini kepada urusetia.</p></div>`;
}
function gotoEntry() {
  let done = false;
  const go = loc => {
    if (done) return; done = true;
    try { (loc && loc.parameter && loc.parameter.page === 'login') ? showLogin() : showApply(); } catch (e) { showCrash(e); }
  };
  try {
    if (google.script.url && google.script.url.getLocation) { google.script.url.getLocation(go); setTimeout(() => go(null), 2500); return; }   // tanpa jawapan dalam 2.5s: papar borang
  } catch (e) { }
  go(null);
}
async function start() {
  if (!TOKEN) return gotoEntry();
  try {
    B = await rpc('apiBoot');
    if (B.me.role === 'none') { setTok(''); return showLogin('Sesi tamat atau akaun tidak aktif. Sila log masuk semula.'); }
    if (B.logo) $('#logo').innerHTML = `<img class="logoimg" src="${esc(B.logo)}" alt="UTM UTMXCITE">`;
    $('#whoN').textContent = B.me.name || B.me.email; $('#out').hidden = false;
    if (B.me.role === 'admin') { $('#whoR').textContent = 'Admin Penuh / Full Admin'; await loadAdmin(); }
    else { $('#whoR').textContent = 'Penilai / Evaluator'; $('#sub').textContent = 'Sesi penilaian permohonan Student Mall & SUB'; await loadPanel(); }
  } catch (e) { app.innerHTML = `<div class="err"><h2>Ralat</h2><p>${esc(e.message)}</p></div>`; }
}

/* ===================== BORANG PERMOHONAN PELAJAR (awam) ===================== */
let APP = null, PUBINFO = null;   // PUBINFO.templateUrl dibaca daripada Tetapan!B15
const FAK = ['FKE', 'FKA', 'FKM', 'FKT', 'FC', 'FS', 'FM', 'FAB', 'FP', 'FSSH', 'FEST'];
const newStudent = () => ({ n: '', m: '', kp: '', yr: '', fac: '', course: '', cgpa: '', email: '', tel: '', sex: '', nat: 'Malaysia', bid: '', utm: 'Ya', kol: '', rmh: '', docM: null, docK: null });
const KINDS = ['Makanan & Minuman (F&B)', 'Runcit / Barangan', 'Perkhidmatan', 'Digital / Teknologi', 'Lain-lain'];
const newApp = () => ({ type: 'Student Mall', lot: '', biz: '', kind: '', ssm: '', ssmStatus: 'Berdaftar', ssmPlan: '', ssmInfo: '', mula: '', produk: '', alamat: '', pekerja: '', lokasi: '', sebab: '',
  tifoid: '', kursus: '', sumber: '', pembiaya: '', jumlah: '', jualan: '', docs: {}, st: [newStudent()], mode: 'file', planUrl: '', file: null, ack: false, website: '' });
const MAXDOC = 5 * 1024 * 1024;
const isFB = k => /^makanan/i.test(k || '');
const MAXPLAN = 8 * 1024 * 1024;

function applyCollect() {
  const A = APP;
  document.querySelectorAll('[data-f]').forEach(i => A[i.dataset.f] = i.type === 'checkbox' ? i.checked : i.value);
  document.querySelectorAll('[data-s]').forEach(i => A.st[+i.dataset.s][i.dataset.k] = i.value);

let RP = { type: 'ringkasan', jenis: '', notes: true, pid: 0 };
const MAROON = [138, 45, 59], GOLD = [217, 160, 43], GREY = [110, 98, 102];
const nem = x => String(x == null ? '' : x).trim().toLowerCase();
const fmt = (n, d = 2) => n == null ? '-' : Number(n).toFixed(d);
const maskKp = kp => String(kp || '').replace(/\d{4}$/, '****');

function rpData(jenis = RP.jenis) {
  const K = D.keputusan;
  // Laporan hanya memaparkan panel yang telah memberi markah (penilaian dihantar). Panel dinomborkan semula P1, P2, ... tanpa jurang.
  let idx = K.panels.map((p, i) => i).filter(i => D.nilai.some(n => n.status === 'Dihantar' && nem(n.email) === nem(K.panels[i].emel)));
  if (!idx.length) idx = K.panels.map((p, i) => i);
  const P = idx.map(i => K.panels[i]);
  const rows = D.apps.filter(a => !jenis || a.type === jenis).map(a => {
    const kr = K.rows.find(r => r.id === a.id) || {};
    const evs = P.map(p => D.nilai.find(n => n.pid === a.id && nem(n.email) === nem(p.emel) && n.status === 'Dihantar') || null);
    const got = evs.filter(Boolean);
    return {
      a, evs, n: got.length, avg: kr.avg == null ? null : kr.avg, sc: idx.map(i => (kr.sc || [])[i] == null ? null : kr.sc[i]),
      avgC: D.crit.map((c, i) => got.length ? got.reduce((s, n) => s + n.mk[i], 0) / got.length : null),
      layakY: got.filter(n => n.ok === 'Ya').length, layakN: got.filter(n => n.ok === 'Tidak').length, final: a.final || 'Belum'
    };
  });
  const ranked = rows.filter(r => r.avg != null).sort((x, y) => y.avg - x.avg), rk = new Map();
  ranked.forEach((r, i) => rk.set(r.a.id, i > 0 && Math.abs(ranked[i - 1].avg - r.avg) < 1e-9 ? rk.get(ranked[i - 1].a.id) : i + 1));
  rows.forEach(r => r.rank = rk.get(r.a.id) || null);
  rows.sort((x, y) => (x.rank || 999) - (y.rank || 999) || x.a.id - y.a.id);
  return { rows, P, ranked: ranked.length };
}
const firstName = n => { const w = String(n).replace(/\b(Dr|PM|En|Pn|Prof|Ts|Ir|Puan|Encik)\.?\s+/gi, '').trim().split(/\s+/); return w[0] || n; };
const panelLbl = (p, i) => 'P' + (i + 1) + ' ' + firstName(p.nama);
const panelFull = (p, i) => 'P' + (i + 1) + ' ' + p.nama;

let LOGO_JPG = null;
function logoJpeg(img) {   // JPEG kecil (latar putih) supaya fail PDF tidak besar
  if (!LOGO_JPG) { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0); LOGO_JPG = c.toDataURL('image/jpeg', 0.92); }
  return LOGO_JPG;
}

function buildPdf() {
  const jsPDF = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDF) throw new Error('Pustaka PDF belum dimuat. Semak sambungan internet, muat semula halaman dan cuba lagi.');
  if (RP.type === 'jawatankuasa') {
    const d = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    centerHeads(d);
    renderBlocksPdf(d, jkBlocks());
    decorate(d, { title: 'LAPORAN JAWATANKUASA JPPPDKP UTM', sub: 'Universiti Teknologi Malaysia | UTMXCITE | Bil ' + (D.sesi.bil || 'xx') });
    return d;
  }
  const { rows, P, ranked } = rpData();
  if (!rows.length) throw new Error('Tiada permohonan untuk dilaporkan.');
  const detailRows = RP.pid ? rows.filter(r => r.a.id === RP.pid) : rows;
  const doc = new jsPDF({ orientation: RP.type === 'terperinci' ? 'portrait' : 'landscape', unit: 'mm', format: 'a4' });
  centerHeads(doc);
  if (RP.type !== 'terperinci') summaryPages(doc, rows, P);
  if (RP.type !== 'ringkasan') detailRows.forEach((r, i) => detailPage(doc, r, P, ranked, !(RP.type === 'terperinci' && i === 0)));

}

  const okN = el.filter(e => e.ok).length, noPlan = el.filter(e => !e.plan), noSsm = el.filter(e => !e.ssm), failC = el.filter(e => !e.ok);

  const cons = rows.map(r => [r.a.biz, r.avg == null ? '-' : fmt(r.avg), r.layakY, r.layakN, r.n ? pct(r.layakY, r.n) + '%' : '-', !r.n ? '-' : r.layakY > r.layakN ? 'Majoriti layak' : r.layakN > r.layakY ? 'Majoriti tidak layak' : 'Seimbang']);

  B.push({ t: 'h', num: '5', text: 'Syor' });
  B.push({ t: 'p', num: '5.1', text: 'Berdasarkan kepada analisis di para 4 di atas, Jawatankuasa mengesyorkan agar permohonan berikut diputuskan seperti di Jadual 6:' });
  const syorOf = r => r.final === 'Lulus' ? 'Diluluskan' : r.final === 'Tidak lulus' ? 'Tidak diluluskan' : 'Belum diputuskan';
  B.push({ t: 'table', cap: 'Jadual 6: Syor Jawatankuasa', head: ['Bil', 'Nama Pemohon', 'Syor'], body: rows.map((r, i) => [i + 1, r.a.biz, syorOf(r)]),
    widths: [16, 98, 72], center: [0], bold: [1, 2], flag: { col: 2, bad: ['Tidak diluluskan'], good: ['Diluluskan'] } });
  const sy = String(C.syor || '').split('\n').map(s => s.trim()).filter(Boolean);

  B.push({ t: 'sign', members: [{ role: 'Pengerusi', name: chair, jw: jw[nem(chair)] || '' }, ...ahli.map((n, i) => ({ role: 'Ahli ' + (ORD[i] || (i + 1)), name: n, jw: jw[nem(n)] || '' }))] });
  return B;
}

/* --- penjana PDF bagi blok --- */
/* Baris dijustifikasikan dengan merenggangkan jarak antara perkataan; baris terakhir perenggan dibiarkan rata kiri. */
function justLine(doc, line, x, y, width) {
  const words = line.split(' ').filter(Boolean);
  if (words.length < 2) { doc.text(line, x, y); return; }
  const tw = words.reduce((s, w) => s + doc.getTextWidth(w), 0), gap = (width - tw) / (words.length - 1);
  if (gap > doc.getTextWidth(' ') * 4) { doc.text(line, x, y); return; }   // elak jarak terlalu lebar
  let cx = x; words.forEach(w => { doc.text(w, cx, y); cx += doc.getTextWidth(w) + gap; });
}
function renderBlocksPdf(doc, B) {
  const m = 12, LH = 4.8, pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight(), W = pw - 2 * m, bottom = ph - 16;
  let y = 34;
  doc.setLineHeightFactor(1.35);
  const ensure = hh => { if (y + hh > bottom) { doc.addPage('a4', 'portrait'); y = 34; } };
  const ink = () => { doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(30); };
  B.forEach((b, bi) => {
    if (b.t === 'title') { doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(30); const ln = doc.splitTextToSize(b.text, W); ensure(ln.length * 5.6 + 6); doc.text(ln, pw / 2, y + 4, { align: 'center' }); y += ln.length * 5.6 + 6; }
    else if (b.t === 'h') { ensure(B[bi + 1] && B[bi + 1].t === 'p' && B[bi + 2] && B[bi + 2].t === 'table' ? 78 : 32); y += 3; doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...MAROON); doc.text(b.num + '.', m, y + 4); doc.text(b.text, m + 12, y + 4); y += 8; }
    else if (b.t === 'p') { ink(); const ln = doc.splitTextToSize(b.text, W - 12); ensure(B[bi + 1] && B[bi + 1].t === 'table' ? ln.length * LH + 42 : Math.min(ln.length, 3) * LH + 2); ln.forEach((l, i) => { ensure(LH + 1); if (i === 0 && b.num) doc.text(b.num, m, y + 4); if (i < ln.length - 1) justLine(doc, l, m + 12, y + 4, W - 12); else doc.text(l, m + 12, y + 4); y += LH; }); y += 2.2; }
    else if (b.t === 'kv') { ink(); b.rows.forEach(([k, v]) => { const ln = doc.splitTextToSize(String(v), W - 80); ensure(ln.length * LH + 1); if (k) doc.text(k, m + 12, y + 4); doc.text(':', m + 70, y + 4); doc.text(ln, m + 74, y + 4); y += ln.length * LH + 0.6; }); y += 2; }
    else if (b.t === 'list') { ink(); const off = b.roman ? 28 : 20; b.items.forEach((t, i) => { const ln = doc.splitTextToSize(t, W - off - 2); ensure(ln.length * LH + 1); doc.text('(' + (b.roman ? roman(i + 1) : String.fromCharCode(97 + i)) + ')', m + 12, y + 4); ln.forEach((l, k) => { if (k < ln.length - 1) justLine(doc, l, m + off, y + 4 + k * LH, W - off - 2); else doc.text(l, m + off, y + 4 + k * LH); }); y += ln.length * LH + 1.2; }); y += 2; }
    else if (b.t === 'table') {
      ensure(34); doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...MAROON); doc.text(b.cap, m, y + 3); y += 5;
      const cs = {}; b.widths.forEach((w, i) => cs[i] = { cellWidth: w, halign: (b.center || []).includes(i) ? 'center' : 'left', fontStyle: (b.bold || []).includes(i) ? 'bold' : 'normal' });
      doc.autoTable({ ...TBL, startY: y, margin: { top: 30, bottom: 16, left: m, right: m }, styles: { ...TBL.styles, fontSize: 8, cellPadding: 1.5 }, head: [b.head], body: b.body.map(r => r.map(String)), columnStyles: cs,
        didParseCell: d => { if (b.flag && d.section === 'body' && d.column.index === b.flag.col) { if (b.flag.bad.includes(d.cell.raw)) { d.cell.styles.textColor = [179, 38, 30]; d.cell.styles.fontStyle = 'bold'; } else if ((b.flag.good || []).includes(d.cell.raw)) { d.cell.styles.textColor = [31, 122, 77]; d.cell.styles.fontStyle = 'bold'; } } } });
      y = doc.lastAutoTable.finalY + 2;
      if (b.note) { doc.setFont('helvetica', 'italic'); doc.setFontSize(7.5); doc.setTextColor(...GREY); const ln = doc.splitTextToSize(b.note, W); ensure(ln.length * 3.4); doc.text(ln, m, y + 3); y += ln.length * 3.4 + 2; }
      y += 3;
    }
    else if (b.t === 'sign') {
      doc.addPage('a4', 'portrait'); y = 34;   // tandatangan sentiasa bermula di mukasurat baharu
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(30); doc.text('TANDATANGAN AHLI-AHLI JAWATANKUASA', pw / 2, y + 4, { align: 'center' }); y += 10;
      const cw = (W - 10) / 2;
      for (let i = 0; i < b.members.length; i += 2) {
        ensure(46);
        [b.members[i], b.members[i + 1]].forEach((mb, k) => {
          if (!mb) return; const x = m + k * (cw + 10);
          doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(30); doc.text(mb.role, x, y + 3);
          doc.setDrawColor(90); doc.setLineWidth(0.25); doc.line(x, y + 18, x + cw, y + 18);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.text(mb.name, x, y + 22.5);
          doc.setTextColor(...GREY); if (mb.jw) doc.text(mb.jw, x, y + 27); doc.text('Tarikh: ' + DOTS.slice(0, 22), x, y + 33);
        });
        y += 42;
      }
    }
  });
}

function blocksHtml(B) {
  return B.map(b => {
    if (b.t === 'title') return `<h3 style="text-align:center;font-size:14px;margin:6px 0 10px">${esc(b.text)}</h3>`;

    if (b.t === 'sign') return `<h4 style="text-align:center;margin:22px 0 4px">TANDATANGAN AHLI-AHLI JAWATANKUASA</h4><div style="display:flex;flex-wrap:wrap;gap:6px 30px">${b.members.map(mb => `<div style="flex:1 1 220px;margin-top:6px"><b>${esc(mb.role)}</b><div style="border-bottom:1px solid #999;height:36px"></div>${esc(mb.name)}${mb.jw ? `<br><span style="color:#6f6266">${esc(mb.jw)}</span>` : ''}<br><span style="color:#6f6266">Tarikh: ............</span></div>`).join('')}</div>`;
    return '';
  }).join('');
}

    $('#syadd').onclick = () => { jkCollect(); SY.push(''); laporan(); const t = document.querySelectorAll('[data-syor]'); if (t.length) t[t.length - 1].focus(); };
    const ch = document.querySelector('[data-cfg="pengerusi"]'); if (ch) ch.onchange = () => { jkCollect(); laporan(); };   // senarai jawatan mengikut pengerusi baharu
    $('#jsave').onclick = async () => { try { const c = jkCollect(); D.cfg = await rpc('apiSaveTetapan', c, SEL); $('#jmsg').textContent = ' Disimpan.'; toast('Butiran laporan disimpan'); } catch (e) { toast(e.message, true); } };
  }
  $('#rl').onclick = async () => { await loadAdmin(); toast('Data dimuat semula'); };
  const name = () => 'Laporan_' + { ringkasan: 'Penilaian_Ringkasan', terperinci: 'Penilaian_Terperinci', lengkap: 'Penilaian_Lengkap', jawatankuasa: 'JPPPDKP' }[RP.type] + '_' + new Date().toISOString().slice(0, 10) + '.pdf';
  const make = (fn) => { try { if (jk) { const c = jkCollect(); rpc('apiSaveTetapan', c, SEL).then(x => { D.cfg = x; }).catch(() => { }); } const doc = buildPdf(); fn(doc); rpc('apiLogReport', RP.type + (RP.jenis ? ' / ' + RP.jenis : '')).catch(() => { }); } catch (e) { toast(e.message, true); } };
  $('#dl').onclick = () => make(doc => { doc.save(name()); toast('PDF dijana'); });
  $('#op').onclick = () => make(doc => { const w = window.open(doc.output('bloburl'), '_blank'); if (!w) toast('Pelayar menyekat tab baharu. Benarkan pop-up atau guna Muat turun.', true); });
}

/* ===================== PANEL (PENILAI) ===================== */
let cur = 0, openAnch = null, openEls = false, openNote = {}, saveT = null, armSend = false, saving = '';
let ACT_AS = null;   // e-mel panel yang sedang dinilai oleh admin (null = paparan panel biasa)
function prepPanel() {
  D.apps.forEach(a => { const n = D.crit.length; if (!D.mine[a.id]) D.mine[a.id] = { lv: Array(n).fill(0), mk: Array(n).fill(0), els: [], cm: '', ok: '', status: 'Draf', notes: Array(n).fill('') }; const m = D.mine[a.id]; if (!m.notes || m.notes.length < n) m.notes = Array.from({ length: n }, (_, i) => (m.notes && m.notes[i]) || ''); });
}
async function loadPanel() {
  D = await rpc('apiPanelData'); prepPanel();
  $('#whoR').textContent = 'Penilai / Evaluator' + (D.me.no ? ' · Panel ' + D.me.no : '');
  if (!D.sesi) {   // tiada mesyuarat dibuka oleh urusetia
    $('#sub').textContent = 'Penilaian permohonan Student Mall & SUB';
    app.innerHTML = `<div class="login card" style="max-width:520px;text-align:center"><h2>Tiada mesyuarat dibuka</h2><p class="note">Penilaian belum dibuka. Urusetia akan membuka mesyuarat penilaian dan memaklumkan anda. Muat semula halaman ini selepas itu.</p><div class="foot" style="justify-content:center"><button class="btn-line" id="rl2">Muat semula</button></div></div>`;
    $('#rl2').onclick = () => loadPanel();
    return;
  }
  $('#sub').textContent = D.sesi.nama + ' · ' + D.sesi.tarikh;
  evalView();
}
const saveEv = (id, m, submit) => ACT_AS ? rpc('apiSaveEvalAs', ACT_AS, id, m, submit, SEL) : rpc('apiSaveEval', id, m, submit);
/** Admin masuk ke paparan penilaian seorang panel untuk memberi markah bagi pihaknya. */
async function enterAs(email, pid) {
  try {
    const d = await rpc('apiAdminEvalData', email, SEL);
    ACT_AS = email; D = d; prepPanel();
    cur = Math.max(0, D.apps.findIndex(x => x.id === pid)); openAnch = null; openEls = false; armSend = false; saving = '';
    evalView(); window.scrollTo(0, 0);
  } catch (e) { ACT_AS = null; toast(e.message, true); }
}
const tot = m => m.mk.reduce((a, b) => a + b, 0);
function queueSave() {
  const a = D.apps[cur], m = D.mine[a.id]; if (m.status === 'Dihantar') return;
  saving = 'Menyimpan…'; const s = $('#sv'); if (s) s.textContent = saving;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { await saveEv(a.id, m, false); saving = 'Draf disimpan automatik / Draft saved'; } catch (e) { saving = 'Gagal menyimpan: ' + e.message; }
    const s2 = $('#sv'); if (s2) s2.textContent = saving;
  }, 900);
}
function evalView() {
  const y = window.scrollY;
  const a = D.apps[cur], m = D.mine[a.id], closed = D.sesi.status !== 'Dibuka' && !ACT_AS, lock = m.status === 'Dihantar' || closed;
  const crit = D.crit, left = m.lv.filter(x => x < 1).length;
  const ready = left === 0 && !!m.ok;
  const stateTxt = lock ? '' : left ? `Lengkapkan ${left} kriteria lagi` : !m.ok ? 'Pilih sama ada pelajar layak' : 'Sedia dihantar';
  app.innerHTML = `${ACT_AS ? `<div class="asbar"><span>🛡 <b>Mod admin:</b> anda memberi markah bagi <b>${esc(D.me.name)}</b>. Markah disimpan atas nama panel ini dan direkodkan dalam Log.${m.by ? ' <i>(diisi oleh admin)</i>' : ''}</span><button class="btn-line" id="back">← Kembali ke Admin</button></div>` : ''}<div class="eval"><aside class="left">
   <div class="cal"><span class="tag">Calon ${cur + 1} / ${D.apps.length}</span><span class="note">${a.slot ? 'Slot ' + esc(a.slot) : esc(D.sesi.tarikh) + ' · ' + esc(D.sesi.masa)}</span></div>
   <h2>${esc(a.biz)}</h2><p class="sub-note">${typePill(a.type)} ${esc(a.kind)}</p>
   <div class="card info">${a.st.map(s => `<dl class="kv" style="margin:0 0 10px"><dt>Nama pelajar</dt><dd>${esc(s.n)}</dd><dt>No. Matrik</dt><dd>${esc(s.m)}</dd><dt>No. KP</dt><dd>${esc(s.kp)}</dd><dt>Tahun</dt><dd>${esc(s.yr)}</dd><dt>Fakulti</dt><dd>${esc(s.fac)}</dd><dt>Kursus</dt><dd>${esc(s.course)}</dd><dt>CGPA</dt><dd>${s.cgpa.toFixed(2)}</dd></dl>`).join('')}
    <dl class="kv" style="margin:0"><dt>Syarikat / SSM</dt><dd>${esc(a.biz)} · ${esc(a.ssm)}</dd><dt>Jenis</dt><dd>${esc(a.kind)}</dd></dl></div>
   ${a.plan ? `<a class="openplan" href="${esc(a.plan)}" target="_blank" rel="noopener">📄 Buka cadangan perniagaan<small>Open business proposal</small></a>` : ''}
   <p class="note" style="margin-top:12px">Anda hanya melihat penilaian anda sendiri / You only see your own scores</p>
   <div class="navrow"><button class="btn-line" id="pv" ${cur === 0 ? 'disabled' : ''}>◀ ${cur === 0 ? 'Sebelumnya' : 'Calon ' + cur}</button><button class="btn-line" id="nx" ${cur === D.apps.length - 1 ? 'disabled' : ''}>${cur === D.apps.length - 1 ? 'Seterusnya' : 'Calon ' + (cur + 2)} ▶</button></div>
  </aside><section>
   <div class="head" style="margin-bottom:4px"><div><h2 style="font-size:22px">Penilaian <span class="note" style="font-weight:400">Evaluation · pilih tahap, laras markah jika perlu</span></h2></div></div>
   <p class="legend">Tahap: 5 Cemerlang · 4 Baik · 3 Memuaskan · 2 Kurang · 1 Lemah</p>
   ${m.status === 'Dihantar' ? (ACT_AS ? '<div class="lock">Skor telah dihantar dan dikunci. <button class="btn-line" id="reopen" style="margin-left:8px;padding:5px 12px">Buka semula untuk disunting</button></div>' : '<div class="lock">Skor telah dihantar dan dikunci. Hubungi admin untuk membuka semula.</div>') : closed ? '<div class="lock" style="background:var(--warn-soft);color:var(--warn)">Sesi telah ditutup.</div>' : ''}
   ${crit.map((c, i) => {
     const noteOn = !!openNote[a.id + '-' + i];
     return `<div class="crit"><div class="ct"><h4>${esc(c.bm)} <button data-an="${i}" aria-label="Panduan tahap ${esc(c.bm)}" title="Panduan tahap">ⓘ</button></h4><small>${esc(c.en)} · /${c.max}</small>
      ${c.els.length ? `<br><button class="elsum" data-elx="1">Semak ${c.els.length} elemen: <b>${c.els.map((e, k) => m.els[k] ? '✓' : '✗').join('')}</b> (${c.els.filter((e, k) => m.els[k]).length}/${c.els.length}) ${openEls ? '▴' : '▾'}</button>` : ''}
      <br><button class="notebtn ${m.notes[i] ? 'has' : ''}" data-nt="${i}">${m.notes[i] ? '✎ Catatan (ada)' : '＋ Catatan'}</button></div>
     <div class="lv" role="group" aria-label="Tahap ${esc(c.bm)}">${[1, 2, 3, 4, 5].map(n => `<button data-c="${i}" data-l="${n}" aria-pressed="${m.lv[i] === n}" ${lock ? 'disabled' : ''}>${n}</button>`).join('')}</div>
     <div class="mk" title="Markah boleh dilaras"><input type="number" min="0" max="${c.max}" step="1" value="${m.mk[i]}" data-m="${i}" aria-label="Markah ${esc(c.bm)}" ${lock ? 'disabled' : ''}>/ ${c.max}</div>
     <div class="more ${openAnch === i || (c.els.length && openEls) || noteOn ? 'on' : ''}">
      ${openAnch === i ? `<div class="anchbox on" style="display:block"><div class="anch"><div><b>Tahap 5</b>${esc(c.a5)}</div><div><b>Tahap 3</b>${esc(c.a3)}</div><div><b>Tahap 1</b>${esc(c.a1)}</div></div><small>${esc(c.sub)}. Tahap 4 dan 2 berada di antara.</small></div>` : ''}
      ${c.els.length && openEls ? `<div class="els">${c.els.map((e, k) => `<label><input type="checkbox" data-el="${k}" ${m.els[k] ? 'checked' : ''} ${lock ? 'disabled' : ''}>${esc(e)}</label>`).join('')}</div>` : ''}
      ${noteOn ? `<textarea rows="2" data-note="${i}" placeholder="Catatan untuk kriteria ini (pilihan)…" ${lock ? 'disabled' : ''}>${esc(m.notes[i])}</textarea>` : ''}
     </div></div>`;
   }).join('')}
   <div class="cmt"><h4>Catatan keseluruhan <small>Overall comments</small></h4>
    <div class="chips" style="margin-bottom:10px"><span class="note">Ulasan pantas / Quick comments:</span>${D.chips.map((c, k) => `<button class="chip" data-chip="${k}" ${lock ? 'disabled' : ''}>${esc(c)}</button>`).join('')}</div>
    <textarea id="cm" rows="3" placeholder="Tulis catatan atau ulasan panel di sini…" ${lock ? 'disabled' : ''}>${esc(m.cm)}</textarea>
    <div class="layak"><b>Pelajar layak?</b><label><input type="radio" name="ok" value="Ya" ${m.ok === 'Ya' ? 'checked' : ''} ${lock ? 'disabled' : ''}> Ya</label><label><input type="radio" name="ok" value="Tidak" ${m.ok === 'Tidak' ? 'checked' : ''} ${lock ? 'disabled' : ''}> Tidak</label></div></div>
   <div class="bar-b"><div class="total"><small>JUMLAH / TOTAL</small><b>${tot(m)}</b><span> / 100</span></div>
    <div><div class="state ${ready && !lock ? 'ready' : ''}">${esc(stateTxt)}</div><div class="note" id="sv">${lock ? '' : esc(saving || 'Draf disimpan automatik / Draft saved automatically')}</div></div><span class="spacer"></span>
    <button class="btn-line" id="draft" ${lock ? 'disabled' : ''}>Simpan draf</button><button class="btn-solid" id="send" ${lock ? 'disabled' : ''}>${armSend ? 'Sahkan: hantar & kunci' : 'Hantar skor & kunci<small>Submit & lock scores</small>'}</button></div>
  </section></div>`;
  window.scrollTo(0, y);
  const go = d => { cur += d; openAnch = null; openEls = false; armSend = false; saving = ''; evalView(); window.scrollTo(0, 0); };
  $('#pv').onclick = () => go(-1); $('#nx').onclick = () => go(1);
  const bk = $('#back'); if (bk) bk.onclick = async () => { ACT_AS = null; clearTimeout(saveT); cur = 0; await loadAdmin(SEL); };
  const ro = $('#reopen'); if (ro) ro.onclick = async () => { try { await rpc('apiReopen', a.id, ACT_AS, SEL); toast('Dibuka semula'); await enterAs(ACT_AS, a.id); } catch (e) { toast(e.message, true); } };
  app.querySelectorAll('[data-an]').forEach(b => b.onclick = () => { openAnch = openAnch === +b.dataset.an ? null : +b.dataset.an; evalView(); });
  app.querySelectorAll('[data-elx]').forEach(b => b.onclick = () => { openEls = !openEls; evalView(); });
  app.querySelectorAll('[data-nt]').forEach(b => b.onclick = () => { const k = a.id + '-' + b.dataset.nt; openNote[k] = !(openNote[k]); evalView(); });
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { const i = +b.dataset.c, l = +b.dataset.l; m.lv[i] = l; m.mk[i] = Math.round(l / 5 * crit[i].max); armSend = false; queueSave(); evalView(); });
  app.querySelectorAll('[data-m]').forEach(inp => inp.onchange = () => { const i = +inp.dataset.m; m.mk[i] = Math.max(0, Math.min(crit[i].max, Math.round(+inp.value || 0))); armSend = false; queueSave(); evalView(); });
  app.querySelectorAll('[data-el]').forEach(c => c.onchange = () => { m.els[+c.dataset.el] = c.checked; queueSave(); evalView(); });
  app.querySelectorAll('[data-note]').forEach(t => t.oninput = () => { m.notes[+t.dataset.note] = t.value; queueSave(); });
  app.querySelectorAll('[data-chip]').forEach(c => c.onclick = () => { const t = D.chips[+c.dataset.chip]; m.cm = (m.cm ? m.cm + '; ' : '') + t; queueSave(); evalView(); });
  const cm = $('#cm'); if (cm) cm.oninput = e => { m.cm = e.target.value; queueSave(); };
  app.querySelectorAll('[name=ok]').forEach(r => r.onchange = () => { m.ok = r.value; armSend = false; queueSave(); evalView(); });
  const dr = $('#draft'); if (dr) dr.onclick = async () => { clearTimeout(saveT); try { await saveEv(a.id, m, false); saving = 'Draf disimpan / Draft saved'; toast('Draf disimpan'); } catch (e) { toast(e.message, true); } const s = $('#sv'); if (s) s.textContent = saving; };
  $('#send').onclick = async () => {
    if (left) return toast('Pilih tahap bagi ' + left + ' kriteria lagi', true);
    if (!m.ok) return toast('Pilih sama ada pelajar layak', true);
    if (!armSend) { armSend = true; evalView(); return; }
    clearTimeout(saveT);
    try { D.mine[a.id] = await saveEv(a.id, m, true); toast('Skor dihantar dan dikunci'); } catch (e) { toast(e.message, true); }
    armSend = false; evalView();
  };
}

window.addEventListener('error', ev => { if (app && /Memuatkan/.test(app.textContent)) showCrash(ev.error || ev.message); });
start();
</script>
</body>
</html>
