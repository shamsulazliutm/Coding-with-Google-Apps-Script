<style>
/* Tema UTMPreneur: maroon + emas, menu sisi untuk admin, skrin penuh untuk panel */
:root{
  --bg:#f6f2f2; --surface:#ffffff; --fg:#221a1c; --muted:#6f6266; --line:#e6dcdd;
  --maroon:#8a2d3b; --maroon-soft:#f3e3e5; --gold:#d9a02b; --gold-soft:#fbf1da;
  --ok:#1f7a4d; --ok-soft:#dff2e8; --warn:#9a6a08; --warn-soft:#fbefd0; --bad:#b3261e; --bad-soft:#fbe2e0; --info:#1f5fa0; --info-soft:#e0ecf8;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171213; --surface:#231b1d; --fg:#f2e9ea; --muted:#a89a9d; --line:#3a2e30;
  --maroon:#d0707f; --maroon-soft:#3a2328; --gold:#e3b04a; --gold-soft:#3a3020;
  --ok:#5fd09a; --ok-soft:#1c3328; --warn:#e8b94f; --warn-soft:#3a3018; --bad:#f08a82; --bad-soft:#402220; --info:#7db4ec; --info-soft:#1e2d40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171213; --surface:#231b1d; --fg:#f2e9ea; --muted:#a89a9d; --line:#3a2e30;
  --maroon:#d0707f; --maroon-soft:#3a2328; --gold:#e3b04a; --gold-soft:#3a3020;
  --ok:#5fd09a; --ok-soft:#1c3328; --warn:#e8b94f; --warn-soft:#3a3018; --bad:#f08a82; --bad-soft:#402220; --info:#7db4ec; --info-soft:#1e2d40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn-solid{background:#8a2d3b;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-solid{background:#a8404f}}
:root[data-theme="dark"] .btn-solid{background:#a8404f}
.btn-line{background:var(--surface);border:1.5px solid var(--maroon);color:var(--maroon);border-radius:8px;padding:9px 14px;font-weight:600}
.btn-ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--muted)}
.btn-solid[disabled]{opacity:.45;cursor:not-allowed}

/* header */
.top{background:var(--surface);border-bottom:3px solid var(--gold);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.logo{display:flex;align-items:center;gap:8px}
.logo .utm{background:#8a2d3b;color:#fff;font-weight:700;font-size:15px;padding:8px 9px 6px;border-radius:3px;letter-spacing:.04em;line-height:1;display:flex;flex-direction:column;align-items:center}
.logo .utm small{font-size:5px;letter-spacing:.02em;margin-top:2px;font-weight:600}
.logo .xc{font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--maroon)}
.logo .xc b{color:var(--gold)}
.brand{min-width:0}
.brand h1{margin:0;font-size:18px;color:var(--maroon);line-height:1.2}
.brand p{margin:0;font-size:12.5px;color:var(--muted);font-style:italic}
.who{margin-left:auto;text-align:right;min-width:0}
.who b{display:block;font-size:14px}
.who span{font-size:12px;color:var(--muted);font-style:italic}
.roleswitch{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--bg)}
.roleswitch button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.roleswitch button[aria-pressed="true"]{background:#8a2d3b;color:#fff}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:70vh}
nav.side{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
nav.side button{text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
nav.side button[aria-current="page"]{background:var(--maroon-soft);color:var(--maroon);font-weight:700}
nav.side .n{font-size:12px;background:var(--gold-soft);color:var(--warn);border-radius:999px;padding:1px 8px;font-weight:700}
main{padding:24px max(16px,env(safe-area-inset-right,0px)) 48px 24px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h2{margin:0;font-size:26px;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--muted);font-style:italic;font-size:13.5px}
.demo{background:var(--gold-soft);color:var(--warn);font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px}

/* cards, tables, pills */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:16px}
.card h3 i{font-weight:400;color:var(--muted);font-size:13px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:32px;font-weight:700;line-height:1.15;margin:2px 0}
.stat .s{font-size:12.5px;color:var(--muted);font-style:italic}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--maroon-soft)}
td small{display:block;color:var(--muted);font-size:12.5px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.prog{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select,.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.f label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.f .wide{grid-column:1/-1}
.note{font-size:13px;color:var(--muted);font-style:italic}
.detail{margin-top:14px;border-color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px}
button.chip:hover{border-color:var(--maroon);color:var(--maroon)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rubrow{display:grid;grid-template-columns:34px minmax(0,1.5fr) 80px minmax(0,2fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.rubrow .no{font-weight:700;color:var(--maroon)}
.rubrow i{display:block;color:var(--muted);font-size:13px}
.rubrow input{width:70px;text-align:right}
.anch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.anch div{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px}
.anch b{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--maroon);margin-bottom:2px}

/* panel / penilai */
.eval{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:20px;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.cal{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cal .tag{background:var(--info-soft);color:var(--info);font-weight:700;border-radius:999px;padding:3px 12px;font-size:13px}
.eval h2{margin:6px 0 2px;font-size:24px;text-transform:uppercase;letter-spacing:.01em}
.kv{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.stud+.stud{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.openplan{display:block;text-align:center;border:1.5px solid var(--maroon);color:var(--maroon);background:var(--surface);border-radius:10px;padding:12px;text-decoration:none;font-weight:700;margin-top:12px}
.openplan small{display:block;font-weight:400;font-style:italic;color:var(--muted)}
.crit{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(0,2.4fr) 96px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.crit h4{margin:0;font-size:16px;display:flex;gap:6px;align-items:center}
.crit h4 button{border:1px solid var(--line);background:var(--bg);border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1;color:var(--muted)}
.crit small{color:var(--muted);font-style:italic;font-size:12.5px}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 0;font-weight:700;font-size:16px}
.lv button[aria-pressed="true"]{background:#8a2d3b;color:#fff;border-color:#8a2d3b}
.mk{display:flex;align-items:center;justify-content:flex-end;gap:4px;background:var(--maroon-soft);color:var(--maroon);border:1px solid var(--maroon);border-radius:8px;padding:4px 8px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.mk input{width:38px;text-align:right;border:0;background:transparent;font-weight:700;font-size:17px;color:var(--maroon);padding:2px}
.anchbox{grid-column:1/-1;background:var(--bg);border-radius:8px;padding:10px;display:none}
.anchbox.on{display:block}
.els{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.els label{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.foot{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px}
.total{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 18px}
.total small{display:block;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.total b{font-size:34px;line-height:1.1;color:var(--maroon)}.total span{color:var(--muted);font-size:18px}
.spacer{flex:1}
.layak{display:flex;gap:16px;align-items:center;margin:12px 0;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:20}
.lock{background:var(--ok-soft);color:var(--ok);padding:8px 12px;border-radius:8px;font-weight:600;margin-bottom:10px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  nav.side button{white-space:nowrap}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .two,.eval{grid-template-columns:1fr}
  .crit{grid-template-columns:1fr 96px}.crit .lv{grid-column:1/-1;order:3}
  .rubrow{grid-template-columns:28px minmax(0,1fr) 70px}.rubrow .sub{grid-column:2/-1}
  .who{margin-left:0;text-align:left}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

.logoimg{height:40px;max-width:200px}
.err{max-width:560px;margin:60px auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hidden-in-panel{display:none}
</style>
