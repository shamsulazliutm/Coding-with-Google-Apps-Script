<script>
/* Klien: semua data datang daripada pelayan (Code.gs). Tapisan akses dibuat di pelayan. */
const $ = s => document.querySelector(s), app = $('#app');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rpc = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => no(new Error(e && e.message ? e.message.replace(/^Exception: /, '') : String(e))))[fn](...a));
let B = null, D = null;

function toast(t, bad) {
  const e = document.createElement('div'); e.className = 'toast'; e.textContent = t;
  if (bad) e.style.background = 'var(--bad)', e.style.color = '#fff';
  document.body.append(e); setTimeout(() => e.remove(), bad ? 3600 : 1800);
}
const typePill = t => `<span class="pill ${t === 'SUB' ? 'p-info' : 'p-mute'}">${esc(t)}</span>`;
const short = n => String(n).replace(/^(Dr\.|En\.|Pn\.|PM\. Dr\.|PM\.) /, '').split(' ').slice(0, 2).join(' ');

async function start() {
  try {
    B = await rpc('apiBoot');
    $('#whoN').textContent = B.me.name || B.me.email || 'Tidak dikenali';
    if (B.me.role === 'admin') { $('#whoR').textContent = 'Admin Penuh / Full Admin'; await loadAdmin(); }
    else if (B.me.role === 'panel') { $('#whoR').textContent = 'Penilai / Evaluator'; $('#sub').textContent = 'Sesi penilaian permohonan Student Mall & SUB'; await loadPanel(); }
    else app.innerHTML = `<div class="err"><h2>Akses tidak dibenarkan</h2><p>${B.me.email ? 'Akaun <b>' + esc(B.me.email) + '</b> tiada dalam senarai panel.' : 'E-mel akaun tidak dapat dikesan. Log masuk dengan akaun UTM anda.'} Sila hubungi ${esc(B.admin)}.</p></div>`;
  } catch (e) { app.innerHTML = `<div class="err"><h2>Ralat</h2><p>${esc(e.message)}</p></div>`; }
}

/* ===================== ADMIN ===================== */
let tab = 'dashboard', openRow = null, filt = { q: '', t: '' }, openKey = null;
const TABS = [['dashboard', 'Dashboard'], ['permohonan', 'Permohonan'], ['sesi', 'Sesi penilaian'], ['panel', 'Panel'], ['rubrik', 'Rubrik'], ['keputusan', 'Keputusan'], ['log', 'Log']];

async function loadAdmin() { D = await rpc('apiAdminData'); adminShell(); }
function adminShell() {
  app.innerHTML = `<div class="shell"><nav class="side" aria-label="Menu admin">${TABS.map(t => `<button data-t="${t[0]}" ${tab === t[0] ? 'aria-current="page"' : ''}>${t[1]}${t[0] === 'permohonan' ? `<span class="n">${D.apps.length}</span>` : ''}</button>`).join('')}</nav><main id="main"></main></div>`;
  app.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; openRow = null; openKey = null; adminShell(); });
  ({ dashboard, permohonan, sesi, panel, rubrik, keputusan, log })[tab]();
}
async function act(fn, msg, ...a) {
  try { await rpc(fn, ...a); toast(msg); await loadAdmin(); } catch (e) { toast(e.message, true); }
}
const head = (t, en, right = '') => `<div class="head"><div><h2>${t}</h2><p>${en}</p></div><div>${right}</div></div>`;
const sent = (pid, email) => D.nilai.find(n => n.pid === pid && n.email.toLowerCase() === email.toLowerCase());

function dashboard() {
  const P = D.keputusan.panels, total = P.length * D.apps.length;
  const per = P.map(p => ({ p, n: D.nilai.filter(n => n.email.toLowerCase() === p.emel.toLowerCase() && n.status === 'Dihantar').length }));
  const done = per.reduce((a, x) => a + x.n, 0);
  const pend = D.keputusan.rows.filter(r => r.n < P.length).map(r => `<tr><td><b>${esc(r.biz)}</b><small>${P.length - r.n} panel belum hantar</small></td><td class="num"><span class="pill ${r.n < P.length / 2 ? 'p-bad' : 'p-warn'}">${r.n}/${P.length}</span></td></tr>`).join('');
  const sm = D.apps.filter(a => a.type === 'Student Mall').length;
  $('#main').innerHTML = head('Ringkasan', 'Overview · ' + esc(D.sesi.tarikh)) + `
  <div class="cards">
   <div class="card stat"><div class="l">Permohonan</div><div class="v">${D.apps.length}</div><div class="s">Student Mall ${sm} · SUB ${D.apps.length - sm}</div></div>
   <div class="card stat"><div class="l">Panel aktif</div><div class="v">${P.length}</div><div class="s">Active evaluators</div></div>
   <div class="card stat"><div class="l">Penilaian dihantar</div><div class="v">${done} / ${total}</div><div class="s">Submitted · ${total ? Math.round(done / total * 100) : 0}%</div></div>
   <div class="card stat"><div class="l">Sesi</div><div class="v" style="font-size:24px;padding:6px 0"><span class="pill ${D.sesi.status === 'Dibuka' ? 'p-ok' : 'p-mute'}" style="font-size:16px">${esc(D.sesi.status)}</span></div><div class="s">${esc(D.sesi.tarikh)} · ${esc(D.sesi.masa)}</div></div></div>
  <div class="two"><div class="card"><h3>Kemajuan panel <i>Panel progress</i></h3>${per.map(x => `<div class="prog"><span>${esc(short(x.p.nama))}</span><div class="bar"><i style="width:${D.apps.length ? x.n / D.apps.length * 100 : 0}%"></i></div><b class="num">${x.n}/${D.apps.length}</b></div>`).join('')}</div>
  <div class="card"><h3>Perlu tindakan <i>Needs action</i></h3>${pend ? `<div class="tw"><table><tbody>${pend}</tbody></table></div>` : '<p class="note">Semua panel telah menghantar.</p>'}
   <div class="foot">${D.sesi.status === 'Dibuka' ? '<button class="btn-solid" id="close">Tutup sesi & kunci</button>' : '<button class="btn-line" id="open">Buka semula sesi</button>'}</div></div></div>`;
  const c = $('#close'); if (c) c.onclick = () => armed(c, 'Sahkan tutup sesi', () => act('apiSetSesiStatus', 'Sesi ditutup', 'Ditutup'));
  const o = $('#open'); if (o) o.onclick = () => act('apiSetSesiStatus', 'Sesi dibuka', 'Dibuka');
}
function armed(btn, label, fn) { if (btn.dataset.arm) return fn(); btn.dataset.arm = 1; btn.textContent = label; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.arm; } }, 4000); }

function permohonan() {
  const list = D.apps.filter(a => (!filt.t || a.type === filt.t) && (a.biz + a.st.map(s => s.n + s.m).join()).toLowerCase().includes(filt.q.toLowerCase()));
  $('#main').innerHTML = head('Permohonan', 'Applications', '<button class="btn-solid" id="add">+ Tambah</button>') + `
  <div class="toolbar"><select id="ft" aria-label="Jenis"><option value="">Semua jenis</option><option ${filt.t === 'Student Mall' ? 'selected' : ''}>Student Mall</option><option ${filt.t === 'SUB' ? 'selected' : ''}>SUB</option></select><input id="fq" placeholder="Cari nama / matrik / perniagaan" value="${esc(filt.q)}" style="flex:1;min-width:200px"></div>
  <div class="card tw"><table><thead><tr><th>Bil</th><th>Perniagaan</th><th>Pelajar</th><th>Jenis</th><th class="num">CGPA</th><th>Pelan</th></tr></thead><tbody>
  ${list.map(a => `<tr class="click" data-i="${a.id}"><td>${a.id}</td><td><b>${esc(a.biz)}</b><small>${esc(a.kind)}</small></td><td>${esc(a.st[0] ? a.st[0].n : '')}${a.st.length > 1 ? `<small>+ ${a.st.length - 1} pelajar lagi</small>` : ''}</td><td>${typePill(a.type)}</td><td class="num">${a.st.map(s => s.cgpa.toFixed(2)).join(' / ')}</td><td>${a.plan ? '📄' : '–'}</td></tr>`).join('')}</tbody></table></div><div id="det"></div>`;
  $('#ft').onchange = e => { filt.t = e.target.value; permohonan(); };
  $('#fq').oninput = e => { filt.q = e.target.value; const p = e.target.selectionStart; permohonan(); const n = $('#fq'); n.focus(); n.setSelectionRange(p, p); };
  app.querySelectorAll('tr.click').forEach(r => r.onclick = () => { openRow = +r.dataset.i; detail(); });
  $('#add').onclick = () => { openRow = 0; detail(); };
  if (openRow !== null) detail();
}
function stRow(s = {}) {
  return `<tr class="srow"><td><input data-k="n" value="${esc(s.n)}" placeholder="Nama"></td><td><input data-k="m" value="${esc(s.m)}" style="width:100px"></td><td><input data-k="kp" value="${esc(s.kp)}" style="width:130px"></td><td><input data-k="yr" value="${esc(s.yr)}" style="width:44px"></td><td><input data-k="fac" value="${esc(s.fac)}" style="width:60px"></td><td><input data-k="course" value="${esc(s.course)}"></td><td><input data-k="cgpa" value="${esc(s.cgpa)}" style="width:60px"></td></tr>`;
}
function detail() {
  const a = openRow ? D.apps.find(x => x.id === openRow) : { id: 0, biz: '', type: 'Student Mall', ssm: '', kind: '', plan: '', slot: '', st: [{}] };
  $('#det').innerHTML = `<div class="card detail"><h3>${a.id ? 'Edit: ' + esc(a.biz) : 'Permohonan baharu'}</h3><div class="f">
  <label>Nama perniagaan<input id="e_biz" value="${esc(a.biz)}"></label>
  <label>Jenis permohonan<select id="e_type"><option ${a.type === 'Student Mall' ? 'selected' : ''}>Student Mall</option><option ${a.type === 'SUB' ? 'selected' : ''}>SUB</option></select></label>
  <label>No. SSM<input id="e_ssm" value="${esc(a.ssm)}"></label>
  <label>Jenis perniagaan<input id="e_kind" value="${esc(a.kind)}"></label>
  <label class="wide">Pautan pelan perniagaan<input id="e_plan" value="${esc(a.plan)}"></label>
  <label>Slot masa (pilihan)<input id="e_slot" value="${esc(a.slot)}" placeholder="cth. 3.00 – 3.20 ptg"></label></div>
  <h3 style="margin-top:16px">Pelajar <i>Students</i></h3><div class="tw"><table><thead><tr><th>Nama</th><th>Matrik</th><th>No. KP</th><th>Thn</th><th>Fakulti</th><th>Kursus</th><th>CGPA</th></tr></thead><tbody id="strows">${a.st.map(stRow).join('')}</tbody></table></div>
  <div class="foot"><button class="btn-ghost" id="addst">+ Tambah pelajar</button><span class="spacer"></span><button class="btn-ghost" id="cancel">Batal</button><button class="btn-solid" id="save">Simpan</button></div></div>`;
  $('#addst').onclick = () => $('#strows').insertAdjacentHTML('beforeend', stRow());
  $('#cancel').onclick = () => { openRow = null; $('#det').innerHTML = ''; };
  $('#save').onclick = () => {
    const st = [...document.querySelectorAll('.srow')].map(r => { const o = {}; r.querySelectorAll('input').forEach(i => o[i.dataset.k] = i.value.trim()); o.cgpa = parseFloat(o.cgpa) || 0; return o; }).filter(s => s.n);
    openRow = null;
    act('apiSaveApp', 'Permohonan disimpan', { id: a.id, biz: $('#e_biz').value.trim(), type: $('#e_type').value, ssm: $('#e_ssm').value.trim(), kind: $('#e_kind').value.trim(), plan: $('#e_plan').value.trim(), slot: $('#e_slot').value.trim(), st });
  };
  $('#det').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function sesi() {
  const S = D.sesi, P = D.panels.filter(p => p.peranan.toLowerCase() === 'panel');
  $('#main').innerHTML = head('Sesi penilaian', 'Evaluation session', `<span class="pill ${S.status === 'Dibuka' ? 'p-ok' : 'p-mute'}">${esc(S.status)}</span>`) + `
  <div class="card"><div class="f"><label>Nama sesi<input id="s_n" value="${esc(S.nama)}"></label><label>Tarikh<input id="s_t" value="${esc(S.tarikh)}"></label><label>Masa<input id="s_m" value="${esc(S.masa)}"></label><label>Versi rubrik<input value="Versi ${S.versi}" disabled></label></div>
  <h3 style="margin-top:18px">Panel <i>diurus dalam tab Panel</i></h3><div class="chips">${P.map(p => `<span class="chip">${esc(p.nama)}${p.status !== 'Aktif' ? ' (tidak aktif)' : ''}</span>`).join('')}</div>
  <h3 style="margin-top:18px">Calon dan susunan pembentangan <i>slot masa tidak wajib</i></h3>
  <div class="tw"><table><tbody id="ord">${D.apps.map(a => `<tr data-id="${a.id}"><td style="width:36px" class="ix"></td><td><b>${esc(a.biz)}</b></td><td>${typePill(a.type)}</td><td><input class="slot" placeholder="Slot (pilihan)" value="${esc(a.slot)}" style="width:150px"></td><td class="num"><button class="btn-ghost up" aria-label="Naik">↑</button> <button class="btn-ghost dn" aria-label="Turun">↓</button></td></tr>`).join('')}</tbody></table></div>
  <div class="foot"><button class="btn-solid" id="sv">Simpan</button><span class="spacer"></span>${S.status === 'Dibuka' ? '<button class="btn-line" id="cl">Tutup sesi & kunci</button>' : '<button class="btn-line" id="op">Buka semula sesi</button>'}</div></div>`;
  const num = () => document.querySelectorAll('#ord tr').forEach((r, i) => r.querySelector('.ix').textContent = i + 1); num();
  document.querySelectorAll('.up').forEach(b => b.onclick = () => { const r = b.closest('tr'); if (r.previousElementSibling) r.parentNode.insertBefore(r, r.previousElementSibling); num(); });
  document.querySelectorAll('.dn').forEach(b => b.onclick = () => { const r = b.closest('tr'); if (r.nextElementSibling) r.parentNode.insertBefore(r.nextElementSibling, r); num(); });
  $('#sv').onclick = () => act('apiSaveSesi', 'Sesi disimpan', { nama: $('#s_n').value, tarikh: $('#s_t').value, masa: $('#s_m').value, order: [...document.querySelectorAll('#ord tr')].map(r => ({ id: +r.dataset.id, slot: r.querySelector('.slot').value.trim() })) });
  const cl = $('#cl'); if (cl) cl.onclick = () => armed(cl, 'Sahkan tutup sesi', () => act('apiSetSesiStatus', 'Sesi ditutup', 'Ditutup'));
  const op = $('#op'); if (op) op.onclick = () => act('apiSetSesiStatus', 'Sesi dibuka', 'Dibuka');
}

function panel() {
  $('#main').innerHTML = head('Panel', 'Evaluators', '<button class="btn-solid" id="ap">+ Tambah panel</button>') + `
  <div class="card tw"><table><thead><tr><th>Nama</th><th>E-mel</th><th>Peranan</th><th>Status</th><th></th></tr></thead><tbody>
  ${D.panels.map((p, i) => `<tr><td><b>${esc(p.nama)}</b></td><td>${esc(p.emel)}</td><td>${esc(p.peranan)}</td><td><span class="pill ${p.status === 'Aktif' ? 'p-ok' : 'p-mute'}">${esc(p.status)}</span></td><td class="num">${p.peranan.toLowerCase() === 'panel' ? `<button class="btn-ghost tg" data-i="${i}">${p.status === 'Aktif' ? 'Nyahaktif' : 'Aktifkan'}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
  <div class="card detail" id="addp" hidden><h3>Tambah panel</h3><div class="f"><label>Nama<input id="p_n"></label><label>E-mel<input id="p_e" type="email"></label></div><div class="foot"><button class="btn-solid" id="sp">Simpan</button></div></div>`;
  $('#ap').onclick = () => { $('#addp').hidden = false; $('#p_n').focus(); };
  $('#sp').onclick = () => act('apiSavePanel', 'Panel disimpan', { nama: $('#p_n').value.trim(), emel: $('#p_e').value.trim(), status: 'Aktif' });
  document.querySelectorAll('.tg').forEach(b => b.onclick = () => { const p = D.panels[+b.dataset.i]; act('apiSavePanel', 'Status dikemas kini', { nama: p.nama, emel: p.emel, status: p.status === 'Aktif' ? 'Tidak aktif' : 'Aktif' }); });
}

function rubrik() {
  $('#main').innerHTML = head('Rubrik', `Versi ${D.sesi.versi} digunakan sesi · versi terkini ${D.versi}`, '<button class="btn-solid" id="nv">Simpan sebagai versi baharu</button>') + `
  <div class="card">${D.crit.map((c, i) => `<div class="rubrow" data-i="${i}"><span class="no">${c.id}</span><div><input class="bm" value="${esc(c.bm)}"><i><input class="en" value="${esc(c.en)}" style="margin-top:4px;width:100%"></i></div><input class="mx" type="number" min="1" value="${c.max}" aria-label="Markah maksimum"><div class="sub"><textarea class="sb" rows="2" style="width:100%">${esc(c.sub)}</textarea><div class="anch"><div><b>Tahap 5</b><textarea class="a5" rows="3" style="width:100%">${esc(c.a5)}</textarea></div><div><b>Tahap 3</b><textarea class="a3" rows="3" style="width:100%">${esc(c.a3)}</textarea></div><div><b>Tahap 1</b><textarea class="a1" rows="3" style="width:100%">${esc(c.a1)}</textarea></div></div>${c.els.length ? `<b style="font-size:12px">Elemen semakan (satu setiap baris)</b><textarea class="el" rows="${c.els.length}" style="width:100%">${esc(c.els.join('\n'))}</textarea>` : ''}</div></div>`).join('')}
  <p class="num" style="font-size:15px;margin:12px 0 0"><b>Jumlah markah maksimum: <span id="rt"></span></b> <span id="rv"></span></p></div>
  <div class="card" style="margin-top:14px"><h3>Cip ulasan pantas <i>satu setiap baris</i></h3><textarea id="chips" rows="6" style="width:100%">${esc(D.chips.join('\n'))}</textarea>
  <label class="chip" style="margin-top:10px"><input type="checkbox" id="use"> Guna versi baharu untuk sesi ini (hanya jika belum ada penilaian dihantar)</label></div>`;
  const sum = () => { const t = [...document.querySelectorAll('.mx')].reduce((a, i) => a + (+i.value || 0), 0); $('#rt').textContent = t; $('#rv').innerHTML = t === 100 ? '<span class="pill p-ok">sah</span>' : '<span class="pill p-bad">mesti 100</span>'; }; sum();
  document.querySelectorAll('.mx').forEach(i => i.oninput = sum);
  $('#nv').onclick = () => {
    const crit = [...document.querySelectorAll('.rubrow')].map(r => ({ id: D.crit[+r.dataset.i].id, bm: r.querySelector('.bm').value, en: r.querySelector('.en').value, max: +r.querySelector('.mx').value, sub: r.querySelector('.sb').value, a5: r.querySelector('.a5').value, a3: r.querySelector('.a3').value, a1: r.querySelector('.a1').value, els: r.querySelector('.el') ? r.querySelector('.el').value.split('\n').map(s => s.trim()).filter(Boolean) : [] }));
    act('apiSaveRubrik', 'Rubrik disimpan sebagai versi baharu', crit, $('#chips').value.split('\n').map(s => s.trim()).filter(Boolean), $('#use').checked);
  };
}

function keputusan() {
  const K = D.keputusan, P = K.panels;
  $('#main').innerHTML = head('Keputusan', 'Results · purata panel /100', '<button class="btn-line" id="rf">Kemas kini tab Sheet</button>') + `
  <div class="card tw"><table><thead><tr><th>Rank</th><th>Perniagaan</th><th>Jenis</th>${P.map((p, i) => `<th class="num" title="${esc(p.nama)}">P${i + 1}</th>`).join('')}<th class="num">Dinilai</th><th class="num">Purata</th><th class="num">Layak</th><th>Status akhir</th></tr></thead><tbody>
  ${K.rows.map(r => `<tr class="click" data-id="${r.id}"><td><b style="font-size:18px;color:var(--maroon)">${r.rank || '–'}</b></td><td><b>${esc(r.biz)}</b></td><td>${typePill(r.type)}</td>${r.sc.map(s => `<td class="num">${s == null ? '<span style="color:var(--muted)">–</span>' : s}</td>`).join('')}<td class="num">${r.n}/${P.length}</td><td class="num"><b>${r.avg == null ? '–' : r.avg.toFixed(2)}</b></td><td class="num">${r.layak}/${r.n}</td><td><select class="fin" data-id="${r.id}" aria-label="Status akhir">${['Belum', 'Lulus', 'Tidak lulus'].map(o => `<option ${(r.final || 'Belum') === o ? 'selected' : ''}>${o}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
  <p class="note">P1–P${P.length}: ${P.map((p, i) => `P${i + 1} ${esc(short(p.nama))}`).join(' · ')}. Admin menetapkan status akhir. Klik baris untuk melihat markah dan ulasan setiap panel.</p><div id="kd"></div>`;
  $('#rf').onclick = () => act('apiRefreshKeputusan', 'Tab Keputusan dalam sheet dikemas kini');
  document.querySelectorAll('.fin').forEach(s => { s.onclick = e => e.stopPropagation(); s.onchange = () => act('apiSetStatusAkhir', 'Status akhir disimpan', +s.dataset.id, s.value); });
  document.querySelectorAll('tr.click').forEach(r => r.onclick = () => kdetail(+r.dataset.id));
  if (openKey) kdetail(openKey);
}
function kdetail(id) {
  openKey = id; const a = D.apps.find(x => x.id === id);
  $('#kd').innerHTML = `<div class="card detail"><h3>${esc(a.biz)} <i>markah setiap panel</i></h3><div class="tw"><table><thead><tr><th>Panel</th>${D.crit.map(c => `<th class="num">${c.id} /${c.max}</th>`).join('')}<th class="num">Jumlah</th><th>Layak</th><th>Ulasan</th><th></th></tr></thead><tbody>
  ${D.keputusan.panels.map(p => { const n = sent(id, p.emel); return `<tr><td>${esc(short(p.nama))}</td>${n ? n.mk.map(m => `<td class="num">${m}</td>`).join('') : D.crit.map(() => '<td class="num">–</td>').join('')}<td class="num"><b>${n ? n.total : '–'}</b></td><td>${n ? esc(n.ok) : ''}</td><td>${n ? esc(n.cm) : ''}${n && n.status === 'Draf' ? ' <span class="pill p-warn">draf</span>' : ''}</td><td class="num">${n && n.status === 'Dihantar' ? `<button class="btn-ghost ro" data-e="${esc(p.emel)}">Buka semula</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div></div>`;
  document.querySelectorAll('.ro').forEach(b => b.onclick = () => armed(b, 'Sahkan', () => act('apiReopen', 'Penilaian dibuka semula', id, b.dataset.e)));
}

function log() {
  $('#main').innerHTML = head('Log suntingan', 'Audit trail') + `<div class="card tw"><table><thead><tr><th>Masa</th><th>Pengguna</th><th>Tindakan</th><th>Butiran</th></tr></thead><tbody>${D.log.map(l => `<tr><td>${esc(l.masa)}</td><td>${esc(l.user)}</td><td>${esc(l.act)}</td><td>${esc(l.det)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ===================== PANEL (PENILAI) ===================== */
let cur = 0, openAnch = null, saveT = null, armSend = false, saving = '';
async function loadPanel() {
  D = await rpc('apiPanelData');
  D.apps.forEach(a => { if (!D.mine[a.id]) D.mine[a.id] = { lv: Array(D.crit.length).fill(0), mk: Array(D.crit.length).fill(0), els: [], cm: '', ok: '', status: 'Draf' }; });
  evalView();
}
const tot = m => m.mk.reduce((a, b) => a + b, 0);
function queueSave() {
  const a = D.apps[cur], m = D.mine[a.id]; if (m.status === 'Dihantar') return;
  saving = 'Menyimpan…'; const s = $('#sv'); if (s) s.textContent = saving;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { await rpc('apiSaveEval', a.id, m, false); saving = 'Draf disimpan automatik / Draft saved'; } catch (e) { saving = 'Gagal menyimpan: ' + e.message; }
    const s2 = $('#sv'); if (s2) s2.textContent = saving;
  }, 900);
}
function evalView() {
  const a = D.apps[cur], m = D.mine[a.id], closed = D.sesi.status !== 'Dibuka', lock = m.status === 'Dihantar' || closed;
  const crit = D.crit, el = crit.find(c => c.els.length);
  app.innerHTML = `<div class="eval"><aside>
   <div class="cal"><span class="tag">Calon ${cur + 1} / ${D.apps.length}</span><span class="note">${a.slot ? 'Slot ' + esc(a.slot) : esc(D.sesi.tarikh) + ' · ' + esc(D.sesi.masa)}</span></div>
   <h2>${esc(a.biz)}</h2><div style="margin-bottom:10px">${typePill(a.type)} <span class="note">${esc(a.kind)}</span></div>
   <div class="card">${a.st.map(s => `<dl class="kv" style="margin:0 0 10px"><dt>Nama</dt><dd>${esc(s.n)}</dd><dt>No. Matrik</dt><dd>${esc(s.m)}</dd><dt>No. KP</dt><dd>${esc(s.kp)}</dd><dt>Tahun</dt><dd>${esc(s.yr)}</dd><dt>Fakulti</dt><dd>${esc(s.fac)}</dd><dt>Kursus</dt><dd>${esc(s.course)}</dd><dt>CGPA</dt><dd>${s.cgpa.toFixed(2)}</dd></dl>`).join('')}
    <dl class="kv" style="margin:0"><dt>Syarikat / SSM</dt><dd>${esc(a.biz)} · ${esc(a.ssm)}</dd><dt>Jenis</dt><dd>${esc(a.kind)}</dd></dl></div>
   ${a.plan ? `<a class="openplan" href="${esc(a.plan)}" target="_blank" rel="noopener">📄 Buka cadangan perniagaan<small>Open business proposal</small></a>` : ''}
   <p class="note">Anda hanya melihat penilaian anda sendiri / You only see your own scores</p>
   <div class="foot"><button class="btn-line" id="pv" ${cur === 0 ? 'disabled' : ''}>◀ Calon ${cur}</button><span class="spacer"></span><button class="btn-line" id="nx" ${cur === D.apps.length - 1 ? 'disabled' : ''}>Calon ${cur + 2} ▶</button></div>
  </aside><section>
   <div class="head" style="margin-bottom:6px"><div><h2 style="font-size:22px">Penilaian <span class="note" style="font-weight:400">Evaluation · pilih tahap, laras markah jika perlu</span></h2><p>Tahap: 5 Cemerlang · 4 Baik · 3 Memuaskan · 2 Kurang · 1 Lemah</p></div></div>
   ${m.status === 'Dihantar' ? '<div class="lock">Skor telah dihantar dan dikunci. Hubungi admin untuk membuka semula.</div>' : closed ? '<div class="lock" style="background:var(--warn-soft);color:var(--warn)">Sesi telah ditutup.</div>' : ''}
   ${crit.map((c, i) => `<div class="crit"><div><h4>${esc(c.bm)} <button data-an="${i}" aria-label="Anchor ${esc(c.bm)}">ⓘ</button></h4><small>${esc(c.en)} · /${c.max}</small>
     ${c.els.length ? `<div class="els">${c.els.map((e, k) => `<label><input type="checkbox" data-el="${k}" ${m.els[k] ? 'checked' : ''} ${lock ? 'disabled' : ''}>${esc(e)}</label>`).join('')}</div><small>Semak ${c.els.length} elemen: ${c.els.filter((e, k) => m.els[k]).length}/${c.els.length}</small>` : ''}</div>
     <div class="lv" role="group" aria-label="Tahap">${[1, 2, 3, 4, 5].map(n => `<button data-c="${i}" data-l="${n}" aria-pressed="${m.lv[i] === n}" ${lock ? 'disabled' : ''}>${n}</button>`).join('')}</div>
     <div class="mk"><input type="number" min="0" max="${c.max}" step="1" value="${m.mk[i]}" data-m="${i}" aria-label="Markah ${esc(c.bm)}" ${lock ? 'disabled' : ''}>/${c.max}</div>
     <div class="anchbox ${openAnch === i ? 'on' : ''}"><div class="anch"><div><b>Tahap 5</b>${esc(c.a5)}</div><div><b>Tahap 3</b>${esc(c.a3)}</div><div><b>Tahap 1</b>${esc(c.a1)}</div></div><small>${esc(c.sub)}. Tahap 4 dan 2 berada di antara.</small></div></div>`).join('')}
   <div class="card"><div class="chips" style="margin-bottom:10px"><span class="note">Ulasan pantas / Quick comments:</span>${D.chips.map((c, k) => `<button class="chip" data-chip="${k}" ${lock ? 'disabled' : ''}>${esc(c)}</button>`).join('')}</div>
    <div class="f"><label class="wide">Ulasan panel<textarea id="cm" rows="2" ${lock ? 'disabled' : ''}>${esc(m.cm)}</textarea></label></div>
    <div class="layak"><b>Pelajar layak?</b><label><input type="radio" name="ok" value="Ya" ${m.ok === 'Ya' ? 'checked' : ''} ${lock ? 'disabled' : ''}> Ya</label><label><input type="radio" name="ok" value="Tidak" ${m.ok === 'Tidak' ? 'checked' : ''} ${lock ? 'disabled' : ''}> Tidak</label></div></div>
   <div class="foot"><div class="total"><small>JUMLAH / TOTAL</small><b>${tot(m)}</b><span> / 100</span></div><span class="note" id="sv">${lock ? '' : esc(saving)}</span><span class="spacer"></span>
    <button class="btn-solid" id="send" ${lock ? 'disabled' : ''}>${armSend ? 'Sahkan: hantar & kunci' : 'Hantar skor & kunci'}</button></div>
  </section></div>`;
  const go = d => { cur += d; openAnch = null; armSend = false; saving = ''; evalView(); };
  $('#pv').onclick = () => go(-1); $('#nx').onclick = () => go(1);
  app.querySelectorAll('[data-an]').forEach(b => b.onclick = () => { openAnch = openAnch === +b.dataset.an ? null : +b.dataset.an; evalView(); });
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { const i = +b.dataset.c, l = +b.dataset.l; m.lv[i] = l; m.mk[i] = Math.round(l / 5 * crit[i].max); armSend = false; queueSave(); evalView(); });
  app.querySelectorAll('[data-m]').forEach(inp => inp.onchange = () => { const i = +inp.dataset.m; m.mk[i] = Math.max(0, Math.min(crit[i].max, Math.round(+inp.value || 0))); armSend = false; queueSave(); evalView(); });
  app.querySelectorAll('[data-el]').forEach(c => c.onchange = () => { m.els[+c.dataset.el] = c.checked; queueSave(); evalView(); });
  app.querySelectorAll('[data-chip]').forEach(c => c.onclick = () => { const t = D.chips[+c.dataset.chip]; m.cm = (m.cm ? m.cm + '; ' : '') + t; queueSave(); evalView(); });
  const cm = $('#cm'); if (cm) cm.oninput = e => { m.cm = e.target.value; queueSave(); };
  app.querySelectorAll('[name=ok]').forEach(r => r.onchange = () => { m.ok = r.value; queueSave(); });
  $('#send').onclick = async () => {
    if (m.lv.some(x => x < 1)) return toast('Pilih tahap bagi semua kriteria', true);
    if (!m.ok) return toast('Pilih sama ada pelajar layak', true);
    if (!armSend) { armSend = true; evalView(); return; }
    clearTimeout(saveT);
    try { D.mine[a.id] = await rpc('apiSaveEval', a.id, m, true); toast('Skor dihantar dan dikunci'); } catch (e) { toast(e.message, true); }
    armSend = false; evalView();
  };
}
start();
</script>
